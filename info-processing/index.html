지 가능한 모든 실행 흐름을 한 번씩 지나도록 하는 기준.", "s": false}]}, {"ch": "7. 애플리케이션 테스트 관리", "t": "테스트 하네스", "star": true, "abbr": "", "items": [{"k": "T", "a": "테스트 하네스 (Test Harness)", "b": "시험을 실행하고 결과를 확인하는 데 필요한 코드·데이터·도구를 모아 둔 환경.", "s": false}, {"k": "T", "a": "테스트 드라이버 (Test Driver)", "b": "아직 없는 상위 모듈 역할을 대신해 하위 모듈을 호출하고 결과를 받아 오는 임시 프로그램.\n상향식 통합 테스트에 사용", "s": false}, {"k": "T", "a": "테스트 스텁 (Test Stub)", "b": "아직 없는 하위 모듈 자리를 대신해 호출을 받고 미리 정한 값을 돌려주는 임시 모듈.\n하향식 통합 테스트에 사용", "s": false}, {"k": "T", "a": "테스트 케이스 (Test Case)", "b": "특정 요구사항을 확인하려고 설계한 입력값·실행 조건·기대 결과의 묶음.\n3요소: 입력값, 실행 조건, 기대 결과", "s": false}, {"k": "T", "a": "테스트 시나리오 (Test Scenario)", "b": "여러 케이스를 실제 사용 흐름에 맞춰 순서대로 엮어 놓은 동작 절차.", "s": false}, {"k": "T", "a": "테스트 슈트 (Test Suite)", "b": "같은 대상이나 목적을 위해 실행할 여러 케이스를 한데 모은 집합.", "s": false}, {"k": "T", "a": "테스트 스크립트 (Test Script)", "b": "케이스의 실행 순서와 절차를 자동으로 돌릴 수 있게 적어 둔 명세나 코드.", "s": false}, {"k": "T", "a": "목 오브젝트 (Mock Object)", "b": "실제 협력 객체 대신 넣는 가짜 객체로, 미리 정해 둔 조건이 오면 예정된 응답과 행동을 하도록 꾸민 것.", "s": false}]}, {"ch": "7. 애플리케이션 테스트 관리", "t": "분석 도구", "star": false, "abbr": "", "items": [{"k": "T", "a": "정적 분석 도구 (Static Analysis Tool)", "b": "프로그램을 실행하지 않고 소스 코드만 살펴 코딩 규칙 위반·잠재 결함·복잡도를 찾아내는 도구.\n예: PMD, SonarQube, Cppcheck, Checkstyle", "s": false}, {"k": "T", "a": "동적 분석 도구 (Dynamic Analysis Tool)", "b": "프로그램을 실제로 실행하면서 메모리 누수·스레드 결함·성능 문제를 찾아내는 도구.\n예: Valgrind, Avalanche", "s": false}, {"k": "T", "a": "테스트 자동화 도구 (Test Automation Tool)", "b": "케이스 실행·결과 비교·보고처럼 반복되는 시험 작업을 자동으로 처리해 주는 도구.\n유형: 정적 분석, 테스트 실행, 성능 테스트, 테스트 통제 도구", "s": false}, {"k": "N", "a": "PMD·SonarQube·Cppcheck·Checkstyle은 실행 없이 코드만 검사하므로 모두 정적 분석 도구다."}]}, {"ch": "7. 애플리케이션 테스트 관리", "t": "애플리케이션 성능 지표", "star": false, "abbr": "처응경자", "items": [{"k": "T", "a": "처리량 (Throughput)", "b": "일정 시간 동안 애플리케이션이 처리해 낸 트랜잭션(요청)의 수로, 단위 시간당 작업량.", "s": false}, {"k": "T", "a": "응답 시간 (Response Time)", "b": "사용자가 요청을 보낸 순간부터 첫 응답이 돌아오기까지 걸린 시간.", "s": false}, {"k": "T", "a": "경과 시간 (Turnaround Time)", "b": "요청을 보낸 순간부터 애플리케이션이 처리를 다 끝내고 결과를 모두 돌려줄 때까지 걸린 시간.", "s": false}, {"k": "T", "a": "자원 사용률 (Resource Usage)", "b": "요청을 처리하는 동안 CPU·메모리·네트워크 같은 자원을 얼마나 쓰는지 나타내는 비율.", "s": false}]}, {"ch": "7. 애플리케이션 테스트 관리", "t": "소프트웨어 품질 특성 (ISO/IEC 9126)", "star": false, "abbr": "기신사효유이", "items": [{"k": "T", "a": "기능성 (Functionality)", "b": "소프트웨어가 명시된 요구와 암묵적 요구를 만족하는 기능을 제공하는 정도.\n부특성: 적합성·정확성·상호운용성·보안성·준수성", "s": false}, {"k": "T", "a": "신뢰성 (Reliability)", "b": "정해진 조건에서 일정 기간 동안 고장 없이 요구된 수준의 성능을 유지하는 정도.\n부특성: 성숙성·결함 허용성·회복성", "s": false}, {"k": "T", "a": "사용성 (Usability)", "b": "사용자가 소프트웨어를 쉽게 이해하고 배우고 조작할 수 있으며 매력을 느끼는 정도.\n부특성: 이해성·학습성·운용성·친밀성", "s": false}, {"k": "T", "a": "효율성 (Efficiency)", "b": "주어진 조건에서 투입한 시간·메모리 같은 자원에 비해 적절한 성능을 내는 정도.\n부특성: 시간 반응·자원 활용", "s": false}, {"k": "T", "a": "유지보수성 (Maintainability)", "b": "요구가 바뀌거나 결함이 생겼을 때 소프트웨어를 분석·수정·검증하기 쉬운 정도.\n부특성: 분석성·변경성·안정성·시험성", "s": false}, {"k": "T", "a": "이식성 (Portability)", "b": "소프트웨어를 다른 하드웨어나 운영체제로 옮겨도 큰 수정 없이 동작할 수 있는 정도.\n부특성: 적응성·설치성·공존성·대체성", "s": false}, {"k": "N", "a": "후속 표준 ISO/IEC 25010은 호환성·보안성을 더해 8개 특성으로 늘렸다."}]}, {"ch": "8. 운영체제 · 네트워크", "t": "프로세스", "star": false, "abbr": "", "items": [{"k": "T", "a": "프로세스 (Process)", "b": "실행 중인 프로그램으로, 운영체제로부터 CPU·메모리 등 자원을 할당받아 동작하는 작업 단위", "s": false}, {"k": "T", "a": "스레드 (Thread)", "b": "프로세스 안에서 실행되는 흐름의 단위. 같은 프로세스 안에서 코드·데이터·자원은 공유하고 스택과 레지스터는 따로 갖는 것", "s": false}, {"k": "Q", "a": "프로세스 상태 전이의 기본 흐름은?", "b": "생성(New) → 준비(Ready) → 실행(Running) → 종료(Terminated). 실행 중 입출력을 요청하면 대기(Waiting/Blocked)로 갔다가 준비로 돌아온다", "s": false}, {"k": "T", "a": "디스패치 (Dispatch)", "b": "준비 상태의 프로세스 중 하나를 스케줄러가 골라 CPU를 넘겨 실행 상태로 옮기는 전이", "s": false}, {"k": "Q", "a": "실행 → 준비 전이(할당 시간 만료)의 이름은?", "b": "타임아웃 (Timeout, 타이머 런아웃)", "s": false}, {"k": "Q", "a": "실행 → 대기 전이(입출력 요청)의 이름은?", "b": "블록 (Block)", "s": false}, {"k": "Q", "a": "대기 → 준비 전이(입출력 완료)의 이름은?", "b": "웨이크업 (Wake Up)", "s": false}, {"k": "T", "a": "문맥 교환 (Context Switching)", "b": "CPU를 다른 프로세스에 넘길 때 현재 레지스터 등 실행 상태를 저장하고 다음 프로세스의 상태를 복원하는 과정. 잦으면 오버헤드가 커지는 것", "s": false}, {"k": "T", "a": "PCB (Process Control Block)", "b": "운영체제가 프로세스마다 두는 자료 구조로, 식별자·상태·프로그램 카운터·레지스터·스케줄링·메모리 정보를 담는 것", "s": false}]}, {"ch": "8. 운영체제 · 네트워크", "t": "선점형 스케줄링", "star": false, "abbr": "", "items": [{"k": "N", "a": "선점형: 실행 중인 프로세스에게서 운영체제가 CPU를 빼앗아 다른 프로세스에 줄 수 있는 방식"}, {"k": "T", "a": "SRT (Shortest Remaining Time)", "b": "남은 실행 시간이 가장 짧은 프로세스에 CPU를 주고, 더 짧은 작업이 도착하면 실행 중인 것을 중단시키고 넘겨주는 방식", "s": false}, {"k": "T", "a": "라운드 로빈 (Round Robin)", "b": "도착 순서대로 CPU를 주되 정해진 시간 할당량만큼만 실행하고, 끝나지 않으면 준비 큐 맨 뒤로 보내는 시분할용 방식", "s": false}, {"k": "T", "a": "다단계 큐 (Multi-Level Queue, MLQ)", "b": "프로세스를 성격(시스템·대화형·일괄 처리 등)별로 우선순위가 다른 여러 큐에 고정 배치하고 큐마다 다른 스케줄링을 쓰는 방식. 큐 사이 이동이 없는 것", "s": false}, {"k": "T", "a": "다단계 피드백 큐 (Multi-Level Feedback Queue, MLFQ)", "b": "여러 우선순위 큐를 두고 할당 시간을 다 쓴 프로세스는 아래 큐로 내려 큐 사이를 옮기는 방식. 아래 큐일수록 할당 시간이 길고 마지막 큐는 순환 할당인 것", "s": false}]}, {"ch": "8. 운영체제 · 네트워크", "t": "비선점형 스케줄링", "star": true, "abbr": "", "items": [{"k": "N", "a": "비선점형: 한 번 CPU를 받은 프로세스가 끝나거나 스스로 내놓을 때까지 빼앗지 않는 방식"}, {"k": "T", "a": "FCFS (First Come First Served)", "b": "준비 큐에 먼저 도착한 프로세스부터 끝날 때까지 CPU를 주는 방식. 긴 작업 뒤의 짧은 작업이 오래 기다리는 호위 효과가 생기는 것", "s": false}, {"k": "T", "a": "SJF (Shortest Job First)", "b": "실행 시간이 가장 짧은 프로세스부터 처리하는 방식. 평균 대기 시간은 최소지만 긴 작업이 계속 밀릴 수 있는 것", "s": false}, {"k": "T", "a": "HRN (Highest Response-ratio Next)", "b": "대기 시간과 서비스 시간을 함께 따져 응답률이 가장 높은 프로세스를 먼저 실행하는 방식. 짧은 작업 편중과 무기한 대기를 완화하는 것", "s": false}, {"k": "Q", "a": "HRN의 우선순위 계산식은?", "b": "(대기 시간 + 서비스 시간) ÷ 서비스 시간\n값이 클수록 먼저 실행", "s": false}, {"k": "T", "a": "기한부 (Deadline)", "b": "각 작업에 마감 시각을 정해 주고 그 안에 끝내도록 계획하는 방식. 시간 계산 오버헤드가 크고 마감을 넘기면 작업 가치가 떨어지는 것", "s": false}, {"k": "T", "a": "우선순위 (Priority)", "b": "프로세스마다 중요도 값을 매겨 그 값이 가장 높은 것부터 CPU를 주는 방식. 낮은 쪽은 무기한 대기에 빠질 수 있는 것", "s": false}]}, {"ch": "8. 운영체제 · 네트워크", "t": "기아 · 에이징", "star": false, "abbr": "", "items": [{"k": "T", "a": "기아 현상 (Starvation)", "b": "우선순위가 낮거나 실행 시간이 긴 프로세스가 자원을 계속 받지 못하고 무기한 기다리는 상태", "s": false}, {"k": "T", "a": "에이징 (Aging)", "b": "오래 기다린 프로세스일수록 우선순위를 조금씩 올려 무기한 대기를 막는 기법", "s": false}]}, {"ch": "8. 운영체제 · 네트워크", "t": "동기화 · 통신", "star": false, "abbr": "", "items": [{"k": "T", "a": "임계 구역 (Critical Section)", "b": "여러 프로세스가 공유하는 자원에 접근하는 코드 영역으로, 한 번에 하나의 프로세스만 들어가야 하는 부분", "s": false}, {"k": "T", "a": "상호 배제 (Mutual Exclusion)", "b": "한 프로세스가 공유 자원을 쓰는 동안 다른 프로세스가 같은 자원에 접근하지 못하게 막는 것", "s": false}, {"k": "T", "a": "세마포어 (Semaphore)", "b": "정수 변수와 두 개의 원자적 연산으로 공유 자원 접근을 제어하는 동기화 도구. 다익스트라가 제안한 것", "s": false}, {"k": "Q", "a": "세마포어의 두 연산은?", "b": "P 연산(wait: 값이 0보다 크면 1 감소, 아니면 대기)과 V 연산(signal: 1 증가 후 대기 중인 프로세스를 깨움)", "s": false}, {"k": "T", "a": "교착 상태 (Deadlock)", "b": "둘 이상의 프로세스가 서로 상대가 가진 자원을 기다리며 아무도 진행하지 못하는 상태\n필요 조건: 상호 배제·점유와 대기·비선점·환형 대기", "s": false}, {"k": "T", "a": "IPC (Inter-Process Communication)", "b": "독립된 프로세스들이 데이터를 주고받거나 동작을 맞추도록 운영체제가 제공하는 통신 수단\n파이프·메시지 큐·공유 메모리·소켓·시그널·세마포어", "s": false}]}, {"ch": "8. 운영체제 · 네트워크", "t": "운영체제 구성 · 종류", "star": false, "abbr": "", "items": [{"k": "T", "a": "커널 (Kernel)", "b": "운영체제의 핵심으로 메모리에 상주하며 프로세스·메모리·파일·입출력 등 하드웨어 자원을 직접 관리하는 부분", "s": false}, {"k": "T", "a": "셸 (Shell)", "b": "사용자가 입력한 명령을 해석해 핵심부에 전달하는 명령어 해석기. 사용자와 운영체제 핵심부 사이의 인터페이스인 것", "s": false}, {"k": "T", "a": "유닉스 (UNIX)", "b": "벨 연구소에서 만들어 대부분 C 언어로 다시 작성된 다중 사용자·다중 작업 운영체제. 이식성이 높고 계층적 파일 시스템을 갖는 것", "s": false}, {"k": "T", "a": "리눅스 (Linux)", "b": "리누스 토르발스가 유닉스 호환으로 만든 오픈 소스 운영체제 커널. 누구나 소스를 고치고 배포할 수 있는 것", "s": false}, {"k": "T", "a": "안드로이드 (Android)", "b": "리눅스 커널 위에 구글이 만든 모바일 운영체제. 소스가 공개되어 여러 제조사가 쓰며, 앱은 주로 자바·코틀린으로 개발한다", "s": false}, {"k": "Q", "a": "리눅스에서 `chmod 754 파일명`을 실행하면 부여되는 권한은?", "b": "소유자 rwx · 그룹 r-x · 기타 r--\nr=4, w=2, x=1을 더한 숫자를 소유자·그룹·기타 순으로 쓴다", "s": false}]}, {"ch": "8. 운영체제 · 네트워크", "t": "OSI 7계층", "star": true, "abbr": "물데네전세표응", "items": [{"k": "T", "a": "물리 계층 (Physical Layer)", "b": "전송 매체의 전기·기계·기능적 특성을 정해 비트 신호를 실어 보내는 1계층\n단위: 비트 / 장비: 리피터·허브", "s": false}, {"k": "T", "a": "데이터 링크 계층 (Data Link Layer)", "b": "인접 노드 사이의 프레임 전달을 맡고 MAC 주소로 흐름·오류 제어를 하는 2계층\n단위: 프레임 / 장비: 브리지·스위치 / HDLC·PPP·이더넷", "s": false}, {"k": "T", "a": "네트워크 계층 (Network Layer)", "b": "논리 주소(IP)로 여러 망을 거치는 최적 경로를 찾아 목적지까지 전달하는 3계층\n단위: 패킷 / 장비: 라우터 / IP·ARP·ICMP·IGMP", "s": false}, {"k": "T", "a": "전송 계층 (Transport Layer)", "b": "포트 번호로 종단 프로세스 간 신뢰성 있는 전달을 맡고 분할·재조립·흐름·오류 제어를 하는 4계층\n단위: 세그먼트 / TCP·UDP", "s": false}, {"k": "T", "a": "세션 계층 (Session Layer)", "b": "통신하는 양 끝의 대화를 수립·유지·종료하고 동기점(체크포인트)을 두어 대화를 관리하는 5계층", "s": false}, {"k": "T", "a": "표현 계층 (Presentation Layer)", "b": "서로 다른 데이터 형식을 쓰는 시스템이 이해할 수 있도록 코드 변환·암호화·압축을 맡는 6계층\nJPEG·MPEG·ASCII", "s": false}, {"k": "T", "a": "응용 계층 (Application Layer)", "b": "사용자 프로그램이 망 서비스에 접근하도록 창구를 제공하는 최상위 7계층\nHTTP·FTP·SMTP·DNS·TELNET·SNMP", "s": false}]}, {"ch": "8. 운영체제 · 네트워크", "t": "프로토콜", "star": false, "abbr": "", "items": [{"k": "T", "a": "프로토콜 (Protocol)", "b": "서로 다른 시스템이나 장비가 데이터를 주고받기 위해 미리 합의해 둔 통신 규약", "s": false}]}, {"ch": "8. 운영체제 · 네트워크", "t": "프로토콜 기본 요소", "star": false, "abbr": "구의타", "items": [{"k": "T", "a": "구문 (Syntax)", "b": "기본 요소 중 데이터의 형식, 부호화 방법, 신호 수준을 정한 것", "s": false}, {"k": "T", "a": "의미 (Semantics)", "b": "기본 요소 중 전송 제어와 오류 처리를 위한 제어 정보를 정한 것", "s": false}, {"k": "T", "a": "타이밍 (Timing)", "b": "기본 요소 중 통신 속도를 맞추고 메시지 순서를 제어하는 것", "s": false}]}, {"ch": "8. 운영체제 · 네트워크", "t": "네트워크 계층 프로토콜", "star": true, "abbr": "", "items": [{"k": "T", "a": "IP (Internet Protocol)", "b": "패킷에 출발지·목적지 논리 주소를 붙여 경로를 따라 넘기는 비연결형 프로토콜. 도착을 보장하지 않는 최선 노력 방식인 것", "s": false}, {"k": "T", "a": "ARP (Address Resolution Protocol)", "b": "IP 주소를 알 때 그에 대응하는 물리(MAC) 주소를 알아내는 프로토콜", "s": false}, {"k": "T", "a": "RARP (Reverse Address Resolution Protocol)", "b": "자신의 물리(MAC) 주소를 근거로 서버에 물어 자기 IP 주소를 얻어내는 프로토콜", "s": false}, {"k": "T", "a": "ICMP (Internet Control Message Protocol)", "b": "IP 패킷 처리 중 생긴 오류나 상태 정보를 송신 측에 알리는 프로토콜\nping·traceroute가 이용", "s": false}, {"k": "T", "a": "IGMP (Internet Group Management Protocol)", "b": "호스트와 라우터 사이에서 멀티캐스트 수신 집단의 가입·탈퇴 정보를 관리하는 프로토콜", "s": false}, {"k": "T", "a": "IPv4 (Internet Protocol version 4)", "b": "32비트 주소를 8비트씩 넷으로 나눠 점으로 구분한 10진수로 표기하는 주소 체계. A~E 클래스로 나뉘는 것\n예: 192.168.0.1", "s": false}, {"k": "T", "a": "IPv6 (Internet Protocol version 6)", "b": "주소 고갈을 풀려고 만든 128비트 주소 체계. 16비트씩 여덟 부분을 콜론으로 구분한 16진수로 쓰고 보안·자동 구성을 강화한 것", "s": false}]}, {"ch": "8. 운영체제 · 네트워크", "t": "IPv4 / IPv6 전환 기술", "star": false, "abbr": "", "items": [{"k": "T", "a": "듀얼 스택 (Dual Stack)", "b": "한 호스트나 라우터에 두 버전의 프로토콜을 모두 탑재해 통신 상대에 따라 골라 쓰는 방식", "s": false}, {"k": "T", "a": "터널링 (Tunneling)", "b": "IPv6 패킷을 IPv4 패킷 안에 캡슐화해 IPv4 망을 통과시키는(또는 그 반대) 방식", "s": false}, {"k": "T", "a": "주소 변환 · 헤더 변환 (Header Translation)", "b": "중간 장비가 패킷 머리 정보를 상대 버전 형식으로 고쳐 써서 서로 다른 버전의 호스트끼리 통신하게 하는 방식", "s": false}]}, {"ch": "8. 운영체제 · 네트워크", "t": "전송 방식", "star": false, "abbr": "", "items": [{"k": "T", "a": "유니캐스트 (Unicast)", "b": "송신자 하나가 특정 수신자 하나에게 보내는 1:1 방식. IPv4·IPv6 모두 사용", "s": false}, {"k": "T", "a": "멀티캐스트 (Multicast)", "b": "송신자 하나가 가입한 특정 집단의 구성원들에게만 보내는 1:N 방식. IPv4·IPv6 모두 사용", "s": false}, {"k": "T", "a": "브로드캐스트 (Broadcast)", "b": "같은 망 안의 모든 호스트에게 한꺼번에 보내는 방식. IPv4에만 있고 IPv6에서는 1:N 집단 전송으로 대체된 것", "s": false}, {"k": "T", "a": "애니캐스트 (Anycast)", "b": "같은 주소를 가진 여러 노드 중 경로상 가장 가까운 하나에게만 보내는 방식. IPv6가 주소 유형으로 정의한 것", "s": false}]}, {"ch": "8. 운영체제 · 네트워크", "t": "전송 계층 프로토콜", "star": false, "abbr": "", "items": [{"k": "T", "a": "TCP (Transmission Control Protocol)", "b": "3-way 핸드셰이크로 연결을 맺고 순서 보장·재전송·흐름 제어·혼잡 제어로 신뢰성 있게 전달하는 연결 지향 프로토콜", "s": false}, {"k": "T", "a": "UDP (User Datagram Protocol)", "b": "연결 설정과 확인 응답 없이 보내는 비연결형 프로토콜. 신뢰성은 낮지만 헤더가 작고 빨라 실시간 스트리밍·DNS 질의에 쓰이는 것", "s": false}, {"k": "T", "a": "소켓 (Socket)", "b": "IP 주소와 포트 번호를 묶어 프로세스 간 통신의 끝점을 나타내는 소프트웨어 인터페이스. 응용 프로그램이 전송 계층을 쓰는 창구인 것", "s": false}]}, {"ch": "8. 운영체제 · 네트워크", "t": "라우팅 프로토콜", "star": true, "abbr": "", "items": [{"k": "T", "a": "IGP (Interior Gateway Protocol)", "b": "하나의 자율 시스템(AS) 안에서 라우팅 정보를 교환하는 프로토콜 계열\nRIP·OSPF", "s": false}, {"k": "T", "a": "RIP (Routing Information Protocol)", "b": "거리 벡터(벨만-포드) 알고리즘으로 홉 수가 가장 적은 경로를 고르는 내부 라우팅 프로토콜. 최대 홉 15라 소규모 망용이고 30초마다 갱신하는 것", "s": false}, {"k": "T", "a": "OSPF (Open Shortest Path First)", "b": "링크 상태(다익스트라) 알고리즘으로 망 전체 구조를 파악해 최적 경로를 계산하는 내부 라우팅 프로토콜. 대규모 망에 적합하고 변화가 생기면 즉시 전파하는 것", "s": false}, {"k": "T", "a": "EGP (Exterior Gateway Protocol)", "b": "서로 다른 자율 시스템(AS) 사이에서 라우팅 정보를 주고받는 프로토콜 계열(또는 그 초기 프로토콜)\n대표: BGP", "s": false}, {"k": "T", "a": "BGP (Border Gateway Protocol)", "b": "자율 시스템 사이에서 경로 벡터 방식으로 경로를 교환하는 외부 라우팅 프로토콜. ISP 간 인터넷 백본에 쓰이고 TCP 179번을 쓰는 것", "s": false}]}, {"ch": "8. 운영체제 · 네트워크", "t": "네트워크 장비", "star": false, "abbr": "", "items": [{"k": "T", "a": "리피터 (Repeater)", "b": "약해진 신호를 증폭·재생해 전송 거리를 늘리는 1계층(물리) 장비", "s": false}, {"k": "T", "a": "허브 (Hub)", "b": "여러 장비를 한곳에 모아 연결하고 받은 신호를 모든 포트로 내보내는 1계층 장비. 연결된 장비들이 대역폭을 나눠 쓰는 것", "s": false}, {"k": "T", "a": "브리지 (Bridge)", "b": "MAC 주소를 보고 두 LAN 구간을 이어 프레임을 걸러 전달하는 2계층 장비. 충돌 도메인을 나누는 것", "s": false}, {"k": "T", "a": "스위치 (Switch)", "b": "MAC 주소 테이블로 목적지 포트에만 프레임을 보내는 2계층 장비. 하드웨어 처리라 빠르고 포트마다 전용 대역폭을 주는 것\nL3·L4·L7 제품도 있음", "s": false}, {"k": "T", "a": "라우터 (Router)", "b": "IP 주소를 보고 서로 다른 망을 이어 최적 경로로 패킷을 전달하는 3계층 장비. 브로드캐스트 도메인을 나누는 것", "s": false}, {"k": "T", "a": "게이트웨이 (Gateway)", "b": "프로토콜 구조가 전혀 다른 망끼리 잇기 위해 프로토콜 변환을 해 주는 장비. 주로 4~7계층(전 계층)을 다루는 것", "s": false}]}, {"ch": "8. 운영체제 · 네트워크", "t": "LAN · 매체 접근 제어", "star": false, "abbr": "", "items": [{"k": "T", "a": "LAN (Local Area Network)", "b": "건물·캠퍼스처럼 한정된 지역 안의 장비들을 고속·저오류로 묶는 망. 버스·링·스타형 토폴로지를 쓰는 것", "s": false}, {"k": "T", "a": "이더넷 (Ethernet)", "b": "버스·스타형 구성에서 충돌 감지 방식으로 매체 접근을 제어하는 가장 널리 쓰이는 유선 LAN 기술. IEEE 802.3 표준인 것", "s": false}, {"k": "T", "a": "CSMA/CD (Carrier Sense Multiple Access with Collision Detection)", "b": "보내기 전에 회선이 비었는지 살피고, 보내다 충돌을 감지하면 멈춘 뒤 임의 시간 후 다시 보내는 유선 LAN 매체 접근 방식", "s": false}, {"k": "T", "a": "CSMA/CA (Carrier Sense Multiple Access with Collision Avoidance)", "b": "충돌 감지가 어려운 무선 LAN에서 채널이 비어도 임의 대기 시간을 둔 뒤 보내 충돌을 미리 피하는 매체 접근 방식\nRTS/CTS 사용 가능", "s": false}, {"k": "Q", "a": "IEEE 802.3은?", "b": "CSMA/CD (이더넷, 유선 LAN)", "s": false}, {"k": "Q", "a": "IEEE 802.4는?", "b": "토큰 버스 (Token Bus)", "s": false}, {"k": "Q", "a": "IEEE 802.5는?", "b": "토큰 링 (Token Ring)", "s": false}, {"k": "Q", "a": "IEEE 802.11은?", "b": "무선 LAN (Wi-Fi, CSMA/CA)", "s": false}, {"k": "Q", "a": "IEEE 802.15는?", "b": "WPAN (블루투스·지그비 등 개인 근거리 무선망)", "s": false}]}, {"ch": "8. 운영체제 · 네트워크", "t": "주소 · 망 기술", "star": false, "abbr": "", "items": [{"k": "T", "a": "NAT (Network Address Translation)", "b": "내부망의 사설 IP 주소를 외부와 통신할 때 공인 IP 주소로 바꿔 주는 기술. 공인 주소를 아끼고 내부 구조를 숨기는 것", "s": false}, {"k": "T", "a": "애드혹 네트워크 (Ad-hoc Network)", "b": "기지국·AP 같은 고정 기반 시설 없이 이동 노드끼리 스스로 망을 꾸려 통신하는 무선망. 재난 현장·군사용에 쓰이는 것", "s": false}, {"k": "T", "a": "서브넷 마스크 (Subnet Mask)", "b": "IP 주소에서 네트워크 부분과 호스트 부분을 가르는 32비트 값. 네트워크 비트는 1, 호스트 비트는 0인 것\n예: /24 = 255.255.255.0", "s": false}, {"k": "Q", "a": "`192.168.10.0/24`를 같은 크기의 서브넷 4개로 나눌 때 서브넷 마스크와 서브넷당 쓸 수 있는 호스트 수는?", "b": "`/26` (255.255.255.192), 서브넷당 62개\n서브넷마다 주소 64개 중 네트워크 주소와 브로드캐스트 주소 2개는 호스트에 못 쓴다", "s": false}, {"k": "N", "a": "VPN은 보안 과목에서 다룬다"}]}, {"ch": "8. 운영체제 · 네트워크", "t": "패킷 교환 방식", "star": false, "abbr": "", "items": [{"k": "T", "a": "가상 회선 방식 (Virtual Circuit)", "b": "전송을 시작하기 전에 송수신 사이의 논리적 경로를 먼저 정하고, 모든 패킷이 그 경로를 따라 보낸 순서대로 도착하는 연결형 패킷 교환 방식", "s": false}, {"k": "T", "a": "데이터그램 방식 (Datagram)", "b": "경로를 미리 정하지 않고 패킷마다 독립적으로 그때그때 경로를 골라 보내는 비연결형 패킷 교환 방식. 도착 순서가 뒤바뀔 수 있어 수신 측이 재조립한다", "s": false}]}, {"ch": "8. 운영체제 · 네트워크", "t": "포트 번호", "star": true, "abbr": "", "items": [{"k": "Q", "a": "FTP 데이터 전송 포트는?", "b": "20", "s": false}, {"k": "Q", "a": "FTP 제어 포트는?", "b": "21", "s": false}, {"k": "Q", "a": "SSH 포트는?", "b": "22", "s": false}, {"k": "Q", "a": "TELNET 포트는?", "b": "23", "s": false}, {"k": "Q", "a": "SMTP 포트는?", "b": "25", "s": false}, {"k": "Q", "a": "DNS 포트는?", "b": "53", "s": false}, {"k": "Q", "a": "HTTP 포트는?", "b": "80", "s": false}, {"k": "Q", "a": "POP3 포트는?", "b": "110", "s": false}, {"k": "Q", "a": "IMAP 포트는?", "b": "143", "s": false}, {"k": "Q", "a": "SNMP 포트는?", "b": "161 (UDP)", "s": false}, {"k": "Q", "a": "HTTPS 포트는?", "b": "443", "s": false}]}, {"ch": "8. 운영체제 · 네트워크", "t": "근거리 무선 통신", "star": false, "abbr": "", "items": [{"k": "T", "a": "NFC (Near Field Communication)", "b": "13.56MHz 대역에서 10cm 안팎의 아주 가까운 거리로 기기끼리 데이터를 주고받는 비접촉 무선 통신. 결제·출입 인증에 쓰이는 것", "s": false}, {"k": "T", "a": "RFID (Radio Frequency IDentification)", "b": "사물에 붙인 태그의 정보를 리더기가 전파로 비접촉 판독해 사물을 구별하는 기술. 물류·재고·출입 관리에 쓰이는 것", "s": false}, {"k": "T", "a": "UWB (Ultra-WideBand)", "b": "아주 넓은 주파수 대역에 걸쳐 낮은 전력의 짧은 펄스를 보내는 근거리 무선 기술. 고속 전송과 센티미터 단위 위치 측정에 쓰이는 것", "s": false}, {"k": "T", "a": "피코넷 (Piconet)", "b": "블루투스 등에서 마스터 1대와 최대 7대의 활성 슬레이브가 모여 이루는 작은 무선망", "s": false}, {"k": "T", "a": "WPAN (Wireless Personal Area Network)", "b": "한 사람 주변 약 10m 범위의 기기들을 무선으로 잇는 망. IEEE 802.15로 표준화된 것\n블루투스·지그비·UWB", "s": false}, {"k": "T", "a": "블루투스 (Bluetooth)", "b": "2.4GHz ISM 대역에서 주파수 도약 방식으로 휴대 기기를 근거리 무선 연결하는 기술. IEEE 802.15.1 기반인 것", "s": false}]}, {"ch": "8. 운영체제 · 네트워크", "t": "ATM", "star": false, "abbr": "", "items": [{"k": "T", "a": "ATM (Asynchronous Transfer Mode)", "b": "모든 데이터를 53바이트(헤더 5 + 페이로드 48) 고정 길이 셀로 나눠 통계적으로 다중화해 보내는 고속 교환 방식", "s": false}, {"k": "T", "a": "AAL (ATM Adaptation Layer)", "b": "상위 계층이 넘긴 데이터를 48바이트 셀 페이로드 단위로 분할·재조립해 셀 교환 계층과 이어 주는 계층. 서비스 유형별로 1·2·3/4·5형이 있는 것", "s": false}]}, {"ch": "9. 소프트웨어 개발 보안 · 정보 보안", "t": "정보 보안 3요소", "star": true, "abbr": "기무가", "items": [{"k": "T", "a": "기밀성 (Confidentiality)", "b": "허가받은 사용자만 정보를 열람할 수 있게 하여 권한 없는 노출과 유출을 막는 성질", "s": false}, {"k": "T", "a": "무결성 (Integrity)", "b": "정보가 권한 없이 생성·변경·삭제되지 않고 정확하고 완전한 상태로 유지되는 성질", "s": false}, {"k": "T", "a": "가용성 (Availability)", "b": "권한을 가진 사용자가 필요한 순간에 지체 없이 정보와 시스템을 쓸 수 있는 성질", "s": false}]}, {"ch": "9. 소프트웨어 개발 보안 · 정보 보안", "t": "정보 보안 추가 요소", "star": false, "abbr": "", "items": [{"k": "T", "a": "인증성 (Authenticity)", "b": "정보를 주고받는 상대나 정보의 출처가 주장하는 그 대상이 맞는지 확인할 수 있는 성질", "s": false}, {"k": "T", "a": "부인 방지 (Non-repudiation)", "b": "송신·수신 증거를 남겨 두어 나중에 보낸 사실이나 받은 사실을 부정하지 못하게 하는 성질", "s": false}]}, {"ch": "9. 소프트웨어 개발 보안 · 정보 보안", "t": "접근 통제 절차", "star": false, "abbr": "", "items": [{"k": "T", "a": "식별 (Identification)", "b": "사용자가 ID나 계정명을 제시해 자신이 누구인지 시스템에 밝히는, 접근 통제의 첫 단계", "s": false}, {"k": "T", "a": "인증 (Authentication)", "b": "앞 단계에서 밝힌 신원이 진짜 본인인지 비밀번호·OTP·지문 같은 생체 정보 등으로 검증하는 단계", "s": false}, {"k": "T", "a": "인가 (Authorization)", "b": "검증을 통과한 사용자에게 어떤 자원에 어떤 작업까지 허용할지 권한을 부여하는 단계", "s": false}, {"k": "T", "a": "책임 추적성 (Accountability)", "b": "사용자의 행위를 기록해 두어 누가 언제 무엇을 했는지 나중에 추적·감사할 수 있게 하는 단계", "s": false}, {"k": "Q", "a": "접근 통제 절차를 순서대로 쓰면?", "b": "식별 → 인증 → 인가 → 책임 추적성", "s": false}]}, {"ch": "9. 소프트웨어 개발 보안 · 정보 보안", "t": "접근 통제 정책", "star": false, "abbr": "", "items": [{"k": "T", "a": "강제적 접근 통제 (MAC, Mandatory Access Control)", "b": "주체의 비밀 취급 인가 등급과 객체의 보안 등급(레이블)을 비교해 시스템이 정한 규칙대로만 접근을 허용하는 정책", "s": false}, {"k": "T", "a": "임의적 접근 통제 (DAC, Discretionary Access Control)", "b": "데이터 소유자가 사용자 신원(ID)을 근거로 다른 사용자에게 접근 권한을 재량껏 주고 회수하는 정책\n구현 예: 접근 제어 목록(ACL)", "s": false}, {"k": "T", "a": "역할 기반 접근 통제 (RBAC, Role Based Access Control)", "b": "권한을 개인이 아닌 조직 내 직무·직책에 묶어 두고, 사용자를 그 직무에 배정해 간접적으로 권한을 갖게 하는 정책", "s": false}]}, {"ch": "9. 소프트웨어 개발 보안 · 정보 보안", "t": "접근 통제 보안 모델", "star": false, "abbr": "", "items": [{"k": "T", "a": "벨-라파둘라 모델 (Bell-LaPadula Model)", "b": "기밀성 유지를 목적으로 한 군사용 모델로, 자기보다 높은 등급은 읽지 못하고 낮은 등급에는 쓰지 못하게 하는 모델\nNo Read Up, No Write Down", "s": false}, {"k": "T", "a": "비바 모델 (Biba Model)", "b": "무결성 유지를 목적으로 한 모델로, 자기보다 낮은 등급은 읽지 못하고 높은 등급에는 쓰지 못하게 하는 모델\nNo Read Down, No Write Up", "s": false}, {"k": "T", "a": "클락-윌슨 모델 (Clark-Wilson Model)", "b": "상업 환경의 무결성을 위해 사용자가 데이터를 직접 고치지 못하고 검증된 프로그램(정형 트랜잭션)을 거쳐서만 변경하게 하는 모델\n핵심: 직무 분리", "s": false}, {"k": "T", "a": "만리장성 모델 (Chinese Wall Model, Brewer-Nash)", "b": "이해가 충돌하는 경쟁사들의 정보에 한 사람이 동시에 접근하지 못하도록, 이미 접근한 정보에 따라 이후 권한이 달라지는 모델", "s": false}]}, {"ch": "9. 소프트웨어 개발 보안 · 정보 보안", "t": "대칭 키 암호", "star": true, "abbr": "", "items": [{"k": "T", "a": "대칭 키 암호 (Symmetric Key Cryptography)", "b": "암호화와 복호화에 같은 비밀 키를 쓰는 방식으로, 속도는 빠르지만 키 분배가 어렵고 사용자가 늘면 키 개수가 급증한다\nn명이 통신할 때 필요한 키 수 n(n-1)/2", "s": false}, {"k": "T", "a": "DES (Data Encryption Standard)", "b": "1970년대 미국 연방 표준으로 채택된 블록 암호로, 64비트 블록을 56비트 키로 16라운드 처리하는 Feistel 구조 방식", "s": false}, {"k": "T", "a": "AES (Advanced Encryption Standard)", "b": "앞선 56비트 키 표준을 대체하려고 공모로 선정된 미국 표준 블록 암호로, 128비트 블록에 128·192·256비트 키를 쓰는 SPN 구조 방식", "s": false}, {"k": "T", "a": "SEED", "b": "1999년 한국인터넷진흥원(KISA)이 개발한 국내 표준 블록 암호로, 128비트 블록을 Feistel 구조로 처리하는 방식", "s": false}, {"k": "T", "a": "ARIA (Academy, Research Institute, Agency)", "b": "2004년 국가정보원과 학계·연구소가 함께 개발한 국내 표준 블록 암호로, 128비트 블록에 128·192·256비트 키를 쓰는 SPN 구조 방식", "s": false}, {"k": "T", "a": "IDEA (International Data Encryption Algorithm)", "b": "스위스에서 개발된 블록 암호로, 64비트 블록을 128비트 키로 처리하며 성질이 다른 세 가지 대수 연산을 섞어 쓰는 방식\nPGP 전자우편 보안에 사용", "s": false}, {"k": "T", "a": "RC4 (Rivest Cipher 4)", "b": "키로 만든 의사 난수 키 스트림을 평문과 바이트 단위로 XOR하는 스트림 암호로, 과거 SSL·WEP에 쓰였으나 취약점이 밝혀진 방식", "s": false}, {"k": "T", "a": "LFSR (Linear Feedback Shift Register)", "b": "일부 비트를 XOR한 결과를 다시 입력으로 넣으며 비트를 한 칸씩 밀어내는 레지스터로, 스트림 암호의 키 스트림 생성에 쓰이는 회로", "s": false}, {"k": "T", "a": "Skipjack", "b": "미국 국가안보국(NSA)이 개발한 블록 암호로, 64비트 블록을 80비트 키로 처리한다. 음성 통신 암호화용 클리퍼 칩에 탑재되었다", "s": false}]}, {"ch": "9. 소프트웨어 개발 보안 · 정보 보안", "t": "비대칭 키 암호", "star": false, "abbr": "", "items": [{"k": "T", "a": "비대칭 키 암호 (Asymmetric Key Cryptography)", "b": "누구에게나 알리는 키와 본인만 가진 키 한 쌍을 써서, 한쪽으로 암호화하면 다른 쪽으로만 풀리게 하는 방식\n키 분배는 쉽지만 연산이 느림, 필요한 키 수 2n", "s": false}, {"k": "T", "a": "RSA (Rivest-Shamir-Adleman)", "b": "1977년 MIT의 세 연구자가 고안한 공개 키 방식으로, 큰 수를 소인수분해하기 어렵다는 점에 안전성을 둔 방식", "s": false}, {"k": "T", "a": "DSA (Digital Signature Algorithm)", "b": "미국 NIST 표준(DSS)으로 채택된, 메시지 서명의 생성과 검증에만 쓰는 알고리즘으로 이산 대수 문제의 어려움에 기반한다", "s": false}, {"k": "T", "a": "ECC (Elliptic Curve Cryptography)", "b": "y² = x³ + ax + b 형태 곡선 위의 점 연산에 기반한 공개 키 방식으로, 소인수분해 기반 방식보다 훨씬 짧은 키로 같은 강도를 내는 방식", "s": false}, {"k": "T", "a": "디피-헬먼 키 교환 (Diffie-Hellman Key Exchange)", "b": "비밀 값을 직접 보내지 않고 공개된 값만 주고받아 양측이 같은 대칭 키를 만들어 내는 방식으로, 이산 대수 문제에 기반한다\n1976년 최초로 공개 키 개념 제시", "s": false}, {"k": "T", "a": "엘가말 (ElGamal)", "b": "이산 대수 문제에 기반한 공개 키 방식으로, 같은 평문도 매번 다른 암호문이 나오며 암호문 길이가 평문의 약 두 배가 되는 방식", "s": false}]}, {"ch": "9. 소프트웨어 개발 보안 · 정보 보안", "t": "해시", "star": false, "abbr": "", "items": [{"k": "T", "a": "SHA (Secure Hash Algorithm)", "b": "NIST가 표준으로 정한 해시 함수 계열로, 160비트를 출력하는 1세대 이후 224~512비트 출력의 2세대와 Keccak 기반 3세대가 나왔다", "s": false}, {"k": "T", "a": "MD5 (Message-Digest Algorithm 5)", "b": "로널드 리베스트가 만든 128비트 출력 해시 함수로, 충돌을 만드는 공격이 실증되어 보안 용도로는 더 이상 권장되지 않는 방식", "s": false}]}, {"ch": "9. 소프트웨어 개발 보안 · 정보 보안", "t": "해시 함수의 특성", "star": false, "abbr": "역제충", "items": [{"k": "T", "a": "역상 저항성 (Preimage Resistance)", "b": "해시값만 주어졌을 때 그 값을 만들어 내는 입력을 찾아내는 것이 계산상 불가능한 성질\n일방향성이라고도 함", "s": false}, {"k": "T", "a": "제2 역상 저항성 (Second Preimage Resistance)", "b": "입력 하나가 주어졌을 때 그것과 해시값이 같은 다른 입력을 찾아내는 것이 계산상 불가능한 성질", "s": false}, {"k": "T", "a": "충돌 저항성 (Collision Resistance)", "b": "해시값이 같은 서로 다른 두 입력을 아무 쌍이나 골라 찾아내는 것조차 계산상 불가능한 성질", "s": false}]}, {"ch": "9. 소프트웨어 개발 보안 · 정보 보안", "t": "암호 응용", "star": false, "abbr": "", "items": [{"k": "T", "a": "비트로커 (BitLocker)", "b": "윈도우에 내장된 디스크 전체 암호화 기능으로, TPM 칩과 연동해 볼륨 단위로 저장 데이터를 보호하는 기능\n암호 알고리즘으로 AES 사용", "s": false}, {"k": "T", "a": "솔트 (Salt)", "b": "비밀번호를 해시하기 전에 사용자마다 다른 임의 문자열을 덧붙여, 같은 비밀번호라도 서로 다른 해시값이 나오게 하는 값\n레인보 테이블 공격 대응책", "s": false}, {"k": "T", "a": "키 스트레칭 (Key Stretching)", "b": "해시 연산을 수천 번 이상 반복 적용해 비밀번호 하나를 추측하는 데 드는 시간을 늘림으로써 무차별 대입을 어렵게 하는 기법\n예: PBKDF2, bcrypt, scrypt", "s": false}]}, {"ch": "9. 소프트웨어 개발 보안 · 정보 보안", "t": "서비스 거부 공격", "star": true, "abbr": "", "items": [{"k": "T", "a": "DoS (Denial of Service)", "b": "대량의 요청이나 비정상 패킷으로 대상 시스템의 자원을 고갈시켜 정상 사용자가 서비스를 이용하지 못하게 하는 공격", "s": false}, {"k": "T", "a": "DDoS (Distributed Denial of Service)", "b": "악성코드에 감염된 다수의 좀비 PC를 원격 조종해 여러 곳에서 동시에 한 대상에게 트래픽을 퍼붓는 공격\n구성: 공격자 → 핸들러(마스터) → 에이전트", "s": false}, {"k": "T", "a": "트리누 (Trinoo)", "b": "마스터·에이전트 구조로 여러 호스트에서 동시에 UDP 플러드를 일으키는 초기의 분산 공격 도구", "s": false}, {"k": "T", "a": "TFN (Tribe Flood Network)", "b": "트리누를 발전시킨 분산 공격 도구로, UDP·TCP SYN·ICMP 플러드와 스머프 공격 등을 골라 수행할 수 있는 도구", "s": false}, {"k": "T", "a": "슈타헬드라트 (Stacheldraht)", "b": "독일어로 '철조망'을 뜻하는 분산 공격 도구로, 트리누와 TFN의 기능을 합치고 마스터·에이전트 간 통신을 암호화한 도구", "s": false}, {"k": "T", "a": "죽음의 핑 (Ping of Death)", "b": "허용 최대 크기(65,535바이트)를 넘는 ICMP 에코 요청을 조각내 보내, 재조립 과정에서 대상 시스템을 멈추게 하는 공격", "s": false}, {"k": "T", "a": "SYN 플러딩 (SYN Flooding)", "b": "TCP 연결 요청 패킷만 대량으로 보내고 마지막 응답(ACK)은 주지 않아, 서버의 연결 대기 큐(백로그)를 가득 채우는 공격", "s": false}, {"k": "T", "a": "스머프 (Smurf)", "b": "출발지를 공격 대상 IP로 위조한 ICMP 에코 요청을 네트워크 브로드캐스트 주소로 보내, 다수의 응답이 대상에게 몰리게 하는 공격\n대응: 라우터에서 다이렉트 브로드캐스트 차단", "s": false}, {"k": "T", "a": "랜드 어택 (Land Attack)", "b": "출발지 IP와 목적지 IP를 모두 공격 대상의 주소로 같게 만든 패킷을 보내, 대상이 자기 자신에게 응답하며 루프에 빠지게 하는 공격", "s": false}, {"k": "T", "a": "티어드롭 (Teardrop)", "b": "IP 단편의 오프셋(Fragment Offset) 값을 겹치거나 어긋나게 조작해, 재조립 과정에서 대상 시스템이 오류를 일으키게 하는 공격", "s": false}, {"k": "T", "a": "UDP 플러딩 (UDP Flooding)", "b": "대상의 임의 포트로 데이터그램을 대량으로 보내, 닫힌 포트마다 ICMP 도달 불가 응답을 반복하게 만들어 자원을 고갈시키는 공격", "s": false}]}, {"ch": "9. 소프트웨어 개발 보안 · 정보 보안", "t": "네트워크 공격", "star": false, "abbr": "", "items": [{"k": "T", "a": "스니핑 (Sniffing)", "b": "네트워크를 지나가는 패킷을 몰래 엿들어 계정·비밀번호 같은 정보를 가로채는 수동적 공격\n랜카드를 무차별 모드(Promiscuous Mode)로 설정", "s": false}, {"k": "T", "a": "스위치 재밍 (Switch Jamming)", "b": "위조한 MAC 주소를 대량으로 흘려 스위치의 주소 테이블을 넘치게 만들어, 스위치가 허브처럼 모든 포트로 프레임을 뿌리게 하는 공격\nMAC 플러딩이라고도 함", "s": false}, {"k": "T", "a": "IP 스푸핑 (IP Spoofing)", "b": "패킷의 출발지 주소를 신뢰받는 호스트의 것으로 위조해, 주소 기반 인증을 우회하거나 자신의 정체를 숨기는 공격", "s": false}, {"k": "T", "a": "ARP 스푸핑 (ARP Spoofing)", "b": "같은 근거리 망에서 IP-MAC 대응 정보를 위조한 응답을 보내 피해자의 캐시를 오염시키고, 트래픽이 공격자를 거쳐 가게 만드는 공격", "s": false}, {"k": "T", "a": "DNS 스푸핑 (DNS Spoofing)", "b": "도메인 이름 질의에 대한 응답을 위조하거나 캐시를 오염시켜, 사용자가 공격자가 만든 가짜 사이트로 접속하게 만드는 공격", "s": false}, {"k": "T", "a": "APT (Advanced Persistent Threat)", "b": "특정 기관을 노리고 장기간 은밀히 잠복하며 침투 → 내부 확산 → 정보 탈취를 단계적으로 진행하는 표적 공격", "s": false}, {"k": "T", "a": "세션 하이재킹 (Session Hijacking)", "b": "이미 인증을 마친 정상 사용자의 연결을 가로채, 시퀀스 번호나 세션 ID를 이용해 그 사용자인 척 통신을 이어 가는 공격", "s": false}]}, {"ch": "9. 소프트웨어 개발 보안 · 정보 보안", "t": "애플리케이션 공격", "star": true, "abbr": "", "items": [{"k": "T", "a": "SQL 인젝션 (SQL Injection)", "b": "입력란에 데이터베이스 질의문 조각을 끼워 넣어 인증을 우회하거나 데이터를 무단으로 조회·변조하는 공격\n대응: 바인딩 변수(Prepared Statement), 입력값 검증", "s": false}, {"k": "T", "a": "XSS (Cross-Site Scripting)", "b": "게시판 등에 악성 코드(자바스크립트 등)를 심어 두어, 그 페이지를 연 다른 사용자의 브라우저에서 실행되게 하고 쿠키·세션을 빼내는 공격\n유형: 저장형, 반사형, DOM 기반", "s": false}, {"k": "T", "a": "CSRF (Cross-Site Request Forgery)", "b": "로그인한 사용자가 모르는 사이에 공격자가 의도한 요청(송금·정보 변경 등)을 그 사용자의 권한으로 서버에 보내게 만드는 공격", "s": false}, {"k": "T", "a": "레인보 테이블 공격 (Rainbow Table Attack)", "b": "평문과 해시값의 대응을 체인 형태로 미리 계산해 압축 저장한 표를 써서, 탈취한 비밀번호 해시의 원래 값을 빠르게 찾아내는 공격\n대응: 솔트", "s": false}]}, {"ch": "9. 소프트웨어 개발 보안 · 정보 보안", "t": "사람과 사이트를 노리는 공격", "star": false, "abbr": "", "items": [{"k": "T", "a": "사회 공학 (Social Engineering)", "b": "기술적 취약점 대신 사람의 신뢰·호기심·두려움을 이용해 속여서 비밀번호 같은 정보나 접근 권한을 얻어 내는 공격 기법", "s": false}, {"k": "T", "a": "워터링 홀 (Watering Hole)", "b": "공격 대상 집단이 자주 드나드는 웹사이트를 미리 감염시켜 두고, 그 사이트에 들어온 사람에게 악성코드를 퍼뜨리는 공격", "s": false}, {"k": "T", "a": "타이포스쿼팅 (Typosquatting)", "b": "주소를 잘못 입력하는 실수를 노려, 유명 사이트와 철자가 한두 글자 다른 도메인을 등록해 두고 가짜 사이트로 유인하는 공격", "s": false}]}, {"ch": "9. 소프트웨어 개발 보안 · 정보 보안", "t": "블루투스 공격", "star": false, "abbr": "", "items": [{"k": "T", "a": "블루버그 (BlueBug)", "b": "블루투스 기기의 취약점을 이용해 인증 없이 원격으로 기기를 장악하고, 통화·문자 발송 같은 명령까지 실행하는 공격", "s": false}, {"k": "T", "a": "블루스나프 (BlueSnarf)", "b": "블루투스 파일 교환 프로토콜(OBEX)의 취약점을 이용해 허락 없이 기기 안의 주소록·일정·파일 등을 빼내는 공격", "s": false}, {"k": "T", "a": "블루재킹 (BlueJacking)", "b": "근처의 블루투스 기기에 명함 전송 기능 등을 이용해 원치 않는 메시지·스팸을 일방적으로 보내는 공격", "s": false}, {"k": "T", "a": "블루프린팅 (BluePrinting)", "b": "공격 대상이 될 블루투스 기기를 찾아 기기 종류·모델·제공 서비스 같은 정보를 수집하는 사전 정찰 공격", "s": false}]}, {"ch": "9. 소프트웨어 개발 보안 · 정보 보안", "t": "보안 솔루션", "star": false, "abbr": "", "items": [{"k": "T", "a": "IDS (Intrusion Detection System)", "b": "네트워크·호스트의 활동을 감시하다가 알려진 공격 패턴이나 비정상 행위를 발견하면 관리자에게 경보를 보내는 시스템\n판별 기법: 오용(시그니처) 기반, 이상(행위) 기반", "s": false}, {"k": "T", "a": "IPS (Intrusion Prevention System)", "b": "공격 징후를 실시간으로 찾아내 경보에 그치지 않고 해당 트래픽을 자동으로 차단까지 하는 능동형 시스템", "s": false}, {"k": "T", "a": "방화벽 (Firewall)", "b": "내부망과 외부망 경계에서 미리 정한 규칙(IP·포트·프로토콜 등)에 따라 트래픽의 통과와 차단을 결정하는 시스템", "s": false}, {"k": "T", "a": "VPN (Virtual Private Network)", "b": "인터넷 같은 공중망 위에 암호화된 터널을 만들어 마치 전용선처럼 안전하게 통신하게 하는 기술\n구현 프로토콜: IPSec, SSL/TLS, PPTP, L2TP", "s": false}, {"k": "T", "a": "DLP (Data Loss Prevention)", "b": "조직 내부의 중요 정보가 메일·USB·출력물 등을 통해 외부로 새어 나가는 것을 감시하고 차단하는 솔루션", "s": false}, {"k": "T", "a": "허니팟 (Honeypot)", "b": "일부러 취약하게 보이도록 꾸민 미끼 시스템으로, 공격자를 끌어들여 그 행동을 관찰·기록하는 시스템", "s": false}, {"k": "T", "a": "NAC (Network Access Control)", "b": "단말이 내부망에 붙기 전에 백신 설치·패치 상태 등 보안 정책 준수 여부를 검사해 접속을 허용하거나 격리하는 솔루션", "s": false}, {"k": "T", "a": "ESM (Enterprise Security Management)", "b": "방화벽·IDS·IPS 등 여러 보안 장비의 로그와 이벤트를 한곳에 모아 통합 관리·분석하는 솔루션", "s": false}, {"k": "T", "a": "SIEM (Security Information and Event Management)", "b": "여러 장비·서버의 로그를 빅데이터 기반으로 수집하고 상관 분석해 위협을 실시간으로 찾아내고 대응하는 솔루션\nESM의 발전형", "s": false}]}, {"ch": "9. 소프트웨어 개발 보안 · 정보 보안", "t": "인증·보안 관리 체계", "star": false, "abbr": "", "items": [{"k": "T", "a": "AAA (Authentication, Authorization, Accounting)", "b": "네트워크에 접속하는 사용자의 신원 확인, 권한 부여, 사용 내역 기록의 세 가지를 한 서버에서 처리하는 보안 체계\n대표 프로토콜: RADIUS, TACACS+, Diameter", "s": false}, {"k": "Q", "a": "AAA의 세 기능 중 사용자가 무엇을 얼마나 썼는지 기록해 과금·감사에 쓰는 기능은?", "b": "Accounting (계정 관리)", "s": false}, {"k": "T", "a": "ISMS (Information Security Management System)", "b": "조직이 정보 자산을 지키려고 세운 정책·조직·절차·대책이 기준에 맞게 운영되는지 심사해 인증하는 국내 정보보호 관리체계 인증 제도", "s": false}, {"k": "T", "a": "트러스트존 (TrustZone)", "b": "ARM 프로세서가 한 칩 안을 일반 영역과 격리된 보안 영역으로 나눠, 결제·생체 정보 같은 민감한 처리를 보안 영역에서만 하게 하는 하드웨어 기술", "s": false}]}, {"ch": "9. 소프트웨어 개발 보안 · 정보 보안", "t": "보안 프로토콜", "star": true, "abbr": "", "items": [{"k": "T", "a": "SSH (Secure Shell)", "b": "원격 접속(텔넷 대체)과 파일 전송 때 오가는 모든 데이터를 암호화하는 프로토콜로, 기본 포트는 22번", "s": false}, {"k": "T", "a": "SSL (Secure Sockets Layer) / TLS (Transport Layer Security)", "b": "TCP 위에서 동작하며 웹 통신 등에 서버 인증·암호화·무결성을 제공하는 프로토콜로, 넷스케이프의 원형을 IETF가 표준화한 후속판이 있다\nHTTPS 기본 포트 443", "s": false}, {"k": "T", "a": "S-HTTP (Secure HTTP)", "b": "웹에서 주고받는 메시지(문서) 하나하나에 암호화와 서명을 적용하는 프로토콜로, 통신 채널 전체를 보호하는 방식과 구별된다", "s": false}, {"k": "T", "a": "IPSec (IP Security)", "b": "네트워크 계층(3계층)에서 패킷 단위로 인증과 암호화를 제공하는 프로토콜 모음으로, VPN 구현에 널리 쓰인다", "s": false}, {"k": "T", "a": "IPSec 전송 모드 (Transport Mode)", "b": "원래 IP 헤더는 그대로 두고 페이로드만 보호하는 방식으로, 종단 호스트끼리 직접 통신할 때 쓴다", "s": false}, {"k": "T", "a": "IPSec 터널 모드 (Tunnel Mode)", "b": "원래 IP 패킷 전체를 보호한 뒤 새 IP 헤더를 덧붙이는 방식으로, 게이트웨이 간 VPN 구성에 쓴다", "s": false}, {"k": "T", "a": "AH (Authentication Header)", "b": "패킷의 무결성과 출발지 인증을 제공하지만 암호화는 하지 않는 IPSec 구성 프로토콜", "s": false}, {"k": "T", "a": "ESP (Encapsulating Security Payload)", "b": "패킷 내용을 암호화해 기밀성을 제공하고 선택적으로 무결성·출발지 인증까지 제공하는 IPSec 구성 프로토콜", "s": false}, {"k": "T", "a": "IKE (Internet Key Exchange)", "b": "IPSec 통신 양측이 보안 연관(SA)과 암호 키를 자동으로 협상·생성하도록 해 주는 프로토콜\nUDP 500번 포트 사용", "s": false}, {"k": "T", "a": "TKIP (Temporal Key Integrity Protocol)", "b": "무선랜의 WEP 약점을 보완하려고 만든 암호 프로토콜로, 패킷마다 키를 바꿔 쓰고 메시지 무결성 검사를 더했다. WPA에서 쓰였다", "s": false}]}, {"ch": "9. 소프트웨어 개발 보안 · 정보 보안", "t": "DRM 구성요소", "star": false, "abbr": "", "items": [{"k": "T", "a": "DRM (Digital Rights Management)", "b": "디지털 콘텐츠의 불법 복제를 막고 허가된 사용자만 정해진 권한 범위 안에서 이용하도록 통제하는 기술", "s": false}, {"k": "T", "a": "콘텐츠 제공자 (Contents Provider)", "b": "콘텐츠를 직접 만들거나 저작권을 보유하고 있어 보호 대상 콘텐츠를 공급하는 주체", "s": false}, {"k": "T", "a": "콘텐츠 분배자 (Contents Distributor)", "b": "온라인 쇼핑몰처럼 암호화 등 보호 처리를 거친 콘텐츠를 최종 사용자에게 유통하고 판매하는 주체", "s": false}, {"k": "T", "a": "패키저 (Packager)", "b": "원본 콘텐츠에 이용 조건 같은 부가 정보를 붙이고 암호화해, 유통할 수 있는 보호 파일로 만들어 내는 도구", "s": false}, {"k": "T", "a": "보안 컨테이너 (Security Container)", "b": "원본 콘텐츠와 이용 규칙을 함께 감싸 담아 유통 과정에서 무단 접근을 막는 전자적 보안 장치", "s": false}, {"k": "T", "a": "DRM 컨트롤러 (DRM Controller)", "b": "사용자 단말에서 배포된 콘텐츠의 이용 권한을 확인하고 재생·복사 등 사용을 통제하는 프로그램", "s": false}, {"k": "T", "a": "클리어링 하우스 (Clearing House)", "b": "암호 키 관리와 라이선스 발급, 사용량에 따른 결제 정산을 담당하는 주체", "s": false}]}, {"ch": "9. 소프트웨어 개발 보안 · 정보 보안", "t": "사후 대응", "star": false, "abbr": "", "items": [{"k": "T", "a": "디지털 포렌식 (Digital Forensics)", "b": "컴퓨터·저장 매체에 남은 전자적 흔적을 수집·보존·분석해 법정에서 증거로 쓸 수 있게 만드는 과학적 조사 기법\n원칙: 정당성, 재현성, 신속성, 연계 보관성, 무결성", "s": false}]}, {"ch": "10. 응용 SW 기초 기술 · 신기술", "t": "클라우드 서비스", "star": true, "abbr": "", "items": [{"k": "T", "a": "IaaS (Infrastructure as a Service)", "b": "서버·스토리지·네트워크 같은 컴퓨팅 기반 자원을 가상화해 필요한 만큼 빌려 쓰게 하는 서비스\n예: AWS EC2", "s": false}, {"k": "T", "a": "PaaS (Platform as a Service)", "b": "운영체제·미들웨어·개발 도구 등 애플리케이션을 개발하고 실행할 환경을 제공해, 사용자는 코드에만 집중하게 하는 서비스\n예: Google App Engine, Heroku", "s": false}, {"k": "T", "a": "SaaS (Software as a Service)", "b": "완성된 응용 프로그램을 설치 없이 웹 브라우저로 바로 이용하게 하는 서비스\n예: Gmail, Microsoft 365", "s": false}]}, {"ch": "10. 응용 SW 기초 기술 · 신기술", "t": "가상화", "star": false, "abbr": "", "items": [{"k": "T", "a": "가상화 (Virtualization)", "b": "하나의 물리 자원을 여러 개의 논리 자원처럼 나눠 쓰거나, 여러 물리 자원을 하나처럼 묶어 쓰게 하는 기술", "s": false}, {"k": "T", "a": "하이퍼바이저 (Hypervisor)", "b": "물리 하드웨어 위에서 여러 게스트 운영체제(가상 머신)를 동시에 실행하고 관리하는 소프트웨어 계층\nType 1(베어메탈형), Type 2(호스트형)", "s": false}, {"k": "T", "a": "컨테이너 (Container)", "b": "게스트 운영체제 없이 호스트 OS 커널을 공유하면서 애플리케이션을 프로세스 단위로 격리해, 가상 머신보다 가볍고 빠르게 실행하는 방식", "s": false}, {"k": "T", "a": "도커 (Docker)", "b": "애플리케이션과 실행에 필요한 라이브러리·설정을 이미지로 묶어 어느 환경에서든 똑같이 띄울 수 있게 하는 대표적 오픈소스 컨테이너 엔진", "s": false}]}, {"ch": "10. 응용 SW 기초 기술 · 신기술", "t": "소프트웨어 정의 기술", "star": false, "abbr": "", "items": [{"k": "T", "a": "SDN (Software Defined Networking)", "b": "네트워크 장비의 제어 기능과 패킷 전달 기능을 분리해, 중앙 컨트롤러 프로그램으로 네트워크 전체를 관리하는 기술\n대표 프로토콜: OpenFlow", "s": false}, {"k": "T", "a": "SDS (Software Defined Storage)", "b": "서로 다른 물리 저장 장치를 가상화해 하나의 자원 풀로 묶고, 용량 할당과 정책을 프로그램으로 관리하는 기술", "s": false}, {"k": "T", "a": "SDC (Software Defined Computing)", "b": "서버의 CPU·메모리 같은 연산 자원을 가상화해 필요에 따라 프로그램으로 할당하고 관리하는 기술", "s": false}, {"k": "T", "a": "SDDC (Software Defined Data Center)", "b": "서버·네트워크·스토리지 등 전산 시설 전체의 자원을 가상화해 사람의 개입 없이 프로그램으로 통합 운영하는 기술", "s": false}]}, {"ch": "10. 응용 SW 기초 기술 · 신기술", "t": "스토리지", "star": false, "abbr": "", "items": [{"k": "T", "a": "스토리지 (Storage)", "b": "대용량 데이터를 담기 위해 서버와 별도로 구성하는 저장 장치나 저장 시스템\n연결 방식: DAS, NAS, SAN", "s": false}, {"k": "T", "a": "DAS (Direct Attached Storage)", "b": "서버에 저장 장치를 케이블로 직접 붙이는 방식으로, 구성이 간단하지만 다른 서버와의 공유와 확장이 어렵다", "s": false}, {"k": "T", "a": "NAS (Network Attached Storage)", "b": "저장 장치를 LAN에 연결해 여러 서버·클라이언트가 파일 단위로 공유하는 방식\n프로토콜: NFS, SMB/CIFS", "s": false}, {"k": "T", "a": "SAN (Storage Area Network)", "b": "서버와 저장 장치를 광 채널(Fibre Channel) 같은 전용 고속망으로 연결해 블록 단위로 접근하게 하는 방식", "s": false}, {"k": "T", "a": "RAID (Redundant Array of Independent Disks)", "b": "여러 개의 디스크를 하나처럼 묶어 성능을 높이거나, 장애에 대비해 데이터를 중복 저장하는 기술\n0: 스트라이핑, 1: 미러링, 5: 분산 패리티, 6: 이중 패리티", "s": false}]}, {"ch": "10. 응용 SW 기초 기술 · 신기술", "t": "재해 복구 사이트 유형", "star": true, "abbr": "미핫웜콜", "items": [{"k": "T", "a": "미러 사이트 (Mirror Site)", "b": "주 센터와 같은 수준의 시스템을 원격지에 두고 둘 다 동시에 가동(Active-Active)하는 방식으로, 복구 시간이 사실상 0에 가깝다", "s": false}, {"k": "T", "a": "핫 사이트 (Hot Site)", "b": "주 센터와 같은 장비를 대기 상태(Active-Standby)로 두고 데이터를 실시간 동기화해, 보통 4시간 이내에 업무를 되살리는 방식", "s": false}, {"k": "T", "a": "웜 사이트 (Warm Site)", "b": "중요도가 높은 업무 위주로 일부 장비만 갖추고 데이터는 주기적으로 백업해 두어, 수일~수주 안에 되살리는 방식", "s": false}, {"k": "T", "a": "콜드 사이트 (Cold Site)", "b": "전원·공간 같은 최소 시설만 확보해 두고 재해가 난 뒤에 장비를 들여와 구축하므로, 수주~수개월이 걸리는 방식", "s": false}]}, {"ch": "10. 응용 SW 기초 기술 · 신기술", "t": "재해 복구 지표", "star": false, "abbr": "", "items": [{"k": "T", "a": "재해 복구 시스템 (DRS, Disaster Recovery System)", "b": "재난으로 주 전산 센터가 멈출 경우에 대비해 원격지에 데이터와 시스템을 복제해 두고 업무를 이어 가도록 갖춘 체계\n유형: 미러·핫·웜·콜드 사이트", "s": false}, {"k": "T", "a": "RTO (Recovery Time Objective)", "b": "재해로 업무가 멈춘 뒤 서비스를 다시 가동하기까지 조직이 허용할 수 있는 최대 중단 시간 목표", "s": false}, {"k": "T", "a": "RPO (Recovery Point Objective)", "b": "재해 시 데이터를 어느 시점까지 되살려야 하는지, 즉 감수할 수 있는 최대 데이터 손실 구간을 정한 목표", "s": false}, {"k": "T", "a": "BIA (Business Impact Analysis)", "b": "업무가 중단될 때 생기는 재무·운영상 손실 규모를 평가해 업무별 복구 우선순위와 목표 시간을 정하는 과정", "s": false}]}, {"ch": "10. 응용 SW 기초 기술 · 신기술", "t": "빅데이터 처리", "star": true, "abbr": "", "items": [{"k": "T", "a": "빅데이터 (Big Data)", "b": "기존 도구로는 수집·저장·분석이 어려울 만큼 방대하고 빠르게, 다양한 형태로 쏟아지는 데이터\n3V: Volume, Velocity, Variety (+Value, Veracity)", "s": false}, {"k": "T", "a": "하둡 (Hadoop)", "b": "값싼 범용 서버 여러 대를 묶어 대용량 데이터를 분산 저장하고 분산 처리하는 아파치 재단의 오픈소스 프레임워크", "s": false}, {"k": "T", "a": "맵리듀스 (MapReduce)", "b": "데이터를 키-값 쌍으로 변환·분류하는 단계와 같은 키끼리 모아 집계하는 단계로 나눠 여러 노드에서 병렬 처리하는 프로그래밍 모델", "s": false}, {"k": "T", "a": "스쿱 (Sqoop)", "b": "하둡과 관계형 데이터베이스 사이에서 대량의 데이터를 가져오고 내보내는 전송 도구", "s": false}, {"k": "T", "a": "NoSQL (Not Only SQL)", "b": "고정 스키마 없이 키-값·문서·컬럼·그래프 형태로 데이터를 저장해, 비정형·반정형 데이터와 수평 확장에 강한 비관계형 데이터베이스\n예: MongoDB, Cassandra, Redis", "s": false}, {"k": "T", "a": "스크래피 (Scrapy)", "b": "웹 페이지를 자동으로 돌아다니며 원하는 데이터를 추출(크롤링)하는 파이썬 기반 오픈소스 프레임워크", "s": false}]}, {"ch": "10. 응용 SW 기초 기술 · 신기술", "t": "데이터 분석·저장", "star": false, "abbr": "", "items": [{"k": "T", "a": "OLAP (Online Analytical Processing)", "b": "다차원으로 구성한 데이터를 사용자가 여러 관점에서 대화식으로 집계·조회하며 의사결정에 활용하는 처리 기술\n연산: 롤업, 드릴다운, 슬라이싱, 다이싱, 피보팅", "s": false}, {"k": "T", "a": "데이터 웨어하우스 (Data Warehouse)", "b": "여러 운영 시스템의 데이터를 추출·변환해 주제별로 통합하고 시간 흐름에 따라 쌓아 두는 의사결정 지원용 대규모 저장소\n특징: 주제 지향, 통합, 시계열, 비휘발", "s": false}, {"k": "T", "a": "데이터 마트 (Data Mart)", "b": "전사 통합 저장소 가운데 특정 부서나 업무 분야에 필요한 데이터만 따로 떼어 구성한 소규모 분석용 저장소", "s": false}, {"k": "T", "a": "데이터 마이닝 (Data Mining)", "b": "대량의 데이터에서 통계·기계학습 기법으로 숨어 있는 패턴·규칙·상관관계를 찾아내는 기법\n기법: 분류, 연관 규칙, 군집, 연속 규칙", "s": false}, {"k": "T", "a": "텍스트 마이닝 (Text Mining)", "b": "뉴스·리뷰 같은 비정형 문서에서 자연어 처리로 의미 있는 키워드·주제·감성 같은 정보를 뽑아내는 기법", "s": false}, {"k": "T", "a": "웹 마이닝 (Web Mining)", "b": "인터넷 페이지의 내용, 페이지 사이의 링크 구조, 사용자 접속 기록을 분석해 유용한 정보를 찾아내는 기법", "s": false}, {"k": "T", "a": "다크 데이터 (Dark Data)", "b": "수집·저장만 해 두고 분석이나 의사결정에는 한 번도 쓰이지 않은 채 쌓여 있는 데이터. 저장 비용과 보안 위험만 키우는 경우가 많다", "s": false}]}, {"ch": "10. 응용 SW 기초 기술 · 신기술", "t": "분산 시스템 이론", "star": false, "abbr": "", "items": [{"k": "T", "a": "CAP 이론 (CAP Theorem)", "b": "분산 시스템은 일관성·가용성·분할 내성 세 가지를 동시에 모두 만족할 수 없고 최대 둘만 보장할 수 있다는 이론\n네트워크 분할이 생기면 일관성과 가용성 중 하나를 포기해야 함", "s": false}]}, {"ch": "10. 응용 SW 기초 기술 · 신기술", "t": "웹·시맨틱", "star": false, "abbr": "", "items": [{"k": "T", "a": "시맨틱 웹 (Semantic Web)", "b": "인터넷 문서에 컴퓨터가 이해할 수 있는 의미 정보를 붙여, 사람 대신 기계가 정보를 해석·추론·처리하게 하는 차세대 인터넷 구상\n팀 버너스리 제안, 기반 기술: RDF, OWL", "s": false}, {"k": "T", "a": "온톨로지 (Ontology)", "b": "특정 분야의 개념과 개념 사이의 관계를 컴퓨터가 처리할 수 있도록 형식적으로 정의해 둔 지식 체계", "s": false}, {"k": "T", "a": "매시업 (Mashup)", "b": "여러 서비스가 공개한 API나 데이터를 섞어 조합해 새로운 웹 서비스를 만들어 내는 기법\n예: 지도 API + 부동산 매물 정보", "s": false}, {"k": "T", "a": "CSS (Cascading Style Sheets)", "b": "HTML 문서의 글꼴·색상·배치 같은 표현 방식을 내용과 분리해 정의하는 언어", "s": false}, {"k": "T", "a": "하이퍼텍스트 (Hypertext)", "b": "문서 안의 단어나 그림을 누르면 다른 문서·위치로 바로 이동하도록 링크로 엮은 텍스트. 웹 문서 언어와 웹 전송 규약 이름의 앞부분이 여기서 왔다", "s": false}, {"k": "T", "a": "HTTP (HyperText Transfer Protocol)", "b": "웹 브라우저와 웹 서버가 HTML 문서 등 웹 자원을 요청과 응답으로 주고받는 응용 계층 통신 규약. 기본 포트는 80이고 이전 요청 상태를 기억하지 않는다", "s": false}, {"k": "T", "a": "LOD (Linked Open Data)", "b": "누구나 쓸 수 있게 공개한 데이터를 URI로 식별하고 서로 링크로 이어, 웹 전체를 하나의 거대한 데이터베이스처럼 활용하게 하는 방식", "s": false}]}, {"ch": "10. 응용 SW 기초 기술 · 신기술", "t": "블록체인·가상 세계", "star": false, "abbr": "", "items": [{"k": "T", "a": "블록체인 (Blockchain)", "b": "거래 내역 묶음마다 직전 묶음의 해시값을 넣어 차례로 이어 붙이고, P2P 참여자 모두가 사본을 나눠 보관해 위·변조를 어렵게 한 분산 원장 기술", "s": false}, {"k": "T", "a": "NFT (Non-Fungible Token)", "b": "분산 원장에 기록되어 하나하나가 고유한 식별값을 가지므로 서로 맞바꿀 수 없는 디지털 자산 증명으로, 그림·게임 아이템 등의 소유권 증명에 쓴다", "s": false}, {"k": "T", "a": "메타버스 (Metaverse)", "b": "현실처럼 사회·경제·문화 활동이 이루어지는 3차원 가상 세계로, 사람들이 아바타를 통해 교류하는 공간", "s": false}]}, {"ch": "10. 응용 SW 기초 기술 · 신기술", "t": "AI 라이브러리", "star": false, "abbr": "", "items": [{"k": "T", "a": "딥러닝 (Deep Learning)", "b": "은닉층을 여러 겹 쌓은 인공 신경망으로 데이터의 특징을 사람이 지정하지 않아도 스스로 추출하게 하는 기계학습의 한 분야", "s": false}, {"k": "T", "a": "사이킷런 (scikit-learn)", "b": "분류·회귀·군집·차원 축소 같은 전통적 기계학습 알고리즘을 일관된 API로 제공하는 파이썬 오픈소스 라이브러리", "s": false}, {"k": "T", "a": "텐서플로 (TensorFlow)", "b": "구글 브레인 팀이 개발한 오픈소스 딥러닝 프레임워크로, 다차원 배열이 흐르는 연산 그래프로 모델을 구성하며 Keras를 고수준 API로 포함한다", "s": false}, {"k": "T", "a": "파이토치 (PyTorch)", "b": "메타(페이스북)가 주도해 개발한 오픈소스 딥러닝 프레임워크로, 실행하면서 계산 그래프를 만드는 동적 방식(Define-by-Run)이라 디버깅이 쉽다", "s": false}]}, {"ch": "10. 응용 SW 기초 기술 · 신기술", "t": "운영 관리", "star": false, "abbr": "", "items": [{"k": "T", "a": "APM (Application Performance Management)", "b": "애플리케이션의 응답 시간·트랜잭션 처리량·자원 사용률·오류를 실시간으로 추적해 병목과 장애 지점을 찾아 주는 도구", "s": false}, {"k": "T", "a": "레거시 시스템 (Legacy System)", "b": "오래전에 구축되어 기술은 낡았지만 핵심 업무를 계속 처리하고 있어 쉽게 교체하기 어려운 기존 시스템", "s": false}, {"k": "T", "a": "GIS (Geographic Information System)", "b": "위치·지형 같은 공간 정보를 속성 데이터와 함께 수집·저장·분석해 지도 형태로 보여 주는 시스템", "s": false}]}];
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('jcgo:'+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('jcgo:'+k, JSON.stringify(v)); }catch(e){} }
};
let mode = store.get('mode', 'term');
let flags = new Set(store.get('flags', []));
const revealed = new Set();
let total = 0;

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const star = '<span class="st">★</span>';
const flagSvg = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';

function build(){
  const main = $('#main'), toc = $('#toc');
  let lastCh = null;
  DATA.forEach((sec, si) => {
    if (sec.ch !== lastCh){
      lastCh = sec.ch;
      const m = sec.ch.match(/^(\d+)\.\s*(.*)$/);
      const h = document.createElement('div'); h.className = 'chapter'; h.id = 'c' + si;
      h.innerHTML = `<div class="no">과목 ${m ? m[1].padStart(2,'0') : ''}</div><h2>${esc(m ? m[2] : sec.ch)}</h2>`;
      main.appendChild(h);
      const ta = document.createElement('a'); ta.className = 'ch'; ta.href = '#c' + si; ta.textContent = sec.ch;
      ta.addEventListener('click', closeToc); toc.appendChild(ta);
    }
    const el = document.createElement('section');
    el.id = 's' + si;
    if (sec.loose) el.classList.add('loose');
    el.innerHTML = `<h3>${sec.star ? star : ''}${fmt(sec.t)}${sec.abbr ? `<span class="abbr" title="앞글자">${esc(sec.abbr)}</span>` : ''}</h3>`;
    const g = document.createElement('div'); g.className = 'grid';
    let cnt = 0;
    sec.items.forEach((it, ii) => {
      const id = si + '-' + ii;
      if (it.k === 'T' || it.k === 'Q'){
        cnt++; total++;
        const c = document.createElement('div');
        c.className = 'card hide' + (it.k === 'Q' ? ' q' : '');
        c.tabIndex = 0; c.dataset.id = id; c.dataset.k = it.k;
        c.dataset.text = (it.a + ' ' + it.b + ' ' + sec.t + ' ' + sec.ch).toLowerCase();
        if (it.s || sec.star) c.dataset.star = '1';
        c.innerHTML =
          `<div class="term">${it.s ? star : ''}<span class="part" data-p="a"></span></div>` +
          `<div class="desc"><span class="part" data-p="b"></span></div>` +
          `<button class="flagbtn" aria-label="다시 볼 것 표시" title="다시 볼 것">${flagSvg}</button>`;
        c._it = it;
        if (flags.has(id)) c.classList.add('flag');
        g.appendChild(c);
      } else if (it.k === 'N'){
        const n = document.createElement('div'); n.className = 'note'; n.innerHTML = fmt(it.a); g.appendChild(n);
      } else if (it.k === 'img'){
        const f = document.createElement('div'); f.className = 'figure';
        f.innerHTML = `<details><summary>그림 보기 — ${esc(it.cap)}</summary><img loading="lazy" alt="${esc(it.cap)}" src="${it.src}"></details>`;
        g.appendChild(f);
      } else if (it.k === 'grid'){
        const t = document.createElement('div'); t.className = 'tbl';
        t.innerHTML = '<table><thead><tr>' + it.head.map(h => `<th>${esc(h)}</th>`).join('') + '</tr></thead><tbody>' +
          it.rows.map(r => '<tr>' + r.map((v, ci) => ci === 0 ? `<td><b>${esc(v)}</b></td>`
            : `<td class="cell hide"><span class="real">${esc(v)}</span><span class="mask">?</span></td>`).join('') + '</tr>').join('') +
          '</tbody></table>';
        g.appendChild(t);
      }
    });
    el.appendChild(g); main.appendChild(el);
    const a = document.createElement('a');
    a.href = '#s' + si; if (sec.loose) a.className = 'loose';
    a.innerHTML = `${sec.star ? star : ''}${fmt(sec.t)}<span class="cnt">${cnt || ''}</span>`;
    a.addEventListener('click', closeToc);
    toc.appendChild(a);
  });
  const e = document.createElement('div'); e.className = 'empty hidden'; e.id = 'empty'; e.textContent = '조건에 맞는 카드가 없습니다.';
  main.appendChild(e);
}

// 어느 쪽을 가릴지: Q 카드는 항상 답(b), T 카드는 모드에 따라
function hiddenPart(c){ return c.dataset.k === 'Q' ? 'b' : (mode === 'term' ? 'a' : 'b'); }
function paint(c){
  const it = c._it, hp = hiddenPart(c);
  c.querySelectorAll('.part').forEach(p => {
    const key = p.dataset.p, txt = fmt(it[key]);
    if (key === hp){
      const label = c.dataset.k === 'Q' ? '정답 보기' : (key === 'a' ? '용어 보기' : '설명 보기');
      p.className = 'part ans' + (key === 'b' ? ' blk' : '');
      p.innerHTML = `<span class="real">${txt}</span><span class="mask">${label}</span>`;
    } else { p.className = 'part'; p.innerHTML = txt; }
  });
}
function paintAll(){ document.querySelectorAll('.card').forEach(paint); }

function setRevealed(c, on){
  c.classList.toggle('hide', !on);
  if (on){ revealed.add(c.dataset.id); c.classList.add('reveal-anim'); }
  else { revealed.delete(c.dataset.id); c.classList.remove('reveal-anim'); }
  updateProg();
}
function updateProg(){
  $('#prog').textContent = `${revealed.size} / ${total}`;
  $('#pfill').style.width = (revealed.size / total * 100) + '%';
}

function applyFilter(){
  const q = $('#q').value.trim().toLowerCase();
  const onlyStar = $('#starBtn').getAttribute('aria-pressed') === 'true';
  const onlyFlag = $('#flagBtn').getAttribute('aria-pressed') === 'true';
  const filtering = q || onlyStar || onlyFlag;
  let any = false;
  document.querySelectorAll('section').forEach(sec => {
    let shown = 0;
    sec.querySelectorAll('.card').forEach(c => {
      const ok = (!q || c.dataset.text.includes(q)) && (!onlyStar || c.dataset.star) && (!onlyFlag || c.classList.contains('flag'));
      c.classList.toggle('hidden', !ok); if (ok) shown++;
    });
    sec.querySelectorAll('.note,.figure,.tbl').forEach(n => n.classList.toggle('hidden', !!filtering));
    sec.classList.toggle('hidden', filtering && !shown);
    if (!filtering || shown) any = true;
  });
  document.querySelectorAll('.chapter').forEach(h => {
    let n = h.nextElementSibling, vis = false;
    while (n && !n.classList.contains('chapter')){ if (n.tagName === 'SECTION' && !n.classList.contains('hidden')) vis = true; n = n.nextElementSibling; }
    h.classList.toggle('hidden', !vis);
  });
  $('#empty').classList.toggle('hidden', any);
}

function closeToc(){ $('#toc').classList.remove('open'); $('#scrim').classList.remove('open'); }

build(); paintAll(); updateProg();
document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));

$('#main').addEventListener('click', e => {
  const fb = e.target.closest('.flagbtn');
  if (fb){
    const c = fb.closest('.card'); c.classList.toggle('flag');
    c.classList.contains('flag') ? flags.add(c.dataset.id) : flags.delete(c.dataset.id);
    store.set('flags', [...flags]); e.stopPropagation(); return;
  }
  const cell = e.target.closest('td.cell'); if (cell){ cell.classList.toggle('hide'); return; }
  if (e.target.closest('details')) return;
  const c = e.target.closest('.card');
  if (c && !window.getSelection().toString()) setRevealed(c, c.classList.contains('hide'));
});
$('#main').addEventListener('keydown', e => {
  const c = e.target.closest('.card');
  if (c && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); setRevealed(c, c.classList.contains('hide')); }
});
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  mode = b.dataset.mode; store.set('mode', mode);
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
  paintAll();
}));
const vis = () => [...document.querySelectorAll('.card:not(.hidden)')].filter(c => !c.closest('section.hidden'));
$('#allBtn').addEventListener('click', () => { vis().forEach(c => setRevealed(c, true)); document.querySelectorAll('td.cell').forEach(t => t.classList.remove('hide')); });
$('#resetBtn').addEventListener('click', () => { document.querySelectorAll('.card').forEach(c => setRevealed(c, false)); document.querySelectorAll('td.cell').forEach(t => t.classList.add('hide')); });
['starBtn','flagBtn'].forEach(id => $('#'+id).addEventListener('click', e => {
  const b = e.currentTarget; b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'); applyFilter();
}));
$('#q').addEventListener('input', applyFilter);
$('#tocBtn').addEventListener('click', () => { $('#toc').classList.add('open'); $('#scrim').classList.add('open'); });
$('#tocClose').addEventListener('click', closeToc);
$('#scrim').addEventListener('click', closeToc);
// ── 퀴즈: 지금 화면에 보이는(필터가 걸려 있으면 걸린) 카드에서 무작위로 끝없이
const qz = { pool: [], deck: [], cur: null, shown: false, n: 0, last: null };
function qzShuffle(){
  const d = qz.pool.slice();
  for (let i = d.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [d[i], d[j]] = [d[j], d[i]]; }
  if (d.length > 1 && d[d.length - 1] === qz.last) [d[0], d[d.length - 1]] = [d[d.length - 1], d[0]];
  qz.deck = d;
}
function qzNext(){
  if (!qz.deck.length) qzShuffle();
  qz.cur = qz.deck.pop(); qz.last = qz.cur; qz.shown = false; qz.n++;
  qzRender();
}
function qzRender(){
  const c = qz.cur, it = c._it, hp = hiddenPart(c), box = $('#qzCard');
  const sec = c.closest('section');
  let chEl = sec; while (chEl && !chEl.classList.contains('chapter')) chEl = chEl.previousElementSibling;
  const where = (chEl ? chEl.querySelector('h2').textContent + ' › ' : '') + sec.querySelector('h3').textContent.replace(/^★/, '');
  const label = c.dataset.k === 'Q' ? '정답 보기' : (hp === 'a' ? '용어는?' : '설명은?');
  const part = key => key === hp && !qz.shown ? `<span class="qz-hole">${label}</span>` : `<span class="${key === hp ? 'qz-ans' : ''}">${fmt(it[key])}</span>`;
  box.className = 'qz-card' + (c.dataset.k === 'Q' ? ' q' : '') + (qz.shown ? ' shown' : '');
  box.innerHTML = `<div class="qz-where">${esc(where)}</div><div class="qz-a">${part('a')}</div><div class="qz-b">${part('b')}</div>`;
  $('#qzCnt').textContent = `${qz.n}번째 · ${qz.pool.length}장 중에서`;
  $('#qzHint').textContent = qz.shown ? '한 번 더 누르면 다음 문제' : '누르면 정답';
  const f = c.classList.contains('flag');
  $('#qzFlag').innerHTML = flagSvg; $('#qzFlag').style.color = f ? 'var(--flag)' : '';
  $('#qzFlag').setAttribute('aria-pressed', f);
}
function qzStep(){ if (!qz.shown){ qz.shown = true; qzRender(); } else qzNext(); }
function qzOpen(){
  qz.pool = vis();
  if (!qz.pool.length){ alertEmpty(); return; }
  qz.deck = []; qz.n = 0; qz.last = null;
  $('#qz').hidden = false; document.body.style.overflow = 'hidden';
  qzNext(); $('#qzCard').focus();
}
function qzClose(){ $('#qz').hidden = true; document.body.style.overflow = ''; }
function alertEmpty(){ const b = $('#quizBtn'); b.textContent = '카드 없음'; setTimeout(() => b.textContent = '퀴즈', 1500); }
$('#quizBtn').addEventListener('click', qzOpen);
$('#qzClose').addEventListener('click', qzClose);
$('#qzCard').addEventListener('click', qzStep);
$('#qzFlag').addEventListener('click', () => {
  const c = qz.cur; c.classList.toggle('flag');
  c.classList.contains('flag') ? flags.add(c.dataset.id) : flags.delete(c.dataset.id);
  store.set('flags', [...flags]); qzRender();
});
document.addEventListener('keydown', e => {
  if ($('#qz').hidden) return;
  if (e.key === 'Escape'){ qzClose(); }
  else if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight'){ if (e.target.tagName !== 'BUTTON'){ e.preventDefault(); qzStep(); } }
});

const root = document.documentElement;
const savedTheme = store.get('theme', null); if (savedTheme) root.dataset.theme = savedTheme;
$('#themeBtn').addEventListener('click', () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark'; store.set('theme', root.dataset.theme);
});
</script>
