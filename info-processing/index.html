<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>정처기 실기 플래시카드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface-2:#efede7; --ink:#1d1d1b; --ink-2:#5b5a55; --ink-3:#8b8a84;
  --line:#e2e0d8; --accent:#2f5bd3; --accent-ink:#ffffff; --accent-soft:#e6ecfb;
  --mask:#e9e6dd; --mask-ink:#8b8a84; --star:#c98a06; --flag:#d24b3a; --flag-soft:#fbe9e6;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151513; --surface:#1f1f1c; --surface-2:#292925; --ink:#ecebe6; --ink-2:#b4b2aa; --ink-3:#85837b;
    --line:#34332f; --accent:#7d9cf5; --accent-ink:#10131c; --accent-soft:#232b40;
    --mask:#2d2c28; --mask-ink:#8d8b83; --star:#e6b23a; --flag:#f07b6b; --flag-soft:#3a2522;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151513; --surface:#1f1f1c; --surface-2:#292925; --ink:#ecebe6; --ink-2:#b4b2aa; --ink-3:#85837b;
  --line:#34332f; --accent:#7d9cf5; --accent-ink:#10131c; --accent-soft:#232b40;
  --mask:#2d2c28; --mask-ink:#8d8b83; --star:#e6b23a; --flag:#f07b6b; --flag-soft:#3a2522;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:128px}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  word-break:keep-all;overflow-wrap:anywhere}
button,input{font:inherit;color:inherit}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:var(--surface-2);padding:.1em .35em;border-radius:5px}

/* 상단 바 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.search{flex:1;min-width:140px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;font-size:14px}
.search:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:34px;height:32px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.pbar{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.pbar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}

/* 레이아웃 */
.wrap{max-width:1180px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px}
nav.toc{position:sticky;top:128px;align-self:start;max-height:calc(100vh - 148px);overflow:auto;font-size:13px;padding-right:4px}
nav.toc a{display:block;color:var(--ink-2);text-decoration:none;padding:4px 8px;border-radius:6px;line-height:1.35}
nav.toc a:hover{background:var(--surface-2);color:var(--ink)}
nav.toc a.loose{color:var(--ink-3);font-size:12px}
nav.toc a .st{color:var(--star)}
nav.toc .cnt{float:right;color:var(--ink-3);font-size:11px;font-variant-numeric:tabular-nums}
.toc-head{display:none}
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  nav.toc{position:fixed;inset:0 auto 0 0;top:0;width:min(82vw,320px);max-height:none;height:100%;background:var(--surface);
    z-index:40;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px));transform:translateX(-102%);transition:transform .22s;box-shadow:4px 0 24px rgba(0,0,0,.18)}
  nav.toc.open{transform:none}
  .toc-head{display:flex;justify-content:space-between;align-items:center;margin:0 4px 10px;font-weight:700}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39;display:none}
  .scrim.open{display:block}
}
@media (min-width:861px){ #tocBtn{display:none} }

/* 섹션·카드 */
.chapter{margin:8px 0 18px;padding:14px 0 10px;border-bottom:2px solid var(--ink)}
.chapter:first-child{margin-top:0}
.chapter .no{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.chapter h2{font-size:21px;margin:2px 0 0;letter-spacing:-.02em;text-wrap:balance}
nav.toc .ch{display:block;margin:14px 8px 4px;font-size:11.5px;font-weight:700;color:var(--ink);letter-spacing:.02em}
nav.toc .ch:first-of-type{margin-top:0}
.abbr{font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px;margin-left:4px;white-space:nowrap}
section{margin-bottom:26px}
section h3{font-size:15px;margin:0 0 10px;padding-top:6px;display:flex;align-items:baseline;gap:6px;letter-spacing:-.01em}
section.loose h3{color:var(--ink-3);font-size:13px;font-weight:600}
section h3 .st{color:var(--star)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px;box-shadow:var(--shadow);
  cursor:pointer;position:relative;transition:border-color .15s;outline:none;-webkit-tap-highlight-color:transparent}
.card:hover{border-color:var(--ink-3)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card.flag{border-color:var(--flag);background:linear-gradient(var(--flag-soft),var(--flag-soft)) padding-box}
.term{font-weight:700;font-size:15.5px;line-height:1.4;padding-right:44px}
.term .st{color:var(--star);margin-right:3px}
.desc{margin-top:6px;color:var(--ink-2);white-space:pre-line;font-size:14.5px}
.card.q .term{font-weight:600;font-size:14.5px;color:var(--ink-2)}
.card.q .desc{color:var(--ink);font-weight:600;font-size:15px}
.ans{position:relative}
.ans .mask{display:none}
.hide .ans .real{display:none}
.hide .ans .mask{display:inline-flex;align-items:center;gap:6px;background:var(--mask);color:var(--mask-ink);border-radius:7px;
  padding:3px 10px;font-size:12.5px;font-weight:500;letter-spacing:0;user-select:none}
.hide .ans.blk .mask{display:flex;min-height:40px;width:100%}
.reveal-anim .ans .real{animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:none}}
.flagbtn{position:absolute;top:8px;right:8px;border:0;background:transparent;width:32px;height:32px;border-radius:8px;cursor:pointer;
  color:var(--ink-3);display:grid;place-items:center}
.flagbtn:hover{background:var(--surface-2)}
.card.flag .flagbtn{color:var(--flag)}
.note{grid-column:1/-1;color:var(--ink-2);font-size:13.5px;padding:2px 2px}
.figure{grid-column:1/-1}
.figure details{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:8px 12px}
.figure summary{cursor:pointer;font-size:13px;color:var(--ink-2)}
.figure img{display:block;max-width:100%;height:auto;margin:10px auto 4px;border-radius:8px;background:#fff}
.tbl{grid-column:1/-1;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--surface-2);font-size:12.5px;color:var(--ink-2);font-weight:600}
.tbl tr:last-child td{border-bottom:0}
.tbl td.cell{cursor:pointer}
.tbl td.cell.hide .real{display:none}
.tbl td.cell .mask{display:none}
.tbl td.cell.hide .mask{display:inline-block;background:var(--mask);color:var(--mask-ink);border-radius:6px;padding:1px 10px;font-size:12px;user-select:none}
.empty{color:var(--ink-3);text-align:center;padding:48px 0}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* 퀴즈 */
.btn.quiz{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.quiz:hover{filter:brightness(1.05)}
.qz{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.qz[hidden]{display:none}
.qz-top{display:flex;align-items:center;gap:10px;max-width:760px;width:100%;margin:0 auto}
.qz-top .cnt{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;flex:1}
.qz-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:16px 0}
.qz-card{width:100%;max-width:760px;max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);padding:28px 26px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;outline:none}
.qz-card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.qz-where{font-size:12px;color:var(--ink-3);margin-bottom:14px}
.qz-a{font-size:22px;font-weight:700;line-height:1.4;letter-spacing:-.01em;text-wrap:balance}
.qz-b{margin-top:14px;font-size:17px;line-height:1.65;color:var(--ink-2);white-space:pre-line}
.qz-card.q .qz-a{font-size:18px;font-weight:600;color:var(--ink-2)}
.qz-card.q .qz-b{color:var(--ink);font-weight:600;font-size:19px}
.qz-hole{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:10px;background:var(--mask);color:var(--mask-ink);font-size:14px;font-weight:500}
.qz-a .qz-hole{display:inline-flex;min-height:0;padding:6px 16px;font-size:14px}
.qz-hint{text-align:center;font-size:12.5px;color:var(--ink-3)}
.qz-card.shown .qz-ans{animation:pop .22s ease-out}
@media (max-width:520px){.qz-card{padding:22px 18px}.qz-a{font-size:19px}.qz-b{font-size:16px}}
footer a{color:var(--ink-2)}
footer{color:var(--ink-3);font-size:12px;text-align:center;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:520px){
  body{font-size:14.5px}
  .grid{grid-template-columns:minmax(0,1fr)}
  .bar-in{padding-block:8px}
  .wrap{padding-block:12px}
  .seg button{padding:5px 9px}
  .row.ctl{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .row.ctl::-webkit-scrollbar{display:none}
  .row.ctl>*{flex:none}
  .row.ctl .search{min-width:170px;flex:1 0 170px}
}
</style>
<div class="bar"><div class="bar-in">
  <div class="row">
    <button class="icon-btn" id="tocBtn" aria-label="목차 열기">☰</button>
    <h1>정보처리기사 실기 플래시카드</h1>
    <span class="prog" id="prog">0 / 764</span>
    <button class="icon-btn" id="themeBtn" aria-label="다크 모드 전환" title="다크 모드 전환">◐</button>
  </div>
  <div class="row ctl">
    <div class="seg" role="group" aria-label="가릴 쪽">
      <button data-mode="term" aria-pressed="true">용어 가리기</button>
      <button data-mode="desc" aria-pressed="false">설명 가리기</button>
    </div>
    <button class="btn" id="starBtn" aria-pressed="false">★ 중요만</button>
    <button class="btn" id="flagBtn" aria-pressed="false"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-1px"><path d="M6 3h12v18l-6-4-6 4z"/></svg> 다시 볼 것</button>
    <button class="btn quiz" id="quizBtn">퀴즈</button>
    <button class="btn" id="allBtn">전체 펼치기</button>
    <button class="btn" id="resetBtn">다시 가리기</button>
    <input class="search" id="q" type="search" placeholder="검색 (용어·설명)" autocomplete="off">
  </div>
  <div class="pbar"><i id="pfill"></i></div>
</div></div>

<div class="qz" id="qz" hidden role="dialog" aria-modal="true" aria-label="퀴즈">
  <div class="qz-top">
    <span class="cnt" id="qzCnt"></span>
    <button class="icon-btn" id="qzFlag" aria-label="다시 볼 것 표시" title="다시 볼 것"></button>
    <button class="btn" id="qzClose">닫기</button>
  </div>
  <div class="qz-stage"><div class="qz-card" id="qzCard" tabindex="0"></div></div>
  <div class="qz-hint" id="qzHint">한 번 누르면 정답 · 한 번 더 누르면 다음 문제</div>
</div>
<div class="scrim" id="scrim"></div>
<div class="wrap">
  <nav class="toc" id="toc" aria-label="목차"><div class="toc-head">목차 <button class="icon-btn" id="tocClose" aria-label="목차 닫기">✕</button></div></nav>
  <main id="main"></main>
</div>

<script>

": "테스트 결과·고객 반응·동료 검토에서 나오는 반응을 빠르게 받아 곧바로 개선에 반영하는 것을 중시하는 가치.", "s": false}, {"k": "T", "a": "용기 (Courage)", "b": "요구가 바뀌거나 설계가 잘못되었을 때 과감히 코드를 고치거나 버리고, 문제를 숨기지 않고 드러내는 태도를 강조하는 가치.", "s": false}, {"k": "T", "a": "존중 (Respect)", "b": "팀원 각자의 능력과 기여를 인정하고 서로를 배려하며 함께 일하는 태도를 강조하는 가치.", "s": false}]}, {"ch": "1. 소프트웨어 개발 방법론 · 요구사항 · 프로젝트 관리", "t": "스크럼 구성요소", "star": true, "abbr": "", "items": [{"k": "T", "a": "제품 책임자 (PO, Product Owner)", "b": "만들 결과물의 비전을 정하고 요구사항 목록의 항목을 작성하며 우선순위를 결정하는 역할. 이해관계자의 의견을 대표한다.", "s": false}, {"k": "T", "a": "스크럼 마스터 (Scrum Master)", "b": "팀이 정해진 규칙과 절차를 잘 따르도록 돕고 진행을 가로막는 장애 요소를 찾아 없애는 조력자 역할. 지시하는 관리자가 아니다.", "s": false}, {"k": "T", "a": "백로그 (Backlog)", "b": "개발할 기능과 요구사항을 우선순위 순으로 정리해 두고 계속 갱신하는 목록. 전체 목록에서 이번 반복 주기에 처리할 항목만 골라 별도 목록을 만든다.", "s": false}, {"k": "T", "a": "스프린트 (Sprint)", "b": "보통 2~4주로 고정된 짧은 개발 반복 주기. 이 기간 안에 선정한 작업을 끝내 실제로 동작하는 결과물을 만든다.", "s": false}, {"k": "T", "a": "일일 스크럼 (Daily Scrum)", "b": "매일 같은 시간에 약 15분간 서서 진행하며 어제 한 일, 오늘 할 일, 막힌 문제를 공유하는 짧은 회의.", "s": false}, {"k": "T", "a": "스프린트 리뷰 (Sprint Review)", "b": "반복 주기가 끝날 때 완성된 결과물을 이해관계자에게 시연하고 피드백을 받아 요구사항 목록에 반영하는 회의.", "s": false}, {"k": "T", "a": "스프린트 회고 (Sprint Retrospective)", "b": "반복 주기를 마친 뒤 팀이 일하는 방식 자체를 돌아보며 잘된 점, 문제점, 다음에 바꿀 점을 정리하는 회의. 결과물보다 과정을 점검한다.", "s": false}, {"k": "T", "a": "번다운 차트 (Burndown Chart)", "b": "세로축에 남은 작업량, 가로축에 시간을 두어 작업이 줄어드는 추세를 그린 그래프. 계획 대비 진척을 한눈에 보여 준다.", "s": false}]}, {"ch": "1. 소프트웨어 개발 방법론 · 요구사항 · 프로젝트 관리", "t": "소프트웨어 생명주기 모형", "star": true, "abbr": "", "items": [{"k": "T", "a": "폭포수 모형 (Waterfall Model)", "b": "각 단계를 순서대로 끝내고 검토·승인을 거친 뒤에야 다음 단계로 넘어가는 선형 순차 모델. 앞 단계로 되돌아가기 어렵고 가장 고전적이다.", "s": false}, {"k": "Q", "a": "폭포수 모형의 단계 순서", "b": "타당성 검토 → 계획 → 요구 분석 → 설계 → 구현 → 테스트 → 유지보수", "s": false}, {"k": "T", "a": "프로토타입 모형 (Prototype Model)", "b": "요구를 정확히 파악하려고 핵심 기능만 담은 견본을 먼저 만들어 사용자에게 보여 주고, 피드백을 받아 보완해 가는 모델.", "s": false}, {"k": "T", "a": "나선형 모형 (Spiral Model)", "b": "여러 번의 반복 주기를 거치며 점진적으로 완성하되, 매 주기마다 위험을 분석하고 줄이는 데 중점을 둔 모델. 대규모·고위험 시스템에 맞다.\n보헴(Boehm) 제안", "s": false}, {"k": "Q", "a": "나선형 모형의 4단계 순서", "b": "계획 수립 → 위험 분석 → 개발 및 검증 → 고객 평가", "s": false}]}, {"ch": "1. 소프트웨어 개발 방법론 · 요구사항 · 프로젝트 관리", "t": "요구사항", "star": false, "abbr": "", "items": [{"k": "T", "a": "기능적 요구사항 (Functional Requirements)", "b": "시스템이 무엇을 해야 하는지, 즉 제공할 기능과 입력·처리·출력 내용에 관한 요구.\n예: 회원 가입, 주문 조회", "s": false}, {"k": "T", "a": "비기능적 요구사항 (Non-functional Requirements)", "b": "기능 자체가 아니라 성능·보안·가용성·사용성·제약 조건처럼 시스템이 얼마나 잘 동작해야 하는지에 관한 품질 요구.", "s": false}, {"k": "Q", "a": "요구사항 개발 프로세스 순서", "b": "도출(Elicitation) → 분석(Analysis) → 명세(Specification) → 확인(Validation)", "s": false}]}, {"ch": "1. 소프트웨어 개발 방법론 · 요구사항 · 프로젝트 관리", "t": "요구사항 분석 도구", "star": false, "abbr": "", "items": [{"k": "Q", "a": "구조적 분석 도구 5가지", "b": "자료 흐름도(DFD) · 자료 사전(DD) · 소단위 명세서 · 개체 관계도(ERD) · 상태 전이도(STD)", "s": false}, {"k": "T", "a": "자료 흐름도 (DFD, Data Flow Diagram)", "b": "처리 과정·자료 흐름·자료 저장소·외부 단말을 원·화살표·평행선·사각형으로 그려 자료가 시스템을 거치며 어떻게 변환되는지 나타내는 도식.", "s": false}, {"k": "T", "a": "자료 사전 (DD, Data Dictionary)", "b": "자료 흐름도에 나오는 자료 항목의 이름·구성·의미를 `=` `+` `[ ]` `{ }` `( )` `* *` 같은 기호로 정의해 모아 둔 문서.", "s": false}, {"k": "T", "a": "소단위 명세서 (Mini-Spec)", "b": "자료 흐름도의 가장 아래 단계 처리 과정이 수행하는 절차를 구조적 언어나 의사결정표 등으로 자세히 기술한 문서.", "s": false}, {"k": "T", "a": "개체 관계도 (ERD, Entity Relationship Diagram)", "b": "업무에 필요한 개체와 그 속성, 개체 사이의 관계를 도형으로 표현해 데이터 구조를 나타내는 도식.", "s": false}, {"k": "T", "a": "상태 전이도 (STD, State Transition Diagram)", "b": "시스템이 가질 수 있는 상태들과 어떤 사건이 일어나면 다른 상태로 바뀌는지를 그려 시간에 따른 동작을 표현하는 도식.", "s": false}, {"k": "T", "a": "UML (Unified Modeling Language)", "b": "객체지향 시스템을 분석·설계할 때 구조와 동작을 다이어그램으로 표현하는 표준 모델링 언어.\n구성: 사물, 관계, 다이어그램", "s": false}]}, {"ch": "1. 소프트웨어 개발 방법론 · 요구사항 · 프로젝트 관리", "t": "소프트웨어 재사용·재공학 (3R)", "star": false, "abbr": "", "items": [{"k": "T", "a": "역공학 (Reverse Engineering)", "b": "이미 만들어진 시스템의 코드나 실행 파일을 분석해 설계 정보·명세 같은 상위 수준의 문서를 거꾸로 뽑아내는 기법.", "s": false}, {"k": "T", "a": "재공학 (Re-engineering)", "b": "기존 시스템을 분석해 기능은 유지하면서 구조를 개선하거나 새 환경에 맞게 다시 구현해 유지보수성을 높이는 기법.\n과정: 분석 → 재구성 → 역공학 → 이관", "s": false}, {"k": "T", "a": "재사용 (Reuse)", "b": "이미 검증된 기능·모듈·설계를 새 시스템 개발에 다시 활용해 비용과 기간을 줄이고 품질을 높이는 것.", "s": false}]}, {"ch": "1. 소프트웨어 개발 방법론 · 요구사항 · 프로젝트 관리", "t": "비용 산정 — 하향식", "star": false, "abbr": "", "items": [{"k": "T", "a": "전문가 판단 기법", "b": "경험이 풍부한 숙련자가 과거 유사 프로젝트를 근거로 비용을 직관적으로 추정하는 방식. 빠르지만 개인의 편견이 끼어들기 쉽다.", "s": false}, {"k": "T", "a": "델파이 기법 (Delphi Method)", "b": "여러 전문가의 추정치를 조정자가 익명으로 모아 다시 돌려주는 과정을 반복해 합의된 값을 끌어내는 방식. 한 사람의 편견을 줄인다.", "s": false}]}, {"ch": "1. 소프트웨어 개발 방법론 · 요구사항 · 프로젝트 관리", "t": "비용 산정 — 상향식", "star": false, "abbr": "", "items": [{"k": "T", "a": "LOC 기법 (Lines of Code)", "b": "원시 코드 줄 수를 낙관치·중간치·비관치로 예측한 뒤 가중 평균으로 기대치를 구해 비용을 산정하는 방식.\n예측치 = (낙관치 + 4×중간치 + 비관치) ÷ 6", "s": false}, {"k": "T", "a": "Man Month 기법", "b": "한 사람이 한 달 동안 해낼 수 있는 작업량을 기준 단위로 삼아 전체 노력과 기간을 산정하는 방식.\n노력 = LOC ÷ 1인당 월평균 생산 LOC, 기간 = 노력 ÷ 투입 인원", "s": false}]}, {"ch": "1. 소프트웨어 개발 방법론 · 요구사항 · 프로젝트 관리", "t": "비용 산정 — 수학적", "star": true, "abbr": "", "items": [{"k": "T", "a": "COCOMO (COnstructive COst MOdel)", "b": "보헴이 제안한 모델로, 예상 원시 코드 줄 수(KDSI)를 개발 유형별 공식에 넣어 필요한 노력(인·월)과 기간을 산출하는 방식.", "s": false}, {"k": "Q", "a": "COCOMO 개발 유형 3가지 (규모 기준)", "b": "조직형(Organic, 5만 라인 이하) · 반분리형(Semi-detached, 30만 라인 이하) · 내장형(Embedded, 30만 라인 이상)", "s": false}, {"k": "T", "a": "Putnam 모형", "b": "개발 생명주기 전 과정에 걸친 노력의 분포를 가정해 비용을 산정하는 모델. 레일리-노든(Rayleigh-Norden) 곡선에 기반한다.\n자동화 도구: SLIM", "s": false}, {"k": "T", "a": "기능 점수 (FP, Function Point)", "b": "코드 줄 수 대신 입력·출력·조회·내부 파일·외부 인터페이스 같은 기능 요소의 수와 복잡도에 가중치를 매겨 규모와 비용을 산정하는 방식.\n자동화 도구: ESTIMACS", "s": false}]}, {"ch": "1. 소프트웨어 개발 방법론 · 요구사항 · 프로젝트 관리", "t": "프로젝트 관리", "star": false, "abbr": "", "items": [{"k": "Q", "a": "프로젝트 관리의 3P", "b": "사람(People) · 문제(Problem) · 프로세스(Process)", "s": false}, {"k": "T", "a": "간트 차트 (Gantt Chart)", "b": "각 작업의 시작일과 종료일을 가로 막대로 표시해 일정과 진척을 시간 축 위에 나타내는 도표. 작업 간 선후 관계를 보여 주는 데는 약하다.", "s": false}, {"k": "T", "a": "PERT (Program Evaluation and Review Technique)", "b": "작업 간 선후 관계를 네트워크 도표로 그리고, 각 작업 기간을 낙관치·보통치·비관치 세 값으로 추정해 일정을 계산하는 기법.\n기대 시간 = (낙관 + 4×보통 + 비관) ÷ 6", "s": false}, {"k": "T", "a": "CPM (Critical Path Method)", "b": "작업 간 선후 관계를 네트워크로 그린 뒤 처음부터 끝까지 가장 오래 걸리는 경로를 찾아 전체 최소 소요 기간과 여유가 없는 작업을 파악하는 기법.", "s": false}]}, {"ch": "1. 소프트웨어 개발 방법론 · 요구사항 · 프로젝트 관리", "t": "형상 관리", "star": true, "abbr": "", "items": [{"k": "T", "a": "형상 관리 (SCM, Software Configuration Management)", "b": "개발 중 생기는 코드·문서 같은 산출물의 변경을 식별하고 통제·추적해 일관성을 유지하는 활동.\n도구: Git, SVN, CVS", "s": false}, {"k": "Q", "a": "형상 관리 절차 순서", "b": "형상 식별 → 형상 통제 → 형상 감사 → 형상 기록(상태 보고)", "s": false}, {"k": "T", "a": "형상 통제 (Configuration Control)", "b": "산출물에 대한 변경 요청을 전담 위원회(CCB)가 검토·승인한 뒤에만 기준선에 반영되도록 관리하는 활동.", "s": false}, {"k": "T", "a": "베이스라인 (Baseline, 기준선)", "b": "공식 검토와 승인을 거쳐 확정된 산출물의 상태. 이 시점 이후의 변경은 정해진 통제 절차를 거쳐야만 가능하다.", "s": false}]}, {"ch": "1. 소프트웨어 개발 방법론 · 요구사항 · 프로젝트 관리", "t": "릴리즈 노트", "star": false, "abbr": "", "items": [{"k": "T", "a": "릴리즈 노트 (Release Note)", "b": "배포하는 소프트웨어 버전의 새 기능, 고친 결함, 변경 사항, 알려진 문제 등을 정리해 사용자에게 알리는 문서.", "s": false}, {"k": "T", "a": "헤더 (Header)", "b": "배포 안내 문서의 맨 앞 항목으로 문서 이름, 제품 이름, 버전 번호, 배포일, 참고 날짜 등을 적는 부분.", "s": false}, {"k": "Q", "a": "릴리즈 노트 작성 항목 순서", "b": "헤더 → 개요 → 목적 → 문제 요약 → 재현 항목 → 수정/개선 내용 → 사용자 영향도 → SW 지원 영향도 → 노트 → 면책 조항 → 연락처", "s": false}]}, {"ch": "1. 소프트웨어 개발 방법론 · 요구사항 · 프로젝트 관리", "t": "소프트웨어 아키텍처 패턴", "star": true, "abbr": "", "items": [{"k": "T", "a": "레이어 패턴 (Layers Pattern)", "b": "시스템을 위아래 여러 층으로 나누어 각 층이 바로 아래 층의 서비스만 사용하고 위 층에는 서비스를 제공하도록 구성하는 구조.\n예: OSI 7계층", "s": false}, {"k": "T", "a": "클라이언트-서버 패턴 (Client-Server Pattern)", "b": "하나의 중앙 컴포넌트가 여러 요청 측 컴포넌트에 서비스를 제공하는 구조. 요청 측이 요청을 보내면 제공 측이 처리해 응답한다.", "s": false}, {"k": "T", "a": "파이프-필터 패턴 (Pipe-Filter Pattern)", "b": "데이터 스트림을 처리하는 각 단계를 독립 컴포넌트로 캡슐화하고 통로로 이어, 한 단계의 출력이 다음 단계의 입력이 되게 하는 구조.\n예: UNIX 셸 명령 연결", "s": false}, {"k": "T", "a": "브로커 패턴 (Broker Pattern)", "b": "분산된 컴포넌트들 사이에서 중개 컴포넌트가 요청을 받아 알맞은 서버로 전달하고 결과를 돌려주며 통신을 조정하는 구조.\n예: CORBA", "s": false}, {"k": "T", "a": "피어 투 피어 패턴 (Peer-to-Peer Pattern)", "b": "각 컴포넌트가 상황에 따라 요청하는 쪽과 서비스하는 쪽 역할을 모두 맡아 서로 대등하게 통신하는 구조.\n예: 파일 공유", "s": false}, {"k": "T", "a": "이벤트-버스 패턴 (Event-Bus Pattern)", "b": "발행자가 특정 채널에 메시지를 보내면 그 채널을 구독한 수신자들이 메시지를 받아 처리하는 구조.\n구성: 소스, 리스너, 채널", "s": false}, {"k": "T", "a": "MVC 패턴 (Model-View-Controller Pattern)", "b": "애플리케이션을 데이터와 핵심 로직, 사용자에게 보여 주는 화면, 입력을 받아 둘을 조정하는 부분의 세 구성요소로 분리하는 구조.", "s": false}, {"k": "T", "a": "마스터-슬레이브 패턴 (Master-Slave Pattern)", "b": "주 컴포넌트가 같은 구조의 하위 컴포넌트들에 작업을 나눠 주고, 하위 컴포넌트가 돌려준 결과를 모아 최종 결과를 만드는 구조.\n예: DB 복제", "s": false}, {"k": "T", "a": "블랙보드 패턴 (Blackboard Pattern)", "b": "정해진 해결 전략이 없는 문제에서 여러 지식 소스가 공유 저장소에 부분 해를 쓰고 읽으며 협력해 답을 찾아가는 구조.\n예: 음성 인식", "s": false}, {"k": "T", "a": "인터프리터 패턴 (Interpreter Pattern)", "b": "특정 언어로 작성된 프로그램이나 문장을 해석해 실행하는 컴포넌트를 설계하는 구조.\n예: 질의 언어 해석기", "s": false}]}, {"ch": "1. 소프트웨어 개발 방법론 · 요구사항 · 프로젝트 관리", "t": "연계 요구사항 분석 기법", "star": false, "abbr": "", "items": [{"k": "T", "a": "인터뷰 (Interview)", "b": "이해관계자를 직접 만나 묻고 답하며 요구사항을 수집하는 기법. 자세한 정보를 얻을 수 있지만 시간이 많이 든다.", "s": false}, {"k": "T", "a": "체크리스트 (Checklist)", "b": "미리 정리해 둔 점검 항목 목록에 따라 연계 대상 시스템의 요구사항을 빠짐없이 확인하는 기법.", "s": false}, {"k": "T", "a": "설문지 (Questionnaire)", "b": "정해진 질문 양식을 다수의 관계자에게 배포하고 회수해 요구사항을 수집하는 기법. 짧은 시간에 많은 의견을 모을 수 있다.", "s": false}, {"k": "T", "a": "델파이 기법 (Delphi Method)", "b": "여러 전문가에게 익명으로 의견을 받아 정리·공유하는 과정을 되풀이해 합의된 요구사항을 도출하는 기법.", "s": false}, {"k": "T", "a": "브레인스토밍 (Brainstorming)", "b": "여러 참여자가 비판 없이 자유롭게 아이디어를 쏟아낸 뒤 이를 정리해 요구사항을 발굴하는 회의 기법.", "s": false}]}, {"ch": "2. 소프트웨어 설계 · 객체지향 · UML", "t": "결합도·응집도 순서", "star": true, "abbr": "", "items": [{"k": "Q", "a": "결합도 순서 (강함 → 약함)", "b": "내용 → 공통 → 외부 → 제어 → 스탬프 → 자료", "s": false}, {"k": "Q", "a": "응집도 순서 (약함 → 강함)", "b": "우연적 → 논리적 → 시간적 → 절차적 → 통신적 → 순차적 → 기능적", "s": false}, {"k": "N", "a": "결합도는 낮을수록, 응집도는 높을수록 좋은 설계다."}]}, {"ch": "2. 소프트웨어 설계 · 객체지향 · UML", "t": "결합도 종류", "star": false, "abbr": "내공외제스자", "items": [{"k": "T", "a": "내용 결합도 (Content Coupling)", "b": "한 모듈이 다른 모듈의 내부 변수나 코드를 직접 참조하거나 고치는, 가장 강한 의존 형태.", "s": false}, {"k": "T", "a": "공통 결합도 (Common Coupling)", "b": "여러 모듈이 하나의 전역 변수나 공유 데이터 영역을 함께 읽고 쓰는 형태.\n그 영역을 한 번 고치면 쓰는 모듈 전부가 영향을 받는다", "s": false}, {"k": "T", "a": "외부 결합도 (External Coupling)", "b": "어떤 모듈이 선언한 데이터(변수)를 다른 모듈이 가져다 참조하는 형태.\n전역 영역 전체가 아니라 특정 선언 데이터만 공유한다", "s": false}, {"k": "T", "a": "제어 결합도 (Control Coupling)", "b": "한 모듈이 플래그 같은 신호를 넘겨 다른 모듈의 내부 처리 흐름을 결정하는 형태.\n제어 정보가 거꾸로 흘러 호출 관계가 뒤집히는 권리 전도가 생길 수 있다", "s": false}, {"k": "T", "a": "스탬프 결합도 (Stamp Coupling)", "b": "모듈 사이에 배열·레코드 같은 자료 구조를 통째로 넘기고, 받는 쪽은 그 일부만 쓰는 형태.\n구조가 바뀌면 해당 필드를 안 쓰는 모듈도 영향을 받는다", "s": false}, {"k": "T", "a": "자료 결합도 (Data Coupling)", "b": "모듈끼리 꼭 필요한 값만 매개변수로 주고받는, 가장 약하고 바람직한 형태.", "s": false}]}, {"ch": "2. 소프트웨어 설계 · 객체지향 · UML", "t": "응집도 종류", "star": false, "abbr": "우논시절통순기", "items": [{"k": "T", "a": "우연적 응집도 (Coincidental Cohesion)", "b": "서로 아무 관련 없는 처리들이 별다른 이유 없이 한 모듈에 모여 있는, 가장 약한 형태.", "s": false}, {"k": "T", "a": "논리적 응집도 (Logical Cohesion)", "b": "성격이 비슷해 같은 범주로 볼 수 있는 처리들을 한 모듈에 넣고, 플래그로 골라 실행하는 형태.\n예: 장치별 입력 루틴을 한 모듈에 모아 둔 경우", "s": false}, {"k": "T", "a": "시간적 응집도 (Temporal Cohesion)", "b": "초기화·종료 처리처럼 같은 시점에 실행된다는 이유 하나로 묶인 형태.", "s": false}, {"k": "T", "a": "절차적 응집도 (Procedural Cohesion)", "b": "정해진 순서대로 수행된다는 이유로 묶였지만, 요소끼리 데이터를 넘겨주지는 않는 형태.", "s": false}, {"k": "T", "a": "통신적 응집도 (Communicational Cohesion)", "b": "같은 입력 데이터를 쓰거나 같은 출력 데이터를 만드는 서로 다른 처리들을 한 모듈로 묶은 형태.", "s": false}, {"k": "T", "a": "순차적 응집도 (Sequential Cohesion)", "b": "한 요소의 출력이 곧바로 다음 요소의 입력이 되는 처리들을 한 모듈로 묶은 형태.", "s": false}, {"k": "T", "a": "기능적 응집도 (Functional Cohesion)", "b": "모듈 안의 모든 요소가 하나의 명확한 일을 위해 협력하는, 가장 강하고 바람직한 형태.", "s": false}]}, {"ch": "2. 소프트웨어 설계 · 객체지향 · UML", "t": "객체지향 특징", "star": false, "abbr": "", "items": [{"k": "T", "a": "캡슐화 (Encapsulation)", "b": "데이터(속성)와 그 데이터를 다루는 연산(메서드)을 하나의 단위로 묶어 다루는 것.\n변경의 파급을 줄이고 재사용을 쉽게 한다", "s": false}, {"k": "T", "a": "정보 은닉 (Information Hiding)", "b": "객체의 내부 구현은 감추고 공개된 인터페이스로만 접근하게 해, 내부를 바꿔도 외부에 영향이 퍼지지 않게 하는 원리.", "s": false}, {"k": "T", "a": "상속 (Inheritance)", "b": "상위 클래스의 속성과 연산을 하위 클래스가 물려받아 그대로 쓰거나 확장하는 것.", "s": false}, {"k": "T", "a": "다형성 (Polymorphism)", "b": "같은 이름의 메시지를 받아도 객체마다 자기 방식으로 다르게 응답하는 성질.\n오버로딩·오버라이딩으로 구현", "s": false}, {"k": "T", "a": "추상화 (Abstraction)", "b": "복잡한 대상에서 문제와 상관없는 세부는 덜어 내고 핵심 특징만 뽑아 모델로 나타내는 것.\n종류: 기능·자료·제어", "s": false}]}, {"ch": "2. 소프트웨어 설계 · 객체지향 · UML", "t": "객체지향 설계 원칙 (SOLID)", "star": true, "abbr": "SOLID", "items": [{"k": "T", "a": "SRP (Single Responsibility Principle)", "b": "하나의 클래스는 한 가지 책임만 지고, 바뀌어야 할 이유도 하나뿐이어야 한다는 원칙.", "s": false}, {"k": "T", "a": "OCP (Open-Closed Principle)", "b": "새 기능을 덧붙이는 확장은 허용하되, 이미 동작하는 기존 코드는 고치지 않아도 되도록 설계해야 한다는 원칙.", "s": false}, {"k": "T", "a": "LSP (Liskov Substitution Principle)", "b": "하위 타입 객체를 상위 타입 객체 자리에 넣어도 프로그램이 올바르게 동작해야 한다는 원칙.", "s": false}, {"k": "T", "a": "ISP (Interface Segregation Principle)", "b": "클라이언트가 쓰지 않는 메서드에 의존하지 않도록, 범용 메서드 묶음 하나를 역할별 작은 묶음 여러 개로 쪼개야 한다는 원칙.", "s": false}, {"k": "T", "a": "DIP (Dependency Inversion Principle)", "b": "상위 모듈과 하위 모듈 모두 구체 구현이 아니라 추상 타입에 기대야 한다는 원칙.\n참조 방향: 구체 클래스 → 인터페이스·추상 클래스", "s": false}]}, {"ch": "2. 소프트웨어 설계 · 객체지향 · UML", "t": "럼바우 (Rumbaugh) 객체지향 분석 기법", "star": true, "abbr": "객동기", "items": [{"k": "T", "a": "객체 모델링 (Object Modeling)", "b": "시스템의 구성 요소와 그 속성·관계를 찾아 정적 구조도(객체 다이어그램)로 표현하는 첫 단계.\n정보 모델링이라고도 한다", "s": false}, {"k": "T", "a": "동적 모델링 (Dynamic Modeling)", "b": "시간 흐름에 따라 객체가 겪는 상태 변화와 제어 흐름을 상태 다이어그램으로 표현하는 단계.", "s": false}, {"k": "T", "a": "기능 모델링 (Functional Modeling)", "b": "입력이 어떤 처리를 거쳐 출력으로 바뀌는지 자료 흐름도(DFD)로 표현하는 단계.", "s": false}, {"k": "N", "a": "수행 순서: 객체 → 동적 → 기능 (그룹 앞글자 순서 그대로)"}]}, {"ch": "2. 소프트웨어 설계 · 객체지향 · UML", "t": "기타 객체지향 분석 방법론", "star": false, "abbr": "", "items": [{"k": "T", "a": "부치 (Booch) 방법", "b": "미시적·거시적 개발 프로세스를 모두 쓰며 클래스와 객체를 식별하고 그 속성·연산을 정의해 나가는 방법.", "s": false}, {"k": "T", "a": "코드-요든 (Coad-Yourdon) 방법", "b": "E-R 다이어그램을 써서 객체의 행위를 모델링하고, 객체·구조·주제·속성·연산 순으로 식별해 나가는 방법.", "s": false}, {"k": "T", "a": "야콥슨 (Jacobson) 방법", "b": "유스케이스를 중심에 두고 사용자와 시스템의 상호작용을 따라가며 분석하는 방법.\nOOSE", "s": false}, {"k": "T", "a": "워프스-브록 (Wirfs-Brock) 방법", "b": "분석과 설계를 따로 나누지 않고, 고객 명세서를 평가하는 일부터 설계까지 이어서 진행하는 방법.", "s": false}]}, {"ch": "2. 소프트웨어 설계 · 객체지향 · UML", "t": "디자인 패턴 분류 (GoF)", "star": true, "abbr": "", "items": [{"k": "T", "a": "생성 패턴 (Creational Pattern)", "b": "객체를 만드는 과정을 캡슐화해, 무엇을 어떻게 만들지를 사용하는 코드로부터 떼어 내는 패턴 묶음.", "s": false}, {"k": "T", "a": "구조 패턴 (Structural Pattern)", "b": "클래스나 객체를 조합해 더 큰 구성을 만드는 방법을 다루는 패턴 묶음.", "s": false}, {"k": "T", "a": "행위 패턴 (Behavioral Pattern)", "b": "객체 사이의 책임 분배와 상호작용, 알고리즘의 흐름을 다루는 패턴 묶음.", "s": false}, {"k": "Q", "a": "생성 패턴 5가지", "b": "Builder, Prototype, Factory Method, Abstract Factory, Singleton", "s": false}, {"k": "Q", "a": "구조 패턴 7가지", "b": "Adapter, Bridge, Composite, Decorator, Facade, Flyweight, Proxy", "s": false}, {"k": "Q", "a": "행위 패턴 11가지", "b": "Chain of Responsibility, Command, Interpreter, Iterator, Mediator, Memento, Observer, State, Strategy, Template Method, Visitor", "s": false}, {"k": "N", "a": "GoF 23개 = 생성 5 + 구조 7 + 행위 11"}]}, {"ch": "2. 소프트웨어 설계 · 객체지향 · UML", "t": "생성 패턴", "star": false, "abbr": "", "items": [{"k": "T", "a": "빌더 (Builder)", "b": "복잡한 객체를 만드는 단계를 분리해, 같은 조립 절차로 서로 다른 표현의 결과물을 얻게 하는 패턴.\n부품을 하나씩 끼워 완성품을 만드는 방식", "s": false}, {"k": "T", "a": "프로토타입 (Prototype)", "b": "새로 만드는 대신 이미 만들어 둔 객체를 복사(clone)해서 새 객체를 얻는 패턴.\n만드는 비용이 큰 객체를 매번 처음부터 만들지 않아도 된다", "s": false}, {"k": "T", "a": "팩토리 메서드 (Factory Method)", "b": "객체를 만드는 인터페이스는 상위 클래스가 정하고, 어떤 클래스의 인스턴스를 만들지는 하위 클래스가 정하게 하는 패턴.\n가상 생성자(Virtual Constructor)라고도 한다", "s": false}, {"k": "T", "a": "추상 팩토리 (Abstract Factory)", "b": "구체 클래스를 지정하지 않고, 서로 관련된 객체들의 제품군을 한꺼번에 만들 수 있는 인터페이스를 제공하는 패턴.", "s": false}, {"k": "T", "a": "싱글톤 (Singleton)", "b": "어떤 클래스의 인스턴스가 오직 하나만 만들어지도록 보장하고, 어디서든 그 하나에 접근할 통로를 주는 패턴.", "s": false}]}, {"ch": "2. 소프트웨어 설계 · 객체지향 · UML", "t": "구조 패턴", "star": false, "abbr": "", "items": [{"k": "T", "a": "어댑터 (Adapter)", "b": "호환되지 않는 인터페이스를 가진 클래스를 감싸, 클라이언트가 기대하는 인터페이스로 바꿔 주는 패턴.\n110V ↔ 220V 변환 플러그", "s": false}, {"k": "T", "a": "브리지 (Bridge)", "b": "기능 계층과 구현 계층을 분리해, 두 계층이 서로 독립적으로 확장될 수 있게 하는 패턴.", "s": false}, {"k": "T", "a": "컴포지트 (Composite)", "b": "단일 객체와 여러 객체를 담은 그릇 객체를 트리로 구성해, 클라이언트가 둘을 똑같이 다루게 하는 패턴.\n파일과 폴더의 관계", "s": false}, {"k": "T", "a": "데코레이터 (Decorator)", "b": "기존 객체를 겹겹이 감싸, 상속 없이 실행 중에 새 기능(책임)을 덧붙이는 패턴.", "s": false}, {"k": "T", "a": "퍼사드 (Facade)", "b": "복잡한 서브시스템 앞에 단순한 통합 창구 하나를 두어, 클라이언트가 내부를 몰라도 쓸 수 있게 하는 패턴.", "s": false}, {"k": "T", "a": "플라이웨이트 (Flyweight)", "b": "여러 객체가 공통으로 갖는 상태를 공유해 인스턴스 수와 메모리 사용을 줄이는 패턴.", "s": false}, {"k": "T", "a": "프록시 (Proxy)", "b": "실제 객체 앞에 대리 객체를 두어 접근 제어·지연 로딩·원격 접근 같은 일을 대신 처리하게 하는 패턴.", "s": false}]}, {"ch": "2. 소프트웨어 설계 · 객체지향 · UML", "t": "행위 패턴", "star": false, "abbr": "", "items": [{"k": "T", "a": "책임 연쇄 (Chain of Responsibility)", "b": "요청을 처리할 수 있는 객체들을 사슬처럼 이어, 처리할 객체가 나올 때까지 요청을 차례로 넘기는 패턴.", "s": false}, {"k": "T", "a": "커맨드 (Command)", "b": "요청 자체를 객체로 캡슐화해, 요청을 매개변수화·대기열·기록할 수 있고 실행 취소(undo)도 가능하게 하는 패턴.", "s": false}, {"k": "T", "a": "인터프리터 (Interpreter)", "b": "간단한 언어의 문법 규칙을 클래스 계층으로 표현하고, 이를 이용해 문장을 평가·실행하는 패턴.\n예: SQL·정규식 처리기", "s": false}, {"k": "T", "a": "이터레이터 (Iterator)", "b": "컬렉션의 내부 표현을 드러내지 않고 그 원소들에 하나씩 차례로 접근하는 방법을 제공하는 패턴.", "s": false}, {"k": "T", "a": "미디에이터 (Mediator)", "b": "여러 객체가 서로 직접 참조하지 않고 중재 객체를 거쳐 소통하게 해 객체 간 결합을 줄이는 패턴.", "s": false}, {"k": "T", "a": "메멘토 (Memento)", "b": "캡슐화를 깨지 않고 객체의 내부 상태를 저장해 두었다가 나중에 그 상태로 되돌릴 수 있게 하는 패턴.\n예: Ctrl+Z", "s": false}, {"k": "T", "a": "옵저버 (Observer)", "b": "한 객체의 상태가 바뀌면 그 객체를 지켜보는 다른 객체들에게 자동으로 알림이 가고 갱신되는 일대다 의존 패턴.", "s": false}, {"k": "T", "a": "스테이트 (State)", "b": "객체의 내부 모드(예: 대기·실행·정지)마다 행동을 별도 클래스로 나눠, 모드가 바뀌면 같은 호출도 다르게 동작하게 하는 패턴.", "s": false}, {"k": "T", "a": "스트래티지 (Strategy)", "b": "같은 문제를 푸는 여러 알고리즘을 각각 캡슐화해 서로 바꿔 끼울 수 있게 하고, 실행 중에 골라 쓰게 하는 패턴.", "s": false}, {"k": "T", "a": "템플릿 메서드 (Template Method)", "b": "상위 클래스가 알고리즘의 골격(처리 순서)을 정해 두고, 세부 단계 일부를 하위 클래스가 재정의하게 하는 패턴.", "s": false}, {"k": "T", "a": "비지터 (Visitor)", "b": "데이터 구조와 그 위에서 수행할 연산을 분리해, 구조를 바꾸지 않고 새 연산을 추가할 수 있게 하는 패턴.\n각 원소가 연산 객체를 받아들여(accept) 처리를 맡긴다", "s": false}]}, {"ch": "2. 소프트웨어 설계 · 객체지향 · UML", "t": "UML 구조 다이어그램 (정적)", "star": false, "abbr": "", "items": [{"k": "T", "a": "클래스 다이어그램 (Class Diagram)", "b": "시스템을 이루는 클래스의 속성·연산과 그 사이의 관계를 그려 정적 구조를 보여 주는 다이어그램.", "s": false}, {"k": "T", "a": "객체 다이어그램 (Object Diagram)", "b": "특정 시점에 실제로 존재하는 인스턴스들과 그 사이의 링크를 스냅숏처럼 표현하는 다이어그램.", "s": false}, {"k": "T", "a": "패키지 다이어그램 (Package Diagram)", "b": "관련 모델 요소들을 묶음 단위로 그룹화하고, 묶음 사이의 의존 관계를 표현하는 다이어그램.", "s": false}, {"k": "T", "a": "컴포넌트 다이어그램 (Component Diagram)", "b": "구현 단계에서 교체 가능한 소프트웨어 부품들과 그 사이의 인터페이스·의존 관계를 표현하는 다이어그램.", "s": false}, {"k": "T", "a": "배치 다이어그램 (Deployment Diagram)", "b": "하드웨어 노드(서버·장치)와 그 위에 올라가는 산출물, 노드 간 통신 경로를 표현하는 물리적 다이어그램.", "s": false}, {"k": "T", "a": "복합체 구조 다이어그램 (Composite Structure Diagram)", "b": "클래스나 컴포넌트의 내부 구조를 파트·포트·연결자로 자세히 표현하는 다이어그램.", "s": false}]}, {"ch": "2. 소프트웨어 설계 · 객체지향 · UML", "t": "클래스 다이어그램 구성요소", "star": false, "abbr": "", "items": [{"k": "Q", "a": "클래스 표기의 세 칸 (위 → 아래)", "b": "이름 → 속성 → 연산(메서드)", "s": false}, {"k": "T", "a": "속성 (Attribute)", "b": "클래스가 가지는 데이터로, 각 객체의 성질이나 현재 값을 나타내는 구성 요소.\n표기 예: `- name: String`", "s": false}, {"k": "T", "a": "연산 (Operation)", "b": "클래스가 외부 요청을 받아 수행할 수 있는 동작으로, 코드로 구현하면 메서드가 되는 것.\n표기 예: `+ getName(): String`", "s": false}, {"k": "T", "a": "접근 제어자 (Access Modifier)", "b": "속성·연산 이름 앞에 기호를 붙여, 외부에서 접근할 수 있는 범위를 나타내는 것.", "s": false}, {"k": "Q", "a": "UML 접근 제어자 기호 `+` `#` `~` `-`", "b": "`+` public · `#` protected · `~` package(default) · `-` private", "s": false}]}, {"ch": "2. 소프트웨어 설계 · 객체지향 · UML", "t": "UML 행위 다이어그램 (동적)", "star": false, "abbr": "", "items": [{"k": "T", "a": "유스케이스 다이어그램 (Use Case Diagram)", "b": "사용자(액터) 관점에서 시스템이 제공하는 기능과 액터의 관계를 그려 요구사항을 정리하는 다이어그램.\n관계: 포함(include)·확장(extend)·일반화", "s": false}, {"k": "T", "a": "활동 다이어그램 (Activity Diagram)", "b": "처리 흐름을 단계별 동작과 분기·병렬 흐름으로 그려 업무나 알고리즘의 진행을 보여 주는 다이어그램.\n순서도와 비슷하다", "s": false}, {"k": "T", "a": "상태 다이어그램 (State Diagram)", "b": "한 객체가 이벤트를 받을 때마다 어떤 조건에서 어떤 조건으로 전이하는지 표현하는 다이어그램.\n럼바우 동적 모델링에 쓰인다", "s": false}, {"k": "T", "a": "순서 다이어그램 (Sequence Diagram)", "b": "객체들이 주고받는 메시지를 위에서 아래로 흐르는 시간 축에 따라 표현하는 다이어그램.\n구성: 액터·객체·생명선·실행(활성) 상자·메시지", "s": false}, {"k": "T", "a": "커뮤니케이션 다이어그램 (Communication Diagram)", "b": "객체 간 메시지 교환을 그리되, 시간 순서보다 객체 사이의 연결(링크) 관계에 초점을 둔 다이어그램.\n옛 이름: 협업(Collaboration) 다이어그램", "s": false}, {"k": "T", "a": "타이밍 다이어그램 (Timing Diagram)", "b": "객체의 조건 변화를 정확한 시간 축 위에 그려 시간 제약을 드러내는 다이어그램.", "s": false}, {"k": "T", "a": "상호작용 개요 다이어그램 (Interaction Overview Diagram)", "b": "여러 순서·커뮤니케이션 다이어그램 조각을 활동 다이어그램처럼 이어 전체 제어 흐름을 한눈에 보여 주는 다이어그램.", "s": false}]}, {"ch": "2. 소프트웨어 설계 · 객체지향 · UML", "t": "활동 다이어그램 요소", "star": false, "abbr": "", "items": [{"k": "T", "a": "포크 노드 (Fork Node)", "b": "하나의 흐름을 여러 개의 병렬 흐름으로 나누는 지점으로, 굵은 막대로 그린다.", "s": false}, {"k": "T", "a": "조인 노드 (Join Node)", "b": "병렬로 갈라졌던 여러 흐름을 다시 하나로 합치는 지점으로, 굵은 막대로 그린다.", "s": false}, {"k": "T", "a": "결정(조건) 노드 (Decision Node)", "b": "조건에 따라 흐름이 여러 갈래 중 하나로 나뉘는 지점으로, 마름모로 그린다.", "s": false}, {"k": "T", "a": "병합 노드 (Merge Node)", "b": "조건 분기로 갈라졌던 흐름들을 다시 하나로 모으는 지점으로, 마름모로 그린다.", "s": false}, {"k": "T", "a": "구획면 (Swimlane)", "b": "활동을 수행 주체(부서·역할)별로 나눠 보이게 하려고 그은 가로 또는 세로 구역.", "s": false}]}, {"ch": "2. 소프트웨어 설계 · 객체지향 · UML", "t": "UML 관계", "star": true, "abbr": "", "items": [{"k": "T", "a": "연관 관계 (Association)", "b": "두 사물이 서로 의미 있게 관련되어 있어 한쪽이 다른 쪽을 알고 있음을 실선으로 잇는 관계.\n방향이 있으면 화살표, 양 끝에 다중도 표기", "s": false}, {"k": "T", "a": "집합(집약) 관계 (Aggregation)", "b": "전체와 부분의 관계이지만 부분이 전체 없이도 독립적으로 존재할 수 있는 관계.\n전체 쪽에 속이 빈 마름모", "s": false}, {"k": "T", "a": "포함(합성) 관계 (Composition)", "b": "부분이 전체에 종속되어 전체가 사라지면 부분도 함께 사라지는 강한 전체-부분 관계.\n전체 쪽에 속이 채워진 마름모", "s": false}, {"k": "T", "a": "일반화 관계 (Generalization)", "b": "한 사물이 다른 사물보다 더 포괄적인 개념이어서 상위·하위로 나뉘는 is-a 관계.\n하위 → 상위로 속이 빈 삼각형 화살표 실선", "s": false}, {"k": "T", "a": "실체화 관계 (Realization)", "b": "인터페이스가 정해 둔 기능을 클래스가 실제로 구현해 내는 관계.\n속이 빈 삼각형 화살표 점선", "s": false}, {"k": "T", "a": "의존 관계 (Dependency)", "b": "한 사물이 다른 사물을 잠깐 사용하는 짧은 관계로, 상대가 바뀌면 영향을 받는 관계.\n점선 화살표", "s": false}]}, {"ch": "2. 소프트웨어 설계 · 객체지향 · UML", "t": "단위 모듈 작성 원칙", "star": false, "abbr": "정명완일추", "items": [{"k": "T", "a": "정확성 (Correctness)", "b": "모듈이 실제로 필요한 기능을 요구한 대로 틀림없이 수행하도록 작성해야 한다는 원칙.", "s": false}, {"k": "T", "a": "명확성 (Clarity)", "b": "코드를 읽는 누구나 같은 의미로 이해할 수 있도록 모호함 없이 작성해야 한다는 원칙.", "s": false}, {"k": "T", "a": "완전성 (Completeness)", "b": "모듈이 동작하는 데 필요한 요소와 처리를 하나도 빠뜨리지 않고 작성해야 한다는 원칙.", "s": false}, {"k": "T", "a": "일관성 (Consistency)", "b": "공통 코드와 표기·작성 방식을 모듈 전반에 같은 규칙으로 적용해야 한다는 원칙.", "s": false}, {"k": "T", "a": "추적성 (Traceability)", "b": "각 모듈이 어떤 요구사항에서 나왔고 다른 모듈과 어떻게 이어지는지 따라갈 수 있게 작성해야 한다는 원칙.", "s": false}]}, {"ch": "2. 소프트웨어 설계 · 객체지향 · UML", "t": "모듈 구조 지표", "star": false, "abbr": "", "items": [{"k": "T", "a": "팬인 (Fan-In)", "b": "시스템 구조도에서 어떤 모듈을 호출하는 상위 모듈의 수. 즉 그 모듈로 제어가 들어오는 갈래 수이고, 값이 크면 여러 곳에서 재사용되는 공통 모듈이다", "s": false}, {"k": "T", "a": "팬아웃 (Fan-Out)", "b": "어떤 모듈이 직접 호출하는 하위 모듈의 수. 값이 지나치게 크면 그 모듈이 너무 많은 일을 떠맡아 복잡도가 높다는 신호다", "s": false}, {"k": "N", "a": "좋은 구조는 공통 모듈이 여러 번 쓰이도록 들어오는 갈래는 늘리고, 한 모듈이 부르는 하위 모듈 수는 줄인다"}]}, {"ch": "2. 소프트웨어 설계 · 객체지향 · UML", "t": "코딩 표기법", "star": false, "abbr": "", "items": [{"k": "T", "a": "헝가리안 표기법 (Hungarian Notation)", "b": "변수 이름 맨 앞에 그 변수의 자료형을 뜻하는 짧은 접두어를 붙여 쓰는 방식.\n예: `nCount`, `szName`, `bFlag`", "s": false}, {"k": "T", "a": "카멜 표기법 (Camel Case)", "b": "여러 단어를 이어 쓸 때 첫 단어는 소문자로 시작하고, 뒤 단어들의 첫 글자만 대문자로 쓰는 방식.\n예: `userName`", "s": false}, {"k": "T", "a": "파스칼 표기법 (Pascal Case)", "b": "여러 단어를 붙여 쓸 때 첫 단어를 포함한 모든 단어의 첫 글자를 대문자로 쓰는 방식.\n예: `UserName` (주로 클래스 이름)", "s": false}, {"k": "T", "a": "스네이크 표기법 (Snake Case)", "b": "단어와 단어 사이를 밑줄(_)로 잇고 보통 소문자로만 쓰는 방식.\n예: `user_name`", "s": false}]}, {"ch": "2. 소프트웨어 설계 · 객체지향 · UML", "t": "기타", "star": false, "abbr": "", "items": [{"k": "T", "a": "생성자 (Constructor)", "b": "객체가 만들어질 때 자동으로 호출되어 멤버 변수를 초기화하는 특수한 메서드.\n클래스와 이름이 같고 반환형이 없다", "s": false}, {"k": "T", "a": "미들웨어 (Middleware)", "b": "운영체제와 응용 프로그램 사이, 또는 서로 다른 시스템 사이에서 통신과 데이터 교환을 중개하는 소프트웨어.\n예: RPC, MOM, ORB, TP-Monitor, WAS", "s": false}, {"k": "T", "a": "플랫폼 (Platform)", "b": "여러 응용 서비스가 그 위에서 개발·실행될 수 있도록 공통 기반 환경을 제공하는 것.\n공급자와 사용자를 이어 가치를 만드는 생태계라는 뜻으로도 쓴다", "s": false}]}, {"ch": "3. 화면 설계", "t": "UI·UX", "star": false, "abbr": "", "items": [{"k": "T", "a": "UI (User Interface)", "b": "사용자와 시스템이 정보를 주고받도록 이어 주는 화면·버튼·메뉴 같은 접점 요소. 눈에 보이는 상호작용 수단에 초점을 둔다.", "s": false}, {"k": "T", "a": "UX (User Experience)", "b": "사용자가 시스템을 이용하면서 느끼고 생각하는 총체적인 경험. 만족도·감성·편의성 같은 주관적 인상까지 포함한다.", "s": false}]}, {"ch": "3. 화면 설계", "t": "UI 유형", "star": true, "abbr": "", "items": [{"k": "T", "a": "CLI (Command Line Interface)", "b": "사용자가 키보드로 명령어 문자열을 입력해 시스템을 조작하는 텍스트 기반 방식.\n예: 터미널, 셸", "s": false}, {"k": "T", "a": "GUI (Graphical User Interface)", "b": "아이콘·창·메뉴 같은 그래픽 요소를 마우스 등 포인팅 장치로 선택해 조작하는 방식.", "s": false}, {"k": "T", "a": "NUI (Natural User Interface)", "b": "별도의 입력 장치 없이 말, 손짓, 터치처럼 사람의 자연스러운 행동으로 기기를 조작하는 방식.", "s": false}, {"k": "T", "a": "OUI (Organic User Interface)", "b": "모든 사물과 표면이 입출력 장치가 될 수 있다는 개념으로, 형태가 바뀌는 디스플레이처럼 사물 자체가 사용자와 상호작용하는 방식.", "s": false}]}, {"ch": "3. 화면 설계", "t": "UI 설계 원칙", "star": true, "abbr": "직유학유", "items": [{"k": "T", "a": "직관성 (Intuitiveness)", "b": "사용자가 따로 배우거나 설명을 듣지 않아도 쉽게 이해하고 바로 사용할 수 있어야 한다는 원칙.", "s": false}, {"k": "T", "a": "유효성 (Effectiveness)", "b": "사용자가 달성하려는 목적을 정확하고 완전하게 이룰 수 있도록 설계해야 한다는 원칙.", "s": false}, {"k": "T", "a": "학습성 (Learnability)", "b": "초보자와 숙련자 모두 사용법을 쉽게 배우고 오래 기억할 수 있어야 한다는 원칙.", "s": false}, {"k": "T", "a": "유연성 (Flexibility)", "b": "사용자의 다양한 요구를 최대한 받아들이고 실수를 막거나 쉽게 되돌릴 수 있어야 한다는 원칙.", "s": false}]}, {"ch": "3. 화면 설계", "t": "UI 설계 도구", "star": true, "abbr": "", "items": [{"k": "T", "a": "와이어프레임 (Wireframe)", "b": "화면에 들어갈 요소의 대략적인 위치와 배치를 선과 상자로 간단히 그린 설계도. 색과 디자인은 생략한다.", "s": false}, {"k": "T", "a": "목업 (Mockup)", "b": "실제 화면과 거의 같은 수준으로 시각적 디자인까지 정적으로 구현한 모형. 실제로 동작하는 기능은 없다.", "s": false}, {"k": "T", "a": "스토리보드 (Storyboard)", "b": "화면 설계안에 정책·프로세스·콘텐츠 구성·기능 설명 등을 함께 정리한 문서로, 디자이너와 개발자가 최종적으로 참고하는 산출물.", "s": false}, {"k": "T", "a": "프로토타입 (Prototype)", "b": "화면 설계에 클릭·화면 전환 같은 실제와 비슷한 상호작용을 넣어 동작을 직접 확인할 수 있게 만든 동적 견본.\n종류: 페이퍼, 디지털", "s": false}, {"k": "T", "a": "유스케이스 (Use Case)", "b": "사용자 관점에서 시스템이 제공해야 할 기능을 사용자와 시스템 사이의 상호작용 시나리오로 표현한 것. 액터와 기능의 관계를 다이어그램으로 나타낸다.", "s": false}]}, {"ch": "3. 화면 설계", "t": "UI 시나리오 문서 작성 요건", "star": false, "abbr": "완일이가추수", "items": [{"k": "T", "a": "완전성 (Complete)", "b": "사용자의 모든 작업 흐름과 시스템 기능을 하나도 빠뜨리지 않고 기술해야 한다는 요건.", "s": false}, {"k": "T", "a": "일관성 (Consistent)", "b": "서비스 목표, 시스템·사용자 요구사항, 용어와 표현이 문서 전체에서 서로 어긋나지 않아야 한다는 요건.", "s": false}, {"k": "T", "a": "이해성 (Understandable)", "b": "처음 읽는 사람도 쉽게 이해할 수 있도록 모호하거나 추상적인 표현을 피해야 한다는 요건.", "s": false}, {"k": "T", "a": "가독성 (Readable)", "b": "목차·문단·글꼴·여백·도식을 활용해 쉽게 읽히고 원하는 내용을 빨리 찾을 수 있도록 작성해야 한다는 요건.", "s": false}, {"k": "T", "a": "추적 용이성 (Traceable)", "b": "무엇이 언제, 어느 부분에서, 왜 바뀌었는지 변경 이력을 쉽게 따라가 확인할 수 있어야 한다는 요건.", "s": false}, {"k": "T", "a": "수정 용이성 (Modifiable)", "b": "내용을 바꿀 때 같은 내용을 여러 곳에서 고칠 필요가 없도록 구성해 변경이 쉬워야 한다는 요건.", "s": false}]}, {"ch": "4. 데이터베이스", "t": "데이터베이스와 관리 주체", "star": false, "abbr": "", "items": [{"k": "T", "a": "데이터베이스 (Database)", "b": "한 조직의 여러 업무에 필요한 데이터를 중복을 줄여 한곳에 모아 두고, 여러 사용자와 응용 프로그램이 함께 쓰도록 관리하는 데이터의 집합", "s": false}, {"k": "T", "a": "DBMS (Database Management System)", "b": "사용자와 데이터 사이에서 데이터의 정의·조작·제어 기능을 제공해 종속성과 중복성 문제를 해결하는 관리 소프트웨어\n필수 기능 3가지: 정의·조작·제어", "s": false}, {"k": "T", "a": "DBA (Database Administrator)", "b": "시스템 전체에 책임을 지고 스키마 정의, 접근 권한 부여, 백업·회복, 성능 감시 등을 맡는 사람 또는 조직", "s": false}, {"k": "T", "a": "시스템 카탈로그 (System Catalog)", "b": "테이블·뷰·인덱스·사용자·권한 등 시스템 안의 모든 객체 정보를 시스템이 스스로 만들고 유지하는 테이블 모음. 사용자는 조회만 할 수 있다\n데이터 사전(Data Dictionary)이라고도 한다", "s": false}, {"k": "T", "a": "메타 데이터 (Metadata)", "b": "데이터의 구조·형식·의미·제약처럼 데이터 자체를 설명해 주는 데이터. 카탈로그에 저장된다", "s": false}]}, {"ch": "4. 데이터베이스", "t": "데이터베이스의 정의 4요소", "star": false, "abbr": "공저통운", "items": [{"k": "T", "a": "공유 데이터 (Shared Data)", "b": "여러 응용 프로그램과 사용자가 동시에 함께 꺼내 쓸 수 있도록 제공되는 데이터", "s": false}, {"k": "T", "a": "저장 데이터 (Stored Data)", "b": "디스크처럼 컴퓨터가 직접 접근할 수 있는 저장 매체에 기록되어 있어 필요할 때 읽고 쓸 수 있는 데이터", "s": false}, {"k": "T", "a": "통합 데이터 (Integrated Data)", "b": "흩어진 데이터를 하나로 모으고 중복을 최소화해 관리하는 데이터. 꼭 필요한 통제된 중복만 허용한다", "s": false}, {"k": "T", "a": "운영 데이터 (Operational Data)", "b": "조직이 고유한 업무를 수행하는 데 반드시 필요해서 존재 가치가 분명한 데이터", "s": false}]}, {"ch": "4. 데이터베이스", "t": "스키마", "star": false, "abbr": "", "items": [{"k": "T", "a": "스키마 (Schema)", "b": "데이터의 구조, 데이터 간 관계, 제약 조건을 기술한 명세. 데이터 사전에 저장되며 시간에 따라 잘 바뀌지 않는다\n특정 시점의 실제 값 모음은 인스턴스", "s": false}]}, {"ch": "4. 데이터베이스", "t": "3계층 스키마", "star": true, "abbr": "외개내", "items": [{"k": "T", "a": "외부 스키마 (External Schema)", "b": "개별 사용자나 응용 프로그램이 바라보는 데이터의 일부 논리 구조. 여러 개 존재할 수 있으며 서브 스키마·사용자 뷰라고도 한다", "s": false}, {"k": "T", "a": "개념 스키마 (Conceptual Schema)", "b": "조직 전체 관점에서 모든 데이터와 관계, 제약 조건, 접근 권한, 보안 정책을 정의한 논리 구조. 하나만 존재한다", "s": false}, {"k": "T", "a": "내부 스키마 (Internal Schema)", "b": "저장 장치 관점에서 레코드 형식, 필드 크기, 인덱스, 저장 순서 등 데이터가 실제로 저장되는 방식을 정의한 구조", "s": false}]}, {"ch": "4. 데이터베이스", "t": "데이터베이스 설계", "star": false, "abbr": "", "items": [{"k": "Q", "a": "데이터베이스 설계 순서", "b": "요구 조건 분석 → 개념적 설계 → 논리적 설계 → 물리적 설계 → 구현", "s": false}, {"k": "T", "a": "개념적 설계 (Conceptual Design)", "b": "현실 세계의 정보를 추상화해 특정 DBMS와 무관한 모델로 표현하는 단계. E-R 다이어그램 작성과 트랜잭션 모델링을 한다", "s": false}, {"k": "T", "a": "논리적 설계 (Logical Design)", "b": "앞 단계의 모델을 목표 DBMS가 지원하는 구조(예: 관계형 테이블)로 변환하는 단계. 정규화와 스키마 평가·정제, 트랜잭션 인터페이스 설계를 한다", "s": false}, {"k": "T", "a": "물리적 설계 (Physical Design)", "b": "테이블을 실제 저장 장치에 어떻게 둘지 정하는 단계. 레코드 형식, 인덱스 같은 접근 경로, 저장 공간 배치를 결정하고 반정규화를 검토한다", "s": false}]}, {"ch": "4. 데이터베이스", "t": "데이터 모델", "star": false, "abbr": "", "items": [{"k": "T", "a": "데이터 모델 (Data Model)", "b": "현실 세계의 정보를 컴퓨터가 다룰 수 있도록 단순화·추상화해 개념적으로 표현한 도구", "s": false}, {"k": "Q", "a": "데이터 모델의 구성 요소 3가지", "b": "구조(Structure), 연산(Operation), 제약 조건(Constraint)\n구조=정적 성질, 연산=실제 값을 처리하는 동적 성질, 제약 조건=저장 가능한 값에 대한 논리적 제한", "s": false}, {"k": "Q", "a": "데이터 모델에 표시해야 할 3요소", "b": "개체, 속성, 관계", "s": false}, {"k": "T", "a": "개체 (Entity)", "b": "현실 세계에서 독립적으로 존재하며 다른 것과 구별되는, 저장할 가치가 있는 대상. 하나 이상의 속성으로 이루어진다", "s": false}, {"k": "T", "a": "E-R 모델 (Entity-Relationship Model)", "b": "1976년 피터 첸(P. Chen)이 제안한 개념적 모델로, 현실 세계를 사물과 그들 사이의 연관으로 나타내고 다이어그램으로 시각화하는 방식", "s": false}, {"k": "Q", "a": "E-R 다이어그램에서 사각형", "b": "개체 타입", "s": false}, {"k": "Q", "a": "E-R 다이어그램에서 타원", "b": "속성", "s": false}, {"k": "Q", "a": "E-R 다이어그램에서 마름모", "b": "관계 타입", "s": false}, {"k": "Q", "a": "E-R 다이어그램에서 선(링크)", "b": "개체 타입과 속성, 개체 타입과 관계 타입을 연결", "s": false}, {"k": "Q", "a": "E-R 다이어그램에서 밑줄 그은 타원", "b": "기본키 속성", "s": false}]}, {"ch": "4. 데이터베이스", "t": "논리적 데이터 모델", "star": false, "abbr": "", "items": [{"k": "T", "a": "관계 데이터 모델 (Relational Data Model)", "b": "데이터를 행과 열로 된 2차원 테이블로 표현하고 테이블 사이의 관계를 공통 속성(키)으로 나타내는 모델. 1:1, 1:N, N:M을 모두 표현한다", "s": false}, {"k": "T", "a": "계층 데이터 모델 (Hierarchical Data Model)", "b": "데이터를 부모-자식의 트리 구조로 표현하는 모델. 1:N 관계만 허용하며 N:M은 직접 표현하지 못한다\n대표 DBMS: IMS", "s": false}, {"k": "T", "a": "네트워크 데이터 모델 (Network Data Model)", "b": "데이터를 그래프 구조로 표현하고 오너-멤버 관계로 연결하는 모델. CODASYL이 표준을 제안했다\n망 데이터 모델이라고도 하며 대표 DBMS는 IDS", "s": false}]}, {"ch": "4. 데이터베이스", "t": "데이터 모델 품질 기준", "star": false, "abbr": "정완준최일활", "items": [{"k": "T", "a": "정확성 (Accuracy)", "b": "모델이 표기법에 맞게 그려졌고 업무 요구사항과 업무 규칙을 틀림없이 담고 있는지를 보는 기준", "s": false}, {"k": "T", "a": "완전성 (Completeness)", "b": "필요한 개체·속성·관계와 요구사항이 빠짐없이 모델에 들어갔는지를 보는 기준", "s": false}, {"k": "T", "a": "준거성 (Compliance)", "b": "데이터 표준, 명명 규칙, 관련 법령 등 정해진 규칙을 지켜 작성했는지를 보는 기준", "s": false}, {"k": "T", "a": "최신성 (Up-to-date)", "b": "모델이 현재 운영 중인 시스템의 최근 상태와 새로 생긴 변경 사항을 바로 반영하고 있는지를 보는 기준", "s": false}, {"k": "T", "a": "일관성 (Consistency)", "b": "여러 업무에서 함께 쓰는 데이터를 한 번만 정의하고 모든 곳이 그 정의를 똑같이 참조하는지를 보는 기준", "s": false}, {"k": "T", "a": "활용성 (Usability)", "b": "모델과 그 설명이 사용자가 충분히 이해할 수 있고, 업무가 바뀌어도 크게 손대지 않고 쓸 수 있는지를 보는 기준", "s": false}]}, {"ch": "4. 데이터베이스", "t": "릴레이션 구조", "star": false, "abbr": "", "items": [{"k": "T", "a": "튜플 (Tuple)", "b": "테이블의 한 행에 해당하며 서로 관련된 속성 값들의 모임. 파일 구조의 레코드에 대응한다", "s": false}, {"k": "T", "a": "속성 (Attribute)", "b": "테이블의 한 열에 해당하며 개체의 특성을 나타내는 가장 작은 논리적 단위. 파일 구조의 필드에 대응한다\n애트리뷰트", "s": false}, {"k": "T", "a": "도메인 (Domain)", "b": "한 속성이 가질 수 있는, 같은 타입의 원자값 전체 집합. 그 속성에 들어갈 수 있는 값의 범위를 정한다\n예: 성별 → {남, 여}", "s": false}, {"k": "T", "a": "카디널리티 (Cardinality)", "b": "한 테이블에 들어 있는 행(튜플)의 수. 행이 추가·삭제될 때마다 바뀐다\n기수라고도 한다", "s": false}, {"k": "T", "a": "차수 (Degree)", "b": "한 테이블을 구성하는 열(속성)의 수. 테이블 구조를 바꾸지 않는 한 고정된다\n디그리", "s": false}]}, {"ch": "4. 데이터베이스", "t": "키", "star": true, "abbr": "", "items": [{"k": "T", "a": "슈퍼키 (Super Key)", "b": "행을 하나로 짚어 낼 수 있는 속성 묶음이면 무엇이든 해당하는 키. 군더더기 속성이 섞여 있어도 되므로, 여기서 불필요한 속성을 덜어 내면 후보키가 된다", "s": false}, {"k": "T", "a": "후보키 (Candidate Key)", "b": "행을 유일하게 구별할 수 있는 속성 조합 가운데 유일성과 최소성을 모두 만족하는 것", "s": false}, {"k": "T", "a": "기본키 (Primary Key)", "b": "여러 후보키 중에서 대표 식별자로 고른 키. NULL과 중복 값을 가질 수 없다", "s": false}, {"k": "T", "a": "대체키 (Alternate Key)", "b": "후보키가 둘 이상일 때 기본키로 선택되지 않고 남은 나머지 후보키\n보조키라고도 한다", "s": false}, {"k": "T", "a": "외래키 (Foreign Key)", "b": "다른 테이블의 기본키를 참조하는 속성. 테이블 간 관계를 표현하며 값은 NULL이거나 참조 대상에 실제로 있는 값이어야 한다", "s": false}, {"k": "T", "a": "일반 속성 (Non-key Attribute)", "b": "어떤 후보키에도 포함되지 않는 속성. 정규화에서 키에 종속되는 쪽으로 다뤄진다", "s": false}]}, {"ch": "4. 데이터베이스", "t": "무결성", "star": false, "abbr": "", "items": [{"k": "T", "a": "무결성 (Integrity)", "b": "저장된 데이터 값이 그것이 나타내는 현실 세계의 실제 값과 일치하도록 정확성을 보장하는 성질", "s": false}, {"k": "T", "a": "개체 무결성 (Entity Integrity)", "b": "기본키를 구성하는 어떤 속성도 NULL이나 중복 값을 가질 수 없다는 제약", "s": false}, {"k": "T", "a": "참조 무결성 (Referential Integrity)", "b": "외래키 값은 NULL이거나 참조하는 테이블의 기본키 값 중 하나와 같아야 한다는 제약", "s": false}, {"k": "T", "a": "도메인 무결성 (Domain Integrity)", "b": "각 속성 값은 그 속성에 정해진 데이터 타입·허용 범위·형식 안에 있어야 한다는 제약", "s": false}, {"k": "T", "a": "고유 무결성 (Unique Integrity)", "b": "UNIQUE로 지정된 속성은 테이블 안에서 서로 다른 값을 가져야 한다는 제약", "s": false}]}, {"ch": "4. 데이터베이스", "t": "함수 종속", "star": false, "abbr": "", "items": [{"k": "T", "a": "함수 종속 (Functional Dependency)", "b": "속성 X의 각 값에 대해 속성 Y의 값이 항상 하나로 정해지는 관계. X를 결정자, Y를 종속자라 하고 X → Y로 쓴다", "s": false}, {"k": "T", "a": "부분 함수 종속 (Partial Functional Dependency)", "b": "기본키가 여러 속성으로 이루어졌을 때 어떤 속성이 기본키 전체가 아니라 그 일부에만 종속되는 관계. 2NF에서 제거한다", "s": false}, {"k": "T", "a": "이행적 함수 종속 (Transitive Functional Dependency)", "b": "A → B이고 B → C일 때 A → C가 성립하는 관계. 3NF에서 제거한다", "s": false}, {"k": "T", "a": "이상 현상 (Anomaly)", "b": "정규화되지 않은 테이블에서 데이터 중복 때문에 삽입·삭제·갱신할 때 예상하지 못한 문제가 생기는 현상", "s": false}]}, {"ch": "4. 데이터베이스", "t": "이상 현상의 종류", "star": false, "abbr": "삽삭갱", "items": [{"k": "T", "a": "삽입 이상 (Insertion Anomaly)", "b": "데이터를 넣을 때 원하지 않는 값까지 같이 넣어야 하거나, 일부 값이 없어 아예 넣을 수 없는 현상", "s": false}, {"k": "T", "a": "삭제 이상 (Deletion Anomaly)", "b": "한 행을 지울 때 남겨야 할 다른 정보까지 함께 사라지는 연쇄 손실 현상", "s": false}, {"k": "T", "a": "갱신 이상 (Update Anomaly)", "b": "중복 저장된 값 중 일부만 바뀌어 같은 사실이 서로 다른 값으로 남는 불일치 현상", "s": false}]}, {"ch": "4. 데이터베이스", "t": "정규화", "star": true, "abbr": "", "items": [{"k": "T", "a": "정규화 (Normalization)", "b": "테이블을 함수 종속에 따라 정보 손실 없이 분해해 중복을 줄이고 이상 현상을 없애는 과정", "s": false}, {"k": "T", "a": "제1정규형 (1NF)", "b": "모든 속성의 도메인이 더 쪼갤 수 없는 원자값으로만 이루어진 상태. 반복 그룹을 없앤다", "s": false}, {"k": "T", "a": "제2정규형 (2NF)", "b": "1NF를 만족하면서 키가 아닌 모든 속성이 기본키 전체에 완전 함수 종속인 상태. 부분 함수 종속을 없앤다", "s": false}, {"k": "T", "a": "제3정규형 (3NF)", "b": "2NF를 만족하면서 키가 아닌 속성들 사이의 이행적 함수 종속을 없앤 상태", "s": false}, {"k": "T", "a": "BCNF (Boyce-Codd Normal Form)", "b": "3NF를 만족하면서 모든 결정자가 후보키인 상태. 후보키가 아닌 결정자를 없앤다", "s": false}, {"k": "T", "a": "제4정규형 (4NF)", "b": "BCNF를 만족하면서 다치 종속(MVD, Multi-Valued Dependency)을 없앤 상태", "s": false}, {"k": "T", "a": "제5정규형 (5NF)", "b": "4NF를 만족하면서 모든 조인 종속이 후보키를 통해서만 성립하도록 조인 종속을 없앤 상태\nPJ/NF(Projection-Join Normal Form)라고도 한다", "s": false}, {"k": "Q", "a": "정규화 단계별 제거 대상", "b": "1NF 원자값 아닌 도메인 → 2NF 부분 함수 종속 → 3NF 이행적 함수 종속 → BCNF 후보키가 아닌 결정자 → 4NF 다치 종속 → 5NF 조인 종속", "s": false}]}, {"ch": "4. 데이터베이스", "t": "반정규화", "star": false, "abbr": "", "items": [{"k": "T", "a": "반정규화 (Denormalization)", "b": "정규화된 모델을 조회 성능과 개발 편의를 위해 일부러 통합·중복·분리하는 과정. 일관성과 무결성이 깨질 위험을 감수한다\n역정규화라고도 한다", "s": false}, {"k": "Q", "a": "반정규화 기법 4가지", "b": "테이블 통합, 테이블 분할, 중복 테이블 추가, 중복 속성 추가", "s": false}, {"k": "T", "a": "집계 테이블 (Aggregation Table)", "b": "합계·평균 같은 통계 값을 미리 계산해 담아 두고, 원본이 바뀔 때 트리거로 함께 갱신하는 추가 테이블\n통계 테이블이라고도 한다", "s": false}, {"k": "T", "a": "진행 테이블 (Progress Table)", "b": "다대다 관계인 두 테이블 사이의 진행 상태를 빠르게 조회하려고 두는 추가 테이블. 데이터 양과 사용 빈도를 따져 기본키를 정한다", "s": false}, {"k": "T", "a": "특정 부분만 포함하는 테이블", "b": "원본 테이블에서 자주 쓰는 일부 컬럼이나 행만 골라 따로 만든 추가 테이블", "s": false}, {"k": "T", "a": "중복 테이블 (Duplicated Table)", "b": "다른 서버나 업무의 테이블과 같은 구조·데이터를 복사해 두어 원격 조인이나 반복 접근을 줄이는 추가 테이블", "s": false}]}, {"ch": "4. 데이터베이스", "t": "관계 대수·해석", "star": true, "abbr": "", "items": [{"k": "T", "a": "관계 대수 (Relational Algebra)", "b": "원하는 결과를 얻으려면 어떤 연산을 어떤 순서로 수행할지를 명시하는 절차적 언어", "s": false}, {"k": "T", "a": "관계 해석 (Relational Calculus)", "b": "원하는 결과가 무엇인지만 정의하고 처리 순서는 명시하지 않는 비절차적 언어. 프레디킷 해석에 기반하며 튜플 해석과 도메인 해석이 있다\n코드(E. F. Codd)가 제안", "s": false}, {"k": "Q", "a": "SELECT 연산의 기호와 의미", "b": "σ (시그마) — 조건을 만족하는 행(튜플)만 골라내는 수평 연산", "s": false}, {"k": "Q", "a": "PROJECT 연산의 기호와 의미", "b": "π (파이) — 지정한 속성(열)만 뽑아내는 수직 연산", "s": false}, {"k": "Q", "a": "JOIN 연산의 기호와 의미", "b": "⋈ — 공통 속성을 기준으로 두 릴레이션을 하나로 합치는 연산", "s": false}, {"k": "Q", "a": "DIVISION 연산의 기호와 의미", "b": "÷ — R ÷ S: S의 모든 튜플과 관련된 R의 튜플을 S의 속성을 뺀 채 구하는 연산", "s": false}, {"k": "Q", "a": "합집합·교집합·차집합의 기호", "b": "∪ (합집합), ∩ (교집합), − (차집합)", "s": false}, {"k": "Q", "a": "카티션 프로덕트 기호와 결과 크기", "b": "× — 차수는 두 릴레이션 차수의 합, 카디널리티는 두 릴레이션 카디널리티의 곱", "s": false}]}, {"ch": "4. 데이터베이스", "t": "트랜잭션 상태", "star": false, "abbr": "", "items": [{"k": "T", "a": "트랜잭션 (Transaction)", "b": "데이터베이스 상태를 바꾸기 위해 한꺼번에 수행되어야 하는 일련의 연산 묶음. 병행 제어와 회복의 기본 단위다", "s": false}, {"k": "T", "a": "활동 (Active)", "b": "트랜잭션이 시작되어 연산을 정상적으로 실행하고 있는 상태", "s": false}, {"k": "T", "a": "부분 완료 (Partially Committed)", "b": "마지막 연산까지 실행을 마쳤지만 아직 Commit은 하지 않은 상태", "s": false}, {"k": "T", "a": "완료 (Committed)", "b": "실행을 성공적으로 끝내고 Commit 연산까지 수행한 상태", "s": false}, {"k": "T", "a": "실패 (Failed)", "b": "실행 중 오류가 발생해 더 이상 정상적으로 진행할 수 없게 된 상태", "s": false}, {"k": "T", "a": "철회 (Aborted)", "b": "실행에 실패해 Rollback을 수행하고 시작 전 상태로 되돌아간 상태", "s": false}]}, {"ch": "4. 데이터베이스", "t": "트랜잭션 특성 ACID", "star": true, "abbr": "원일격지", "items": [{"k": "T", "a": "원자성 (Atomicity)", "b": "연산 전체가 모두 반영되거나 하나도 반영되지 않아야 하는 성질(All or Nothing). Commit과 Rollback으로 보장한다", "s": false}, {"k": "T", "a": "일관성 (Consistency)", "b": "실행을 성공적으로 마치면 무결성 제약 등 정해진 규칙을 계속 만족해 모순 없는 상태가 유지되어야 하는 성질", "s": false}, {"k": "T", "a": "격리성 (Isolation)", "b": "둘 이상이 동시에 실행될 때 한쪽이 끝나기 전에는 다른 쪽이 그 중간 결과를 보거나 끼어들 수 없어야 하는 성질", "s": false}, {"k": "T", "a": "지속성 (Durability)", "b": "성공적으로 완료된 결과는 이후 시스템 장애가 나더라도 영구히 보존되어야 하는 성질", "s": false}]}, {"ch": "4. 데이터베이스", "t": "병행 제어", "star": false, "abbr": "", "items": [{"k": "T", "a": "병행 제어 (Concurrency Control)", "b": "여러 트랜잭션이 동시에 실행될 때 데이터의 일관성이 깨지지 않도록 실행 순서와 접근을 조정하는 기법", "s": false}]}, {"ch": "4. 데이터베이스", "t": "병행 제어를 하지 않을 때의 문제", "star": false, "abbr": "갱현모연", "items": [{"k": "T", "a": "갱신 손실 (Lost Update)", "b": "두 트랜잭션이 같은 데이터를 동시에 고칠 때 한쪽의 수정 결과가 다른 쪽에 덮어써져 사라지는 문제", "s": false}, {"k": "T", "a": "현황 파악 오류 (Dirty Read)", "b": "다른 트랜잭션이 아직 확정하지 않은 중간 결과를 읽어 잘못된 값을 참조하는 문제", "s": false}, {"k": "T", "a": "모순성 (Inconsistency)", "b": "한 트랜잭션이 여러 값을 읽는 사이 다른 트랜잭션이 그 값들을 바꿔, 서로 맞지 않는 값들로 처리하게 되는 문제", "s": false}, {"k": "T", "a": "연쇄 복귀 (Cascading Rollback)", "b": "트랜잭션 하나가 철회될 때 그 결과를 이미 읽어 간 다른 트랜잭션까지 줄줄이 함께 취소되어야 하는 문제", "s": false}]}, {"ch": "4. 데이터베이스", "t": "병행 제어 기법", "star": false, "abbr": "", "items": [{"k": "T", "a": "로킹 (Locking)", "b": "트랜잭션이 쓰려는 데이터의 접근 권한을 독점하고 다 쓴 뒤 풀어 주어 다른 트랜잭션의 동시 접근을 막는 기법", "s": false}, {"k": "Q", "a": "로킹 단위가 커지면 / 작아지면", "b": "커지면 로크 수가 줄어 관리가 쉽지만 병행성이 낮아진다\n작아지면 병행성은 높아지지만 관리 오버헤드가 커진다", "s": false}, {"k": "T", "a": "2단계 로킹 (Two-Phase Locking)", "b": "모든 트랜잭션이 로크 획득만 하는 확장 단계와 해제만 하는 축소 단계를 거치도록 해 직렬 가능성을 보장하는 규약. 교착 상태는 막지 못한다", "s": false}, {"k": "T", "a": "타임스탬프 순서 (Timestamp Ordering)", "b": "트랜잭션이 시작될 때 고유한 시각값을 부여하고, 그 값이 작은 쪽이 먼저 실행된 것처럼 접근 순서를 강제하는 기법. 교착 상태가 생기지 않는다", "s": false}, {"k": "T", "a": "낙관적 검증 (Optimistic Validation)", "b": "트랜잭션 수행 중에는 아무 검사도 하지 않다가 끝날 때 한 번에 충돌 여부를 확인해, 문제가 있으면 철회하는 기법", "s": false}]}, {"ch": "4. 데이터베이스", "t": "회복 기법", "star": false, "abbr": "", "items": [{"k": "Q", "a": "로그를 보고 완료된 트랜잭션의 변경을 다시 적용하는 회복 연산", "b": "Redo (재실행)", "s": false}, {"k": "Q", "a": "로그를 보고 완료되지 못한 트랜잭션의 변경을 취소하는 회복 연산", "b": "Undo (취소)", "s": false}, {"k": "T", "a": "즉시 갱신 (Immediate Update)", "b": "트랜잭션 수행 중 변경 내용을 Commit 전에도 곧바로 데이터베이스에 반영하는 회복 기법. 장애 시 로그로 Redo와 Undo를 모두 수행한다", "s": false}, {"k": "T", "a": "지연 갱신 (Deferred Update)", "b": "부분 완료될 때까지 변경 내용을 로그에만 적어 두었다가 완료 후 데이터베이스에 반영하는 회복 기법. 장애 시 Undo 없이 Redo만 한다", "s": false}, {"k": "T", "a": "검사점 회복 (Checkpoint Recovery)", "b": "일정 간격으로 그 시점의 상태를 로그에 표시해 두고, 장애가 나면 그 표시 이후 기록만 살펴 Redo·Undo 범위를 줄이는 회복 기법", "s": false}, {"k": "T", "a": "그림자 페이징 (Shadow Paging)", "b": "트랜잭션 시작 시 페이지 테이블 사본을 따로 보관하고 변경은 새 페이지에 기록하다가, 장애가 나면 보관한 사본으로 되돌리는 회복 기법. 로그가 필요 없다", "s": false}]}, {"ch": "4. 데이터베이스", "t": "인덱스·뷰", "star": false, "abbr": "", "items": [{"k": "T", "a": "인덱스 (Index)", "b": "키 값과 그 행이 저장된 위치를 쌍으로 보관해 검색 속도를 높이는 자료 구조. 주로 B-트리로 구현하며 잦은 삽입·삭제에는 부담이 된다", "s": false}, {"k": "T", "a": "클러스터드 인덱스 (Clustered Index)", "b": "테이블의 행 자체가 키 순서대로 물리적으로 정렬되어 저장되는 방식. 테이블당 하나만 만들 수 있고 범위 검색에 유리하다", "s": false}, {"k": "T", "a": "넌클러스터드 인덱스 (Non-Clustered Index)", "b": "행의 물리적 순서는 그대로 두고 키와 행 위치(포인터)만 별도 구조에 정렬해 두는 방식. 테이블당 여러 개 만들 수 있다", "s": false}, {"k": "T", "a": "뷰 (View)", "b": "하나 이상의 기본 테이블에서 유도한 이름 있는 가상 테이블. 물리적으로 저장되지 않으며 정의를 ALTER로 바꿀 수 없어 삭제 후 다시 만든다", "s": false}, {"k": "T", "a": "옵티마이저 (Optimizer)", "b": "SQL 문을 가장 효율적으로 처리할 실행 계획을 찾아 주는 DBMS 내부 엔진. 규칙 기반(RBO)과 비용 기반(CBO)이 있다", "s": false}, {"k": "Q", "a": "SQL 처리 흐름 3단계", "b": "구문 분석(Parse) → 실행(Execute) → 인출(Fetch)", "s": false}]}, {"ch": "4. 데이터베이스", "t": "분산 데이터베이스", "star": false, "abbr": "", "items": [{"k": "T", "a": "분산 데이터베이스 (Distributed Database)", "b": "논리적으로는 하나의 시스템이지만 데이터가 네트워크로 연결된 여러 사이트에 물리적으로 흩어져 저장·관리되는 구조", "s": false}]}, {"ch": "4. 데이터베이스", "t": "분산 데이터베이스의 투명성", "star": false, "abbr": "위분중병장", "items": [{"k": "T", "a": "위치 투명성 (Location Transparency)", "b": "데이터가 실제로 어느 사이트에 있는지 몰라도 논리적인 이름만으로 접근할 수 있는 성질", "s": false}, {"k": "T", "a": "분할 투명성 (Fragmentation Transparency)", "b": "하나의 논리적 테이블이 여러 조각으로 나뉘어 여러 곳에 저장되어 있어도 사용자는 그 사실을 의식하지 않는 성질", "s": false}, {"k": "T", "a": "중복 투명성 (Replication Transparency)", "b": "같은 데이터가 여러 사이트에 복제되어 있어도 사용자는 하나만 있는 것처럼 쓸 수 있는 성질", "s": false}, {"k": "T", "a": "병행 투명성 (Concurrency Transparency)", "b": "여러 트랜잭션이 동시에 실행되어도 그 결과가 서로 영향받지 않고 일관되게 유지되는 성질", "s": false}, {"k": "T", "a": "장애 투명성 (Failure Transparency)", "b": "일부 사이트나 통신망에 고장이 나도 트랜잭션을 정확하게 처리해 내는 성질", "s": false}]}, {"ch": "4. 데이터베이스", "t": "이중화", "star": false, "abbr": "", "items": [{"k": "T", "a": "데이터베이스 이중화 (Database Replication)", "b": "장애에 대비해 같은 데이터를 둘 이상의 데이터베이스에 복제해 두고, 한쪽의 변경을 다른 쪽에도 반영해 함께 유지하는 기법", "s": false}, {"k": "T", "a": "Eager 기법", "b": "한쪽에서 데이터가 바뀌면 트랜잭션 수행 도중 곧바로 모든 복제본에 반영하는 이중화 방식", "s": false}, {"k": "T", "a": "Lazy 기법", "b": "트랜잭션이 끝난 뒤 별도의 새 트랜잭션을 만들어 변경 내용을 다른 복제본에 전달하는 이중화 방식. 잠시 불일치가 생길 수 있다", "s": false}]}, {"ch": "4. 데이터베이스", "t": "파티셔닝", "star": false, "abbr": "", "items": [{"k": "T", "a": "파티셔닝 (Partitioning)", "b": "큰 테이블이나 인덱스를 관리하기 쉬운 작은 단위로 나누어 저장해 성능과 가용성을 높이는 기법", "s": false}, {"k": "Q", "a": "파티셔닝 종류", "b": "범위(Range), 해시(Hash), 목록(List), 조합(Composite)", "s": false}, {"k": "T", "a": "수평 분할 (Horizontal Partitioning)", "b": "같은 컬럼 구조를 유지한 채 행 단위로 테이블을 여러 조각으로 나누는 방식\n예: 지역별로 고객 행을 서로 다른 파티션에 저장", "s": false}, {"k": "T", "a": "수직 분할 (Vertical Partitioning)", "b": "열 단위로 테이블을 나누는 방식. 자주 쓰는 컬럼과 드물게 쓰는 컬럼을 따로 저장한다", "s": false}]}, {"ch": "4. 데이터베이스", "t": "튜닝", "star": false, "abbr": "", "items": [{"k": "T", "a": "튜닝 (Tuning)", "b": "SQL 문, 인덱스, 메모리·디스크 설정 등을 조정해 처리 속도를 높이고 자원을 효율적으로 쓰도록 개선하는 활동", "s": false}]}, {"ch": "5. SQL 응용", "t": "SQL 분류", "star": false, "abbr": "", "items": [{"k": "T", "a": "SQL (Structured Query Language)", "b": "데이터를 정의·조작·제어하는 관계형 DBMS의 표준 언어. 비절차적이며 관계 대수와 관계 해석을 바탕으로 한다", "s": false}, {"k": "T", "a": "DDL (Data Definition Language)", "b": "테이블·뷰·인덱스 같은 객체의 구조를 만들고 바꾸고 없애는 언어\nCREATE, ALTER, DROP, TRUNCATE", "s": false}, {"k": "T", "a": "DML (Data Manipulation Language)", "b": "사용자가 테이블에 저장된 실제 데이터를 조회·삽입·수정·삭제하며 다루는 언어\nSELECT, INSERT, UPDATE, DELETE", "s": false}, {"k": "T", "a": "DCL (Data Control Language)", "b": "사용자 권한 부여·회수를 통해 데이터의 보안·무결성·회복·병행 수행을 관리하는 언어\nGRANT, REVOKE (COMMIT·ROLLBACK을 포함하기도 한다)", "s": false}, {"k": "T", "a": "TCL (Transaction Control Language)", "b": "하나의 논리적 작업 단위가 끝났을 때 그 결과를 확정하거나 이전 상태로 되돌리는 언어\nCOMMIT, ROLLBACK, SAVEPOINT", "s": false}]}, {"ch": "5. SQL 응용", "t": "DDL 명령", "star": true, "abbr": "", "items": [{"k": "Q", "a": "테이블 생성", "b": "`CREATE TABLE 학생 (학번 CHAR(8) PRIMARY KEY, 이름 VARCHAR(20) NOT NULL);`", "s": false}, {"k": "Q", "a": "인덱스 생성", "b": "`CREATE UNIQUE INDEX idx_이름 ON 학생 (이름 ASC);`\nUNIQUE는 선택", "s": false}, {"k": "Q", "a": "뷰 생성", "b": "`CREATE VIEW 우수학생 AS SELECT 학번, 이름 FROM 학생 WHERE 점수 >= 90;`", "s": false}, {"k": "Q", "a": "컬럼 추가", "b": "`ALTER TABLE 학생 ADD 전화번호 VARCHAR(15);`", "s": false}, {"k": "Q", "a": "컬럼 변경", "b": "`ALTER TABLE 학생 MODIFY 이름 VARCHAR(30);`\nDBMS에 따라 `ALTER COLUMN`을 쓴다", "s": false}, {"k": "Q", "a": "컬럼 삭제", "b": "`ALTER TABLE 학생 DROP COLUMN 전화번호;`", "s": false}, {"k": "Q", "a": "테이블 삭제", "b": "`DROP TABLE 학생 CASCADE;`\n참조 중이면 거부하려면 `RESTRICT`", "s": false}, {"k": "Q", "a": "인덱스 삭제", "b": "`DROP INDEX idx_이름;`", "s": false}, {"k": "Q", "a": "뷰 삭제", "b": "`DROP VIEW 우수학생;`", "s": false}, {"k": "Q", "a": "구조는 남기고 테이블의 모든 행 삭제", "b": "`TRUNCATE TABLE 학생;`", "s": false}, {"k": "T", "a": "CASCADE", "b": "제거하려는 개체를 참조하고 있는 다른 개체까지 연쇄적으로 함께 제거하는 옵션", "s": false}, {"k": "T", "a": "RESTRICT", "b": "제거하려는 개체를 다른 개체가 참조하고 있으면 제거 자체를 거부하는 옵션", "s": false}]}, {"ch": "5. SQL 응용", "t": "DML 명령", "star": true, "abbr": "", "items": [{"k": "Q", "a": "SELECT 문의 논리적 실행 순서", "b": "FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY", "s": false}, {"k": "Q", "a": "중복 제거 조회", "b": "`SELECT DISTINCT 학과 FROM 학생;`", "s": false}, {"k": "Q", "a": "범위 조건 (BETWEEN)", "b": "`SELECT * FROM 학생 WHERE 점수 BETWEEN 80 AND 90;`\n양 끝값 포함(80 이상 90 이하)", "s": false}, {"k": "Q", "a": "NULL 검사", "b": "`SELECT * FROM 학생 WHERE 전화번호 IS NULL;`\n반대는 `IS NOT NULL`, `= NULL`로는 비교할 수 없다", "s": false}, {"k": "Q", "a": "패턴 검색 (LIKE)", "b": "`SELECT * FROM 학생 WHERE 이름 LIKE '김%';`\n`%`는 0개 이상의 임의 문자, `_`는 정확히 한 글자", "s": false}, {"k": "Q", "a": "목록 중 하나와 일치 (IN)", "b": "`SELECT * FROM 학생 WHERE 학과 IN ('컴퓨터', '전자');`", "s": false}, {"k": "Q", "a": "하위 질의 결과 존재 여부 (EXISTS)", "b": "`SELECT * FROM 학생 S WHERE EXISTS (SELECT * FROM 수강 C WHERE C.학번 = S.학번);`\n하위 질의가 한 행이라도 돌려주면 참", "s": false}, {"k": "Q", "a": "그룹별 집계 (GROUP BY)", "b": "`SELECT 학과, AVG(점수) FROM 학생 GROUP BY 학과;`", "s": false}, {"k": "Q", "a": "그룹에 조건 걸기 (HAVING)", "b": "`SELECT 학과, COUNT(*) FROM 학생 GROUP BY 학과 HAVING COUNT(*) >= 3;`\nWHERE는 그룹화 전 행 조건, HAVING은 그룹화 후 그룹 조건", "s": false}, {"k": "Q", "a": "정렬 (ORDER BY)", "b": "`SELECT * FROM 학생 ORDER BY 점수 DESC, 이름 ASC;`\n생략 시 기본값은 ASC(오름차순)", "s": false}, {"k": "Q", "a": "INSERT 두 형태", "b": "`INSERT INTO 학생 (학번, 이름) VALUES ('1001', '홍길동');`\n다른 테이블 결과를 넣을 때: `INSERT INTO 우수학생 SELECT * FROM 학생 WHERE 점수 >= 90;`", "s": false}, {"k": "Q", "a": "UPDATE", "b": "`UPDATE 학생 SET 학년 = 학년 + 1 WHERE 학번 = '1001';`", "s": false}, {"k": "Q", "a": "DELETE", "b": "`DELETE FROM 학생 WHERE 학번 = '1001';`\nWHERE를 빼면 모든 행이 지워지고 테이블 구조는 남는다", "s": false}]}, {"ch": "5. SQL 응용", "t": "DCL·TCL 명령", "star": true, "abbr": "", "items": [{"k": "Q", "a": "학생 테이블의 SELECT·UPDATE 권한을 사용자1에게 부여", "b": "`GRANT SELECT, UPDATE ON 학생 TO 사용자1;`", "s": false}, {"k": "Q", "a": "받은 권한을 다른 사용자에게 다시 줄 수 있게 부여", "b": "`GRANT SELECT ON 학생 TO 사용자1 WITH GRANT OPTION;`", "s": false}, {"k": "Q", "a": "권한 회수 (연쇄 포함)", "b": "`REVOKE UPDATE ON 학생 FROM 사용자1 CASCADE;`\nCASCADE: 사용자1이 다른 사용자에게 다시 준 권한까지 함께 회수", "s": false}, {"k": "Q", "a": "권한은 남기고 다시 부여할 수 있는 권한만 회수", "b": "`REVOKE GRANT OPTION FOR UPDATE ON 학생 FROM 사용자1;`", "s": false}, {"k": "Q", "a": "작업 결과를 영구히 확정하는 명령", "b": "`COMMIT;`", "s": false}, {"k": "Q", "a": "확정되지 않은 작업을 취소하고 이전 상태로 되돌리는 명령", "b": "`ROLLBACK;`", "s": false}, {"k": "Q", "a": "되돌아갈 중간 지점을 지정하고 그 지점까지만 취소", "b": "`SAVEPOINT S1;` 후 `ROLLBACK TO S1;`", "s": false}]}, {"ch": "5. SQL 응용", "t": "집합 연산자", "star": false, "abbr": "", "items": [{"k": "T", "a": "UNION", "b": "두 SELECT 결과를 하나로 합치되 중복 행은 한 번만 남기는 연산자\n두 질의의 컬럼 수와 데이터 타입이 같아야 한다", "s": false}, {"k": "T", "a": "UNION ALL", "b": "두 SELECT 결과를 중복 행까지 하나도 빼지 않고 그대로 이어 붙이는 연산자", "s": false}, {"k": "T", "a": "INTERSECT", "b": "두 SELECT 결과에 공통으로 들어 있는 행만 돌려주는 연산자", "s": false}, {"k": "T", "a": "EXCEPT (MINUS)", "b": "첫 번째 SELECT 결과에서 두 번째 결과에 있는 행을 뺀 나머지만 돌려주는 연산자. 오라클에서는 다른 키워드를 쓴다", "s": false}]}, {"ch": "5. SQL 응용", "t": "조인", "star": false, "abbr": "", "items": [{"k": "T", "a": "내부 조인 (Inner Join)", "b": "두 테이블에서 결합 조건을 만족하는 행끼리만 짝지어 돌려주는 방식. 등호(=)로 비교하는 동등 결합이 대표적이다", "s": false}, {"k": "T", "a": "왼쪽 외부 조인 (Left Outer Join)", "b": "FROM 절에 먼저 쓴 테이블의 모든 행을 남기고, 짝이 없는 상대 테이블 쪽 컬럼은 NULL로 채워 결합하는 방식", "s": false}, {"k": "T", "a": "오른쪽 외부 조인 (Right Outer Join)", "b": "JOIN 뒤에 쓴 테이블의 모든 행을 남기고, 짝이 없는 앞 테이블 쪽 컬럼은 NULL로 채워 결합하는 방식", "s": false}, {"k": "T", "a": "완전 외부 조인 (Full Outer Join)", "b": "양쪽 테이블의 모든 행을 남기고 어느 쪽이든 짝이 없으면 상대 컬럼을 NULL로 채우는 방식", "s": false}, {"k": "T", "a": "자연 조인 (Natural Join)", "b": "두 테이블에서 이름이 같은 컬럼을 기준으로 동등 결합하고, 그 공통 컬럼은 결과에 한 번만 보여 주는 방식", "s": false}, {"k": "T", "a": "셀프 조인 (Self Join)", "b": "하나의 테이블에 별칭을 둘 붙여 자기 자신과 결합하는 방식\n예: 같은 사원 테이블에서 사원과 그 상사 찾기", "s": false}, {"k": "T", "a": "교차 조인 (Cross Join)", "b": "결합 조건 없이 두 테이블의 모든 행을 서로 짝지어 행 수의 곱만큼 결과를 만드는 방식. 카티션 프로덕트와 같다", "s": false}, {"k": "Q", "a": "왼쪽 외부 조인 문법", "b": "`SELECT * FROM 학생 S LEFT OUTER JOIN 수강 C ON S.학번 = C.학번;`", "s": false}]}, {"ch": "5. SQL 응용", "t": "절차형·프로그래밍 SQL", "star": false, "abbr": "", "items": [{"k": "T", "a": "절차형 SQL (Procedural SQL)", "b": "DBMS 안에서 변수·조건문·반복문 같은 프로그래밍 요소를 질의문과 함께 써서 일련의 작업을 처리하는 언어. DECLARE·BEGIN·END 블록으로 구성한다", "s": false}, {"k": "T", "a": "프로시저 (Procedure)", "b": "자주 쓰는 일련의 작업을 미리 만들어 DB에 두고 CALL이나 EXECUTE로 호출해 실행하는 절차형 객체. 반환값이 필수는 아니다", "s": false}, {"k": "T", "a": "사용자 정의 함수 (User-Defined Function)", "b": "절차형으로 작성하며 RETURN으로 반드시 단일 값을 돌려주는 객체. SELECT 같은 질의문 안에서 호출해 쓴다", "s": false}, {"k": "T", "a": "트리거 (Trigger)", "b": "특정 테이블에 데이터 변경 이벤트가 생기면 자동으로 실행되는 절차형 객체. 무결성 유지·로그 기록에 쓰며 안에서 COMMIT·ROLLBACK을 쓸 수 없다", "s": false}, {"k": "Q", "a": "트리거를 실행시키는 이벤트 종류", "b": "INSERT, UPDATE, DELETE\n실행 시점은 BEFORE 또는 AFTER, 행마다 실행하려면 FOR EACH ROW", "s": false}, {"k": "T", "a": "내장 SQL (Embedded SQL)", "b": "C·Java 같은 호스트 언어 프로그램 안에 질의문을 넣어 실행하는 방식. EXEC SQL로 시작하고 호스트 변수 앞에는 콜론(:)을 붙인다", "s": false}, {"k": "T", "a": "동적 SQL (Dynamic SQL)", "b": "실행 시점에 질의문을 문자열로 조립해 실행하는 방식. 상황마다 조건이 달라지는 질의에 유연하지만 매번 구문 분석이 필요하다", "s": false}]}, {"ch": "6. 통합 구현 · 인터페이스 구현", "t": "연계 데이터 형식", "star": false, "abbr": "", "items": [{"k": "T", "a": "XML (eXtensible Markup Language)", "b": "사용자가 태그를 직접 정의해 데이터를 트리 구조로 기술하는 확장형 마크업 언어. DTD나 스키마로 문서 구조를 검증할 수 있는 것", "s": false}, {"k": "T", "a": "JSON (JavaScript Object Notation)", "b": "이름과 값의 쌍, 배열로 데이터를 나타내는 가벼운 텍스트 형식. 자바스크립트 객체 문법에서 나왔지만 특정 언어에 묶이지 않는 것", "s": false}, {"k": "T", "a": "CSV (Comma-Separated Values)", "b": "한 행을 한 줄로 두고 필드를 쉼표로 나누어 표 형태 데이터를 담는 가장 단순한 텍스트 형식", "s": false}, {"k": "T", "a": "AJAX (Asynchronous JavaScript and XML)", "b": "페이지 전체를 새로 불러오지 않고 브라우저가 서버와 비동기로 데이터를 주고받아 화면 일부만 갱신하는 웹 기법", "s": false}, {"k": "T", "a": "REST (Representational State Transfer)", "b": "URI로 자원을 식별하고 HTTP 메서드로 그 자원에 대한 행위를 표현하는 무상태 기반 웹 아키텍처 스타일", "s": false}, {"k": "Q", "a": "REST에서 CRUD 연산과 짝을 이루는 HTTP 메서드는?", "b": "Create = POST, Read = GET, Update = PUT, Delete = DELETE", "s": false}]}, {"ch": "6. 통합 구현 · 인터페이스 구현", "t": "웹 서비스 구성 요소", "star": false, "abbr": "", "items": [{"k": "T", "a": "SOAP (Simple Object Access Protocol)", "b": "HTTP 같은 전송 프로토콜 위에서 Envelope·Header·Body로 이루어진 XML 메시지로 원격 서비스를 호출하는 통신 규약", "s": false}, {"k": "T", "a": "WSDL (Web Services Description Language)", "b": "서비스가 제공하는 기능, 주고받는 메시지 형식, 접근 위치와 프로토콜을 XML로 기술한 명세 언어", "s": false}, {"k": "T", "a": "UDDI (Universal Description, Discovery and Integration)", "b": "제공자가 서비스 정보를 등록하고 요청자가 원하는 서비스를 검색해 찾아 쓰게 하는 레지스트리(저장소) 규격", "s": false}]}, {"ch": "6. 통합 구현 · 인터페이스 구현", "t": "EAI 구축 유형", "star": true, "abbr": "", "items": [{"k": "T", "a": "EAI (Enterprise Application Integration)", "b": "기업 안의 이기종 응용 시스템들을 미들웨어로 엮어 데이터와 업무 프로세스를 함께 쓰게 하는 연계 솔루션", "s": false}, {"k": "T", "a": "Point-to-Point", "b": "미들웨어 없이 애플리케이션끼리 1:1로 직접 잇는 가장 단순한 유형. 시스템이 늘면 연결 수가 급증하고 재사용이 어려운 것", "s": false}, {"k": "T", "a": "Hub & Spoke", "b": "중앙 중계 시스템이 모든 시스템 간 데이터 전달을 맡는 집중형 유형. 관리·확장은 쉽지만 중앙이 단일 장애점이 되는 것", "s": false}, {"k": "T", "a": "Message Bus", "b": "애플리케이션 사이에 미들웨어 계층을 두고 그 위로 메시지를 흘려 보내는 유형. 확장성이 뛰어나 대용량 처리에 적합한 것", "s": false}, {"k": "T", "a": "Hybrid", "b": "그룹 내부는 중앙 집중형으로, 그룹 사이는 미들웨어 계층형으로 묶는 혼합 유형. 필요한 방식을 골라 적용해 병목을 줄이는 것", "s": false}]}, {"ch": "6. 통합 구현 · 인터페이스 구현", "t": "ESB", "star": false, "abbr": "", "items": [{"k": "T", "a": "ESB (Enterprise Service Bus)", "b": "애플리케이션이 아니라 서비스 단위로 연계하며, 표준 기반 통신 기반 위에서 메시지 변환·라우팅을 맡는 미들웨어. SOA 구현의 토대가 되는 것", "s": false}, {"k": "Q", "a": "EAI와 ESB의 차이는?", "b": "EAI는 기업 내부 애플리케이션 간 통합에 초점(상대적으로 강한 결합), ESB는 서비스 중심 통합에 초점(느슨한 결합, 표준 기반으로 SOA 지원)", "s": false}]}, {"ch": "6. 통합 구현 · 인터페이스 구현", "t": "연계 기술", "star": true, "abbr": "", "items": [{"k": "N", "a": "직접 연계: 중간 매개체 없이 시스템끼리 바로 연결 / 간접 연계: 연계 솔루션(EAI·ESB)이나 소켓을 거쳐 연결"}, {"k": "T", "a": "DB Link", "b": "원격 데이터베이스를 가리키는 객체를 만들어 두고 `테이블명@객체명` 형식으로 원격 테이블을 직접 조회하는 직접 연계 방식", "s": false}, {"k": "T", "a": "DB Connection (Pool)", "b": "애플리케이션 서버(WAS)가 데이터베이스 접속 객체를 미리 여러 개 만들어 두고 꺼내 쓰고 반납하는 직접 연계 방식. 접속 생성 비용을 줄이는 것", "s": false}, {"k": "T", "a": "API (Application Programming Interface) / Open API", "b": "다른 시스템의 데이터나 기능을 정해진 호출 규약대로 프로그램에서 쓰게 하는 인터페이스. 누구나 쓰도록 공개한 형태도 있는 것", "s": false}, {"k": "T", "a": "JDBC (Java Database Connectivity)", "b": "자바 프로그램이 드라이버를 거쳐 여러 관계형 DB에 접속하고 SQL을 실행하게 해 주는 표준 인터페이스", "s": false}, {"k": "T", "a": "Hyper Link", "b": "웹 화면에 다른 시스템의 페이지 주소를 걸어 사용자가 클릭으로 바로 이동하게 하는 가장 단순한 직접 연계 방식", "s": false}, {"k": "T", "a": "연계 솔루션 (간접 연계)", "b": "송·수신 시스템 사이에 EAI·ESB 같은 중계 솔루션을 두어 데이터 변환과 라우팅을 맡기는 방식. 이기종 연계에 유리하나 구성이 복잡한 것", "s": false}, {"k": "T", "a": "소켓 (Socket, 간접 연계)", "b": "통신용 포트를 열어 두고 송·수신 측이 연결을 맺어 데이터를 주고받게 하는 간접 연계 수단. 서버-클라이언트 통신의 기본이 되는 것", "s": false}]}, {"ch": "6. 통합 구현 · 인터페이스 구현", "t": "DB 접근 기술", "star": false, "abbr": "", "items": [{"k": "T", "a": "ODBC (Open Database Connectivity)", "b": "마이크로소프트가 정한 표준 규격으로, 응용 프로그램이 DBMS 종류와 상관없이 같은 방법으로 데이터베이스에 접근하게 하는 인터페이스", "s": false}, {"k": "T", "a": "ORM (Object-Relational Mapping)", "b": "프로그램의 클래스(객체)와 관계형 DB의 테이블을 자동으로 대응시켜 SQL을 직접 쓰지 않고 객체로 데이터를 다루게 하는 기법\n예: JPA/Hibernate, SQLAlchemy", "s": false}, {"k": "N", "a": "JDBC는 위 「연계 기술」 그룹 참고"}]}, {"ch": "6. 통합 구현 · 인터페이스 구현", "t": "인터페이스 구현 검증 도구", "star": true, "abbr": "", "items": [{"k": "T", "a": "xUnit", "b": "JUnit·NUnit·CppUnit처럼 언어마다 만들어진, 같은 구조의 단위 테스트 프레임워크들을 한데 묶어 부르는 이름", "s": false}, {"k": "T", "a": "JUnit", "b": "자바 언어 전용 단위 테스트 프레임워크로, 테스트용 애노테이션을 붙인 메서드를 자동 실행하고 기대값과 실제값을 단언문(assert)으로 비교한다", "s": false}, {"k": "T", "a": "STAF (Software Testing Automation Framework)", "b": "여러 플랫폼과 분산 환경을 지원하는 테스트 자동화 프레임워크. 테스트 대상마다 데몬을 띄워 원격으로 테스트를 실행하고 결과를 모으는 것", "s": false}, {"k": "T", "a": "FitNesse", "b": "웹 기반 위키 페이지에 입력값과 기대 결과를 표로 적으면 그대로 실행되는 테스트 프레임워크. 비개발자도 테스트 케이스를 쓸 수 있는 것", "s": false}, {"k": "T", "a": "NTAF (Naver Test Automation Framework)", "b": "NHN이 만든 테스트 자동화 프레임워크로, STAF의 재사용·확장성과 FitNesse의 협업 기능을 합친 것", "s": false}, {"k": "T", "a": "Selenium", "b": "브라우저를 코드로 자동 조작해 웹 화면의 동작을 검증하는 오픈소스 도구. 크롬·파이어폭스 등 여러 브라우저와 Java·Python 등 여러 언어로 쓸 수 있다", "s": false}, {"k": "T", "a": "Watir (Web Application Testing in Ruby)", "b": "루비로 테스트 스크립트를 작성해 실제 웹 브라우저를 자동 조작하는 웹 애플리케이션 테스트 도구", "s": false}]}, {"ch": "6. 통합 구현 · 인터페이스 구현", "t": "데이터베이스 암호화 방식", "star": false, "abbr": "", "items": [{"k": "N", "a": "SSL/TLS·IPSec·S-HTTP 등 인터페이스 보안 프로토콜은 보안 과목에서 다룬다"}, {"k": "T", "a": "API 방식", "b": "애플리케이션 단에서 암·복호화 라이브러리를 호출해 처리하는 방식. DB 서버 부하는 없지만 애플리케이션 코드를 고쳐야 하는 것", "s": false}, {"k": "T", "a": "Plug-in 방식", "b": "DB 서버에 암·복호화 모듈을 설치하고 DB 함수(뷰·트리거 등)로 처리하는 방식. 애플리케이션 수정은 적지만 DB 서버에 부하가 걸리는 것", "s": false}, {"k": "T", "a": "TDE (Transparent Data Encryption) 방식", "b": "DBMS 커널 수준에서 저장할 때 암호화하고 읽을 때 복호화해 애플리케이션이 알아채지 못하게 하는 방식. 코드 수정이 거의 없는 것", "s": false}, {"k": "T", "a": "Hybrid 방식", "b": "애플리케이션 측 처리와 DB 서버 측 모듈 처리를 결합해 각각의 장점을 취하고 부하를 나누는 방식", "s": false}]}, {"ch": "7. 애플리케이션 테스트 관리", "t": "테스트 원리 (7원칙)", "star": true, "abbr": "", "items": [{"k": "T", "a": "결함 존재 증명", "b": "테스트로 오류가 숨어 있다는 사실은 보일 수 있지만, 오류가 하나도 없다는 것은 보일 수 없다는 원리.", "s": false}, {"k": "T", "a": "완벽한 테스트 불가능 (Exhaustive Testing is Impossible)", "b": "입력·경로 조합이 너무 많아 모든 경우를 다 시험할 수 없으므로, 위험도와 우선순위로 범위를 정해야 한다는 원리.", "s": false}, {"k": "T", "a": "초기 집중 (Early Testing)", "b": "결함은 늦게 발견할수록 고치는 비용이 커지므로, 요구·설계 단계부터 시험 활동을 시작해야 한다는 원리.", "s": false}, {"k": "T", "a": "결함 집중 (Defect Clustering)", "b": "발견되는 오류의 대부분이 전체 중 소수의 특정 모듈에 몰려 나타난다는 원리.\n파레토 법칙(80:20)과 연결된다", "s": false}, {"k": "T", "a": "살충제 패러독스 (Pesticide Paradox)", "b": "같은 테스트 케이스를 계속 반복하면 더는 새 결함을 찾지 못하므로, 케이스를 주기적으로 검토·보강해야 한다는 원리.", "s": false}, {"k": "T", "a": "정황 의존성 (Testing is Context Dependent)", "b": "소프트웨어의 성격과 사용 환경에 따라 시험 방법과 강도를 달리해야 한다는 원리.", "s": false}, {"k": "T", "a": "오류-부재의 궤변 (Absence-of-Errors Fallacy)", "b": "결함을 다 고쳤더라도 사용자 요구를 만족하지 못하면 품질이 높다고 할 수 없다는 원리.", "s": false}]}, {"ch": "7. 애플리케이션 테스트 관리", "t": "테스트 레벨", "star": false, "abbr": "단통시인", "items": [{"k": "T", "a": "단위 테스트 (Unit Test)", "b": "구현된 개별 모듈·함수·클래스를 따로 떼어 제대로 동작하는지 검증하는 가장 낮은 수준의 시험.\n주로 화이트박스, 드라이버·스텁 사용", "s": false}, {"k": "T", "a": "통합 테스트 (Integration Test)", "b": "검증된 모듈들을 결합해 가며 모듈 사이의 인터페이스와 상호작용에 결함이 없는지 확인하는 시험.\n하향식(스텁)·상향식(드라이버)·빅뱅·샌드위치", "s": false}, {"k": "T", "a": "시스템 테스트 (System Test)", "b": "완성된 전체 제품이 기능·비기능 요구사항을 실제 운영과 비슷한 환경에서 만족하는지 확인하는 시험.", "s": false}, {"k": "T", "a": "인수 테스트 (Acceptance Test)", "b": "고객이나 최종 사용자가 요구한 대로 만들어졌는지 직접 확인해 납품을 받아들일지 결정하는 시험.", "s": false}]}, {"ch": "7. 애플리케이션 테스트 관리", "t": "인수 테스트 세부", "star": false, "abbr": "", "items": [{"k": "T", "a": "알파 테스트 (Alpha Test)", "b": "개발자의 장소에서 사용자가 시험하고, 개발자가 옆에서 지켜보며 문제를 기록하는 통제된 환경의 시험.", "s": false}, {"k": "T", "a": "베타 테스트 (Beta Test)", "b": "실제 사용 환경에서 개발자 없이 사용자가 직접 써 보고, 발견한 문제를 개발자에게 알려 주는 시험.", "s": false}]}, {"ch": "7. 애플리케이션 테스트 관리", "t": "V 모델", "star": false, "abbr": "", "items": [{"k": "T", "a": "V 모델 (V-Model)", "b": "폭포수 모형을 확장해 각 개발 단계마다 짝이 되는 테스트 단계를 대응시키고, 검증과 확인을 강조한 모형.", "s": false}, {"k": "Q", "a": "V 모델에서 요구사항 분석에 대응하는 테스트", "b": "인수 테스트", "s": false}, {"k": "Q", "a": "V 모델에서 분석·설계(시스템 설계)에 대응하는 테스트", "b": "시스템 테스트", "s": false}, {"k": "Q", "a": "V 모델에서 아키텍처·상세 설계에 대응하는 테스트", "b": "통합 테스트", "s": false}, {"k": "Q", "a": "V 모델에서 구현(코딩)에 대응하는 테스트", "b": "단위 테스트", "s": false}]}, {"ch": "7. 애플리케이션 테스트 관리", "t": "테스트 오라클", "star": false, "abbr": "", "items": [{"k": "T", "a": "테스트 오라클 (Test Oracle)", "b": "시험 결과가 맞는지 틀린지 판정하기 위해 기대 결과를 계산하거나 참조하는 기준이나 장치.", "s": false}, {"k": "T", "a": "참 오라클 (True Oracle)", "b": "모든 입력값에 대해 기대 결과를 제공해, 발생한 모든 오류를 찾아낼 수 있는 판정 기준.", "s": false}, {"k": "T", "a": "샘플링 오라클 (Sampling Oracle)", "b": "미리 골라 둔 몇몇 입력값에 대해서만 기대 결과를 제공하는 판정 기준.", "s": false}, {"k": "T", "a": "휴리스틱(추정) 오라클 (Heuristic Oracle)", "b": "일부 입력값에는 정확한 기대 결과를 주고, 나머지 입력값은 경험에 따른 짐작으로 판단하는 판정 기준.", "s": false}, {"k": "T", "a": "일관성 검사 오라클 (Consistent Oracle)", "b": "프로그램을 고치기 전과 후의 실행 결과가 같은지 비교해 판단하는 판정 기준.\n회귀 테스트에 주로 쓴다", "s": false}]}, {"ch": "7. 애플리케이션 테스트 관리", "t": "화이트박스 테스트", "star": true, "abbr": "", "items": [{"k": "T", "a": "화이트박스 테스트 (White-box Test)", "b": "모듈의 내부 소스 코드와 논리 구조를 들여다보며 경로·조건이 제대로 동작하는지 확인하는 기법.\n구조 기반 테스트", "s": false}, {"k": "T", "a": "기초 경로 검사 (Basis Path Testing)", "b": "맥케이브(McCabe)의 순환 복잡도로 독립 경로 수를 구하고, 그 경로를 모두 한 번 이상 실행해 보는 기법.\nV(G) = E − N + 2 (E: 간선 수, N: 노드 수)", "s": false}, {"k": "Q", "a": "순환 복잡도 V(G)를 구하는 다른 두 방법", "b": "닫힌 영역 수 + 1, 또는 조건 분기 수 + 1", "s": false}, {"k": "T", "a": "제어 구조 검사 (Control Structure Testing)", "b": "프로그램의 조건문·반복문·변수 사용 흐름을 중심으로 결함을 찾는 기법들의 묶음.\n조건·루프·데이터 흐름 검사", "s": false}, {"k": "T", "a": "조건 검사 (Condition Testing)", "b": "프로그램 안의 논리식들이 참과 거짓을 모두 갖도록 케이스를 만들어 논리식의 결함을 찾는 기법.", "s": false}, {"k": "T", "a": "루프 검사 (Loop Testing)", "b": "반복문을 0회·1회·여러 번 등으로 다양하게 돌려 반복 구조의 결함을 찾는 기법.", "s": false}, {"k": "T", "a": "데이터 흐름 검사 (Data Flow Testing)", "b": "변수가 정의되고 사용되는 위치를 따라가며 경로를 골라 시험하는 기법.", "s": false}]}, {"ch": "7. 애플리케이션 테스트 관리", "t": "블랙박스 테스트", "star": true, "abbr": "", "items": [{"k": "T", "a": "블랙박스 테스트 (Black-box Test)", "b": "내부 코드는 보지 않고 요구사항 명세를 기준으로 입력과 출력만 보며 기능을 확인하는 기법.\n명세 기반 테스트", "s": false}, {"k": "T", "a": "동등(동치) 분할 (Equivalence Partitioning)", "b": "입력 영역을 같은 결과가 나올 것으로 보는 유효·무효 그룹으로 나누고, 그룹마다 대표값으로 시험하는 기법.", "s": false}, {"k": "T", "a": "경계값 분석 (Boundary Value Analysis)", "b": "오류가 입력 범위의 끝에서 자주 생긴다는 점을 노려 범위의 끝값과 그 바로 안팎의 값을 시험하는 기법.", "s": false}, {"k": "T", "a": "원인-효과 그래프 (Cause-Effect Graph)", "b": "입력 조건과 출력 결과의 논리 관계를 그래프로 그린 뒤 결정 테이블로 바꿔 효용 높은 케이스를 고르는 기법.", "s": false}, {"k": "T", "a": "오류 예측 (Error Guessing)", "b": "과거 경험과 감각으로 결함이 숨어 있을 법한 곳을 짐작해 시험하는 기법.\n다른 기법이 놓친 부분을 보완한다", "s": false}, {"k": "T", "a": "비교 검사 (Comparison Testing)", "b": "같은 명세로 만든 여러 버전의 프로그램에 같은 입력을 넣고 결과를 견주어 보는 기법.", "s": false}, {"k": "T", "a": "결정 테이블 테스트 (Decision Table Testing)", "b": "입력 조건의 조합과 그에 따른 동작을 표로 정리하고, 각 조합을 케이스로 삼는 기법.", "s": false}, {"k": "T", "a": "상태 전이 테스트 (State Transition Testing)", "b": "이벤트에 따라 시스템이 어떤 모드에서 어떤 모드로 바뀌는지 모델링하고, 그 전환 경로를 시험하는 기법.", "s": false}, {"k": "T", "a": "페어와이즈 테스트 (Pairwise Testing)", "b": "모든 조합 대신, 어떤 두 변수를 골라도 그 값의 짝이 최소 한 번은 나오도록 케이스를 짜서 수를 줄이는 기법.", "s": false}]}, {"ch": "7. 애플리케이션 테스트 관리", "t": "테스트 기반 분류", "star": false, "abbr": "", "items": [{"k": "T", "a": "명세 기반 테스트 (Specification-based Test)", "b": "요구사항 문서에 적힌 기능을 빠짐없이 케이스로 옮겨 구현을 확인하는 시험.\n블랙박스 계열: 동등 분할, 경계값 분석 등", "s": false}, {"k": "T", "a": "구조 기반 테스트 (Structure-based Test)", "b": "소프트웨어 내부의 논리 흐름을 따라 케이스를 만들어 확인하는 시험.\n화이트박스 계열: 구문·결정·조건 커버리지 등", "s": false}, {"k": "T", "a": "경험 기반 테스트 (Experience-based Test)", "b": "테스터의 직관·지식·과거 이력에 기대어 케이스를 만드는 시험.\n예: 오류 예측, 탐색적 테스트, 체크리스트", "s": false}]}, {"ch": "7. 애플리케이션 테스트 관리", "t": "테스트 목적별 분류", "star": false, "abbr": "", "items": [{"k": "T", "a": "회복 테스트 (Recovery Test)", "b": "시스템에 일부러 장애를 일으킨 뒤 정상 상태로 제대로 돌아오는지 확인하는 시험.", "s": false}, {"k": "T", "a": "안전 테스트 (Security Test)", "b": "외부의 불법 침입으로부터 시스템을 지키는 보안 장치가 제대로 동작하는지 확인하는 시험.", "s": false}, {"k": "T", "a": "강도 테스트 (Stress Test)", "b": "과도한 요청량이나 자원 요구를 가해, 한계를 넘는 비정상 조건에서 시스템이 어떻게 버티고 무너지는지 확인하는 시험.", "s": false}, {"k": "T", "a": "성능 테스트 (Performance Test)", "b": "응답 시간·처리량·자원 사용률처럼 시스템이 얼마나 빠르고 효율적으로 일하는지를 측정하는 시험.", "s": false}, {"k": "T", "a": "구조 테스트 (Structure Test)", "b": "시스템 내부의 논리적 경로와 소스 코드의 복잡도를 평가하는 시험.", "s": false}, {"k": "T", "a": "회귀 테스트 (Regression Test)", "b": "변경이나 결함 수정 뒤, 그 변경이 기존 기능에 새 결함을 일으키지 않았는지 다시 확인하는 시험.", "s": false}, {"k": "T", "a": "병행 테스트 (Parallel Test)", "b": "변경된 시스템과 기존 시스템에 같은 데이터를 넣고 두 결과를 비교하는 시험.", "s": false}, {"k": "T", "a": "부하 테스트 (Load Test)", "b": "사용자 수나 요청량을 단계적으로 늘려 가며 시스템이 견딜 수 있는 최대 처리 한계를 찾는 시험.", "s": false}, {"k": "T", "a": "내구성 테스트 (Endurance Test)", "b": "오랜 시간 일정한 부하를 계속 걸어 메모리 누수처럼 장시간 운영에서만 드러나는 문제를 찾는 시험.\nSoak Test라고도 한다", "s": false}, {"k": "T", "a": "스파이크 테스트 (Spike Test)", "b": "아주 짧은 순간에 사용자를 급격히 늘렸을 때 시스템이 정상 동작하고 다시 회복하는지 확인하는 시험.", "s": false}]}, {"ch": "7. 애플리케이션 테스트 관리", "t": "테스트 커버리지", "star": false, "abbr": "", "items": [{"k": "T", "a": "테스트 커버리지 (Test Coverage)", "b": "시험이 대상의 얼마만큼을 실행하고 검증했는지를 나타내는 비율 지표.", "s": false}, {"k": "T", "a": "기능 기반 커버리지 (Function Coverage)", "b": "시스템의 전체 기능 가운데 시험으로 실제 확인한 기능이 차지하는 비율.\n화면 수 등을 모수로 쓰기도 한다", "s": false}, {"k": "T", "a": "라인 커버리지 (Line Coverage)", "b": "전체 소스 코드 줄 수 가운데 시험 중에 한 번이라도 실행된 줄 수의 비율.", "s": false}, {"k": "T", "a": "코드 커버리지 (Code Coverage)", "b": "소스 코드의 구문·분기·조건 등이 시험으로 얼마나 실행되었는지를 측정하는 지표.", "s": false}]}, {"ch": "7. 애플리케이션 테스트 관리", "t": "코드 커버리지 종류", "star": true, "abbr": "", "items": [{"k": "T", "a": "구문 커버리지 (Statement Coverage)", "b": "프로그램의 모든 명령문을 적어도 한 번씩 실행했는지를 따지는 기준.", "s": false}, {"k": "T", "a": "결정(분기) 커버리지 (Decision Coverage)", "b": "모든 판단문(if·while 등)의 전체 결과가 참과 거짓을 각각 한 번 이상 갖도록 하는 기준.", "s": false}, {"k": "T", "a": "조건 커버리지 (Condition Coverage)", "b": "전체 결과와 상관없이, 판단문 안의 개별 비교식 하나하나가 참과 거짓을 한 번 이상 갖도록 하는 기준.", "s": false}, {"k": "T", "a": "조건/결정 커버리지 (Condition/Decision Coverage)", "b": "판단문의 전체 결과와 개별 비교식의 결과가 모두 참·거짓을 한 번 이상 갖도록 하는 기준.\n앞의 두 기준을 동시에 만족", "s": false}, {"k": "T", "a": "변경 조건/결정 커버리지 (MC/DC, Modified Condition/Decision Coverage)", "b": "각 개별 비교식이 다른 비교식과 상관없이 전체 판단 결과를 독립적으로 바꿀 수 있음을 보이도록 케이스를 짜는 기준.\n항공 등 안전 필수 소프트웨어에서 요구", "s": false}, {"k": "T", "a": "다중 조건 커버리지 (Multiple Condition Coverage)", "b": "판단문 안 개별 비교식들의 참·거짓 가능한 모든 조합을 다 시험하는 기준.\n비교식이 n개면 2ⁿ개 케이스", "s": false}, {"k": "T", "a": "경로 커버리지 (Path Coverage)", "b": "프로그램의 시작부터 끝까
