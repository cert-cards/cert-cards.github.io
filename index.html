<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cert-cards</title>
<meta name="description" content="자격증 실기 대비 정답 가리기 플래시카드 모음">
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --ink:#1d1d1b; --ink-2:#5b5a55; --ink-3:#8b8a84;
  --line:#e2e0d8; --accent:#2f5bd3; --accent-soft:#e6ecfb;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#151513; --surface:#1f1f1c; --ink:#ecebe6; --ink-2:#b4b2aa; --ink-3:#85837b;
    --line:#34332f; --accent:#7d9cf5; --accent-soft:#232b40; color-scheme:dark; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  word-break:keep-all}
.wrap{max-width:720px;margin:0 auto;padding-block:56px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:26px;margin:0;letter-spacing:-.02em}
.lede{color:var(--ink-2);margin:8px 0 32px}
.list{display:grid;gap:12px}
a.deck{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:18px 20px;color:inherit;text-decoration:none;transition:border-color .15s}
a.deck:hover{border-color:var(--accent)}
a.deck:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.deck .name{font-weight:700;font-size:17px}
.deck .meta{color:var(--ink-2);font-size:13.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.deck .go{margin-left:auto;color:var(--accent);font-weight:600;font-size:14px;white-space:nowrap}
.soon{color:var(--ink-3);font-size:13.5px;padding:4px 4px 0}
footer{color:var(--ink-3);font-size:12.5px;margin-top:48px;line-height:1.7}
footer a{color:var(--ink-2)}
</style>
</head>
<body>
<div class="wrap">
  <h1>cert-cards</h1>
  <p class="lede">자격증 실기 대비 플래시카드. 카드를 누르면 정답이 보이고, 퀴즈 모드로 무작위로 끝없이 풀 수 있습니다.</p>
  <div class="list">
    <a class="deck" href="info-processing/">
      <div>
        <div class="name">정보처리기사 실기</div>
        <div class="meta">10과목 · 764장 · 출제기준 과목 순서</div>
      </div>
      <span class="go">열기 →</span>
    </a>
  </div>
  <p class="soon">다른 자격증은 준비되는 대로 추가합니다.</p>
  <footer>
    비공식 학습 자료입니다. 시험 시행 기관과 관련이 없으며, 최신 출제기준은 Q-Net에서 확인하세요.<br>
    <a href="https://github.com/cert-cards/cert-cards.github.io/issues">틀린 내용 제보</a> · MIT License
  </footer>
</div>
</body>
</html>
